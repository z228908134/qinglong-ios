<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --text2:#6c6c70; --text3:#a1a1a6;
  --sep:rgba(60,60,67,.13); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --accent:#1D9E75; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --blue:#007aff; --gray:#8e8e93;
  --r:14px; --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  /* 字号缩放系数。1 = 标准。JS 改这一个值，下面所有 calc(Npx*var(--fs)) 一起变。
     之所以不用 CSS zoom：zoom 会把 env(safe-area-inset-*) 一起放大，
     而那个值和 CSS zoom 的相互作用没法在本机验证，赌错了状态栏内边距会偏。 */
  --fs:1;
}
[data-theme="dark"]{ --bg:#000000; --card:#1c1c1e; --text:#ffffff; --text2:#98989d; --text3:#636366;
    --sep:rgba(84,84,88,.5); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:calc(15px*var(--fs));line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
input,textarea{-webkit-appearance:none;appearance:none;border:0;background:none;outline:none;width:100%}
/* 手机上不该出现横向滚动条：多行文本框一律在屏幕宽度内折行。
   长 token（access token / URL / 私钥）用 anywhere 强制断开；浏览器不认 anywhere 时退回 break-word。
   textarea 默认的软换行不保证断长串，不加这条就会把框撑宽、整页跟着左右晃。 */
textarea{max-width:100%;white-space:pre-wrap;overflow-wrap:break-word;overflow-wrap:anywhere}
.hidden{display:none!important}
/* 「视觉上隐藏但仍在文档里」：文件选择器不能真的 display:none ——
   部分 WebView 对隐藏的 input[type=file] 不弹选择器。 */
.vh{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 变量的值：打码时是短的，用 .ell 单行省略没问题；点「显示值」之后要**完整显示** ——
   京东 cookie 动辄两三百字符，单行省略号截掉以后等于没显示（1.0.24 才发现：
   之前「显示值」只能看到前 40 来个字符，想核对 pt_pin 都得靠猜）。
   加 .full 覆盖掉 .ell 的 nowrap/ellipsis（.envval.full 比 .ell 多一个类，优先级更高）。
   break-all 而不是 break-word：cookie 里没有空格，按词断行会整段溢出。 */
.envval.full{white-space:normal;word-break:break-all;overflow:visible;text-overflow:clip;line-height:1.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t2{color:var(--text2)} .t3{color:var(--text3)}
.f11{font-size:calc(11px*var(--fs))} .f12{font-size:calc(12px*var(--fs))} .f13{font-size:calc(13px*var(--fs))}
.b6{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:calc(11px*var(--fs));font-weight:600;white-space:nowrap}
.pill.green{color:#1a8a3f;background:rgba(52,199,89,.15)}
.pill.blue{color:#0066cc;background:rgba(0,122,255,.14)}
.pill.orange{color:#b26a00;background:rgba(255,149,0,.16)}
.pill.gray{color:var(--text2);background:var(--fill)}
.pill.red{color:#c0392b;background:rgba(255,59,48,.14)}
[data-theme="dark"] .pill.green{color:#5ee27f}[data-theme="dark"] .pill.blue{color:#6cb4ff}[data-theme="dark"] .pill.orange{color:#ffb340}[data-theme="dark"] .pill.red{color:#ff8078}
/* white-space:nowrap：按钮是 inline-flex，里面的文字默认会换行 ——
   头像弹层里三个按钮平分宽度时，「复制地址」就被折成了两行（预览截图里看到的）。
   按钮文案一律不换行，放不下就让它撑宽或者由外层 wrap。 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:11px;
  white-space:nowrap;background:var(--fill);font-weight:600;font-size:calc(15px*var(--fs));transition:opacity .15s}
.btn:active{opacity:.55}
.btn.pri{background:var(--accent);color:#fff}
.btn.danger{background:rgba(255,59,48,.13);color:#d92b20}
[data-theme="dark"] .btn.danger{color:#ff6b61}
.btn[disabled]{opacity:.4}
.sep{height:1px;background:var(--sep);margin-left:14px}

/* ---------- 骨架 ---------- */
#app{display:flex;flex-direction:column;height:100%}
#topbar{padding:calc(var(--top) + 8px) 16px 8px;background:var(--bg);position:relative;z-index:5}
#topbar .ttl{font-size:calc(26px*var(--fs));font-weight:700;letter-spacing:-.4px}
#topbar .sub{font-size:calc(11px*var(--fs));color:var(--text2);margin-top:1px}
#topbar .acts{display:flex;gap:14px;align-items:center}
#topbar .ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--fill);font-size:calc(15px*var(--fs));line-height:1}
/* overflow-x:hidden 是保险：内容万一还是宽了，也不让整页左右晃（各文本框自带滚动）。 */
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px calc(96px + var(--bot))}
/* 批量操作栏两行、比底栏高一截，列表底部的留白要跟着加，否则最后一张卡片被盖住。
   任务页和变量页的批量栏同高，共用一条。 */
#main.cronedit,#main.envsedit{padding-bottom:calc(168px + var(--bot))}
.view{display:none} .view.on{display:block}
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-size:calc(12px*var(--fs));color:var(--text2);transition:height .18s,opacity .18s;opacity:0}
.searchbar{margin-bottom:12px}
.searchbar input{background:var(--fill);border-radius:10px;padding:9px 12px;font-size:calc(15px*var(--fs))}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;
  padding:6px 0 calc(var(--bot));background:rgba(249,249,249,.92);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--sep)}
[data-theme="dark"] #tabbar{background:rgba(22,22,22,.9)}
/* 底栏 5 个入口（依赖 / 配置 / 日志从「我的」进，不占底栏）。
   min-width:0 + nowrap 留着做保险：以后再加入口也不至于把整条底栏撑破。 */
#tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:calc(10px*var(--fs));line-height:1.15;color:var(--text3);padding:4px 0;white-space:nowrap}
#tabbar button.on{color:var(--accent)}
#tabbar .ti{font-size:calc(19px*var(--fs));line-height:1}
/* 「我的」这一项用头像代替字形，选中时套一圈高亮环（照参考图）。
   选择器比 #tabbar .ti 多一个类，能稳定盖住上面的 font-size。 */
#tabbar .ti.av{width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:calc(10px*var(--fs));font-weight:700;color:#fff;background:linear-gradient(135deg,#4ED8A8,#12A16F);
  transition:box-shadow .18s}
#tabbar button.on .ti.av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
/* ---- 任务页工具条（编辑 + 状态筛选），排布照青龙网页版 ---- */
/* ---------- 定时视图 tab（面板「定时任务」页顶部那排） ----------
   横向滚动、不换行。做成「方块 + 主色底」而不是圆角胶囊，是为了跟下面那排
   四档筛选在视觉上区分开 —— 两者是不同层的东西：视图是**服务端**筛选（换的是
   数据集），四档是**本地**过滤（筛的是已加载的列表）。长得一样会让人以为是同一排。 */
.viewtabs{display:flex;gap:7px;margin-bottom:11px;overflow-x:auto;scrollbar-width:none}
.viewtabs::-webkit-scrollbar{display:none}
.vtab{flex:0 0 auto;background:var(--fill);border:0;border-radius:9px;padding:7px 13px;
  color:var(--text2);font-family:inherit;font-size:calc(13px*var(--fs));font-weight:600;
  cursor:pointer;white-space:nowrap}
.vtab.on{background:var(--accent);color:#fff}
.cronbar{display:flex;align-items:center;gap:8px;margin:0 0 10px}
/* 筛选条横向可滚：四个按钮加「编辑」在 320 宽的屏上正好卡边，留一手免得挤成两行 */
.cfwrap{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.cfwrap::-webkit-scrollbar{display:none}
.cfbtn{flex:0 0 auto;background:var(--fill);border:0;border-radius:999px;padding:6px 11px;
  color:var(--text2);font-family:inherit;font-size:calc(12px*var(--fs));font-weight:600;
  cursor:pointer;white-space:nowrap}
.cfbtn.on{background:var(--accent);color:#fff}
/* 批量编辑：卡片左侧的圆圈勾选，选中后填主色 */
.item .ckb{flex:0 0 20px;height:20px;border-radius:50%;border:1.5px solid var(--text3);
  display:flex;align-items:center;justify-content:center;color:transparent;
  font-size:calc(11px*var(--fs));line-height:1;margin-right:2px}
.item.on .ckb{background:var(--accent);border-color:var(--accent);color:#fff}
/* 底部批量操作栏。fixed 贴底并自己吃掉安全区 —— 编辑模式下底栏（#tabbar）整体让位，
   所以不用去猜它有多高，两者也不会互相压住。 */
/* 批量操作栏：拆成两行（主操作 / 状态操作）。一行塞 6 个按钮在 390px 上每个只剩
   ~57px，「取消全选」四个字直接折成两行 —— 拆行比缩字号强。
   任务页和变量页共用这一套样式（两条栏的按钮数不同，但外形、贴底方式、
   安全区处理完全一样，各写一份迟早会不一致）。 */
#cronEditBar,#envEditBar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:block;
  padding:10px 16px calc(10px + var(--bot));
  background:var(--card);border-top:1px solid var(--sep)}
/* 「跳到最新」：日志框往上翻过之后（自动跟随已停）才出现的小按钮。
   固定在右下角、浮在弹层之上 —— 放在日志框上方的工具条里不行，
   日志框有 70vh 高，翻到中间时工具条早滚出屏幕了，按钮等于不存在。 */
#btnLogTail{position:fixed;right:16px;bottom:calc(22px + var(--bot));z-index:46;
  padding:9px 14px;border-radius:999px;border:1px solid var(--sep);
  background:var(--card);color:var(--text);font-family:inherit;
  font-size:calc(12px*var(--fs));cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.32)}
/* ---- 账号切换列表（系统设置 → 账号） ---- */
/* 一行分两段：左边整块是「切到这个账号」，右边单独一个删除。
   按钮不能套按钮（HTML 不允许），所以外面是 div，里面并排两个 button。 */
.acctsw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;
  background:none;border:0;padding:13px 4px;color:var(--text);font-family:inherit;
  font-size:calc(15px*var(--fs));cursor:pointer}
.acctsw .anm{font-weight:500}
.acctdel{flex:0 0 46px;background:none;border:0;color:var(--text3);cursor:pointer;
  padding:13px 0;font-family:inherit;font-size:calc(15px*var(--fs))}
.ck2{flex:0 0 46px;text-align:center;color:var(--accent);font-size:calc(15px*var(--fs))}

/* ---------- 分段控件（当单选组用） ---------- */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;min-width:0;padding:7px 4px;border-radius:8px;font-size:calc(12.5px*var(--fs));font-weight:600;
  color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- 文件路径面包屑 ---------- */
.crumb{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:calc(12px*var(--fs));color:var(--text2);margin:0 4px 10px}
/* 目录名可能很长（比如订阅拉下来的 6dylan6_jdpro），不折行会把面包屑撑出屏幕 */
.crumb button{color:var(--accent);font-weight:600;font-size:calc(12px*var(--fs));max-width:100%;word-break:break-all;text-align:left}

/* ---------- 「所有功能」页（照参考图） ---------- */
/* 「切换账号」胶囊挂在顶栏、大标题上方，所以它不在 #main 里而是单独一个槽，
   由 setTab 控制显隐（其它 tab 要藏起来）。 */
#acctBar{margin-bottom:12px}
.acct{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:5px 13px 5px 5px;
  border-radius:999px;background:var(--fill);font-size:calc(13px*var(--fs));font-weight:600;color:var(--text)}
.acct .av{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:calc(11px*var(--fs));font-weight:700;color:#fff;
  background:linear-gradient(135deg,#4ED8A8,#12A16F)}
.acct .un{max-width:92px}
.acct .sw{flex:none;font-size:calc(11px*var(--fs));font-weight:500;color:var(--text2)}

/* ---------- 顶栏下拉菜单（脚本页的「+」，照参考图） ---------- */
/* 挂成 #topbar 的绝对定位子元素：#topbar 自己就是 position:relative;z-index:5，
   已经是一个层叠上下文，菜单放在里面自然盖在 #main 上面，不用再抬 z-index。
   top:100% 是相对 topbar 的 padding box，所以正好落在标题栏下沿。 */
.dropdown{position:absolute;right:16px;top:100%;margin-top:-2px;min-width:172px;
  background:var(--card);border-radius:14px;padding:6px;
  box-shadow:0 14px 34px -10px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.06);z-index:20}
.dropdown button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;
  border-radius:10px;font-size:calc(14.5px*var(--fs));font-weight:500;color:var(--text);text-align:left}
.dropdown button:active{background:var(--fill)}
.dropdown .di{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:calc(14px*var(--fs));line-height:1;background:var(--fill);color:var(--accent)}
#topbar .ico.pri{background:var(--accent);color:#fff;font-size:calc(20px*var(--fs));font-weight:400}

/* 带图标的搜索框（照参考图：放大镜 + 圆角）。图标绝对定位、不占流，
   所以 input 用 padding-left 给它让位。 */
.searchbar.wi{position:relative}
.searchbar.wi .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:calc(15px*var(--fs));line-height:1;color:var(--text3);pointer-events:none}
.searchbar.wi input{padding-left:34px;font-size:calc(14px*var(--fs));border-radius:12px}

/* ---------- 脚本树（照参考图：文件夹可展开收起，不再逐层下钻） ---------- */
/* 缩进用 padding-left 而不是 margin：卡片背景才跟着一起缩，不会被推窄。
   **基础那 14px 必须写在这条规则里** —— 它的特异性（.stree .ind）比 .item 高，
   会把 .item 的 padding-left 整个盖掉。只写 calc(var(--d,0) * 15px) 的话，
   根级条目（--d:0）会变成 0 内边距，图标直接贴着卡片左边缘。 */
.stree .ind{padding-left:calc(14px + var(--d,0) * 15px)}
.stree .tw{flex:none;width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  font-size:calc(12px*var(--fs));line-height:1;color:var(--text3);transition:transform .15s}
.stree .tw.on{transform:rotate(180deg)}
.stree .fi2{flex:none;width:20px;text-align:center;font-size:calc(15px*var(--fs));line-height:1}

/* ---------- 环境变量标签 ---------- */
/* 颜色按标签名算出来（同一个标签到哪都是同一个色），所以这里只定形状，
   具体的背景/前景色由行内 style 给。 */
.tag{display:inline-flex;align-items:center;max-width:100%;padding:2px 8px;border-radius:7px;
  font-size:calc(11px*var(--fs));font-weight:600;line-height:1.55;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;word-break:break-all}
/* 标签配色：按标签名算 hash 选一个固定色号（同名一定同色 —— 否则同屏出现几个
   一样名字却是不同颜色的标签，看着像 bug）。用类而不是行内 style，才能跟着深色模式换。 */
.tag.tg0{background:rgba(0,122,255,.14);color:#0066cc}
.tag.tg1{background:rgba(52,199,89,.16);color:#1a8a3f}
.tag.tg2{background:rgba(255,149,0,.18);color:#b26a00}
.tag.tg3{background:rgba(175,82,222,.16);color:#8e3fc4}
.tag.tg4{background:rgba(255,59,48,.14);color:#c0392b}
.tag.tg5{background:rgba(0,190,182,.18);color:#0b8a85}
.tag.tg6{background:rgba(90,110,255,.16);color:#3a4ad6}
.tag.tg7{background:rgba(120,120,128,.18);color:#5a5a63}
[data-theme="dark"] .tag.tg0{background:rgba(0,122,255,.26);color:#7ab8ff}[data-theme="dark"] .tag.tg1{background:rgba(52,199,89,.24);color:#5ee27f}[data-theme="dark"] .tag.tg2{background:rgba(255,149,0,.24);color:#ffb340}[data-theme="dark"] .tag.tg3{background:rgba(175,82,222,.28);color:#c88cf0}[data-theme="dark"] .tag.tg4{background:rgba(255,59,48,.26);color:#ff8078}[data-theme="dark"] .tag.tg5{background:rgba(0,190,182,.26);color:#4fd8d2}[data-theme="dark"] .tag.tg6{background:rgba(90,110,255,.28);color:#93a0ff}[data-theme="dark"] .tag.tg7{background:rgba(120,120,128,.3);color:#b0b0b8}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tagbar button{padding:4px 11px;border-radius:999px;background:var(--fill);font-size:calc(12px*var(--fs));
  font-weight:600;color:var(--text2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagbar button.on{background:var(--accent);color:#fff}

/* ---------- 「我的」页的面板概览（照参考图） ---------- */
.sec{margin:18px 4px 10px;font-size:calc(13px*var(--fs));font-weight:600;color:var(--text2)}
.ovcard{background:var(--card);border-radius:var(--r);padding:14px}
.ovcard .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#34c759}
.ovcard .big{font-size:calc(22px*var(--fs));font-weight:700;letter-spacing:-.3px;margin-top:9px;word-break:break-all}
.ovcard .meta{font-size:calc(11.5px*var(--fs));color:var(--text2);margin-top:5px;word-break:break-all}
/* 面板卡：左边文字、右边头像。头像**垂直居中**靠的是父级的 align-items:center
   （不是 margin 硬凑） —— 左侧文字行数会变（有的面板没有 branch / uptime），
   写死 margin 的话行一少头像就偏。 */
.ovcard.ovhost{display:flex;align-items:center;gap:13px}
.ovcard.ovhost>.sp{min-width:0}
.hav{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:calc(20px*var(--fs));font-weight:700;color:#fff;
  background:linear-gradient(135deg,#5AD1E8,#1E9CC0);
  box-shadow:0 6px 14px -6px rgba(30,156,192,.6)}
/* 面板头像（<img>）。尺寸由**父级**定（主机卡 46px / 账号胶囊 24px / 底栏「我的」21px），
   图自己只负责铺满并裁成圆。object-fit:cover 不能省 —— 面板「更换头像」上传的是原图，
   长宽比不一定是 1:1，不裁的话圆头像里的人/图会被拉扁。 */
.avimg{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
/* 主机卡的头像可点 —— cursor:pointer 给个暗示，-webkit-tap-highlight-color 关掉
   不然点击会有系统灰底一闪，渐变底+彩图上特别丑。 */
.hav{cursor:pointer;-webkit-tap-highlight-color:transparent}
/* 大图弹层。容器居中，下面挨着元信息和按钮。padding 跟普通弹层一致。 */
.avsheet{display:flex;flex-direction:column;align-items:center;padding:18px 16px 4px}
.avbig{width:220px;height:220px;border-radius:50%;object-fit:cover;display:block;
  box-shadow:0 14px 34px -10px rgba(0,0,0,.35)}
/* 没图就用首字母当占位，**复用**主卡头像的渐变色 —— 用户一眼能认出是同一个圈。 */
.avbig-fb{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;
  font-size:calc(92px*var(--fs));background:linear-gradient(135deg,#5AD1E8,#1E9CC0);
  box-shadow:0 14px 34px -10px rgba(30,156,192,.6)}
.avbig-meta{margin-top:14px;font-size:calc(14px*var(--fs));color:var(--text);font-weight:600;
  text-align:center}
.avbig-tip{margin-top:8px;font-size:calc(12px*var(--fs));color:var(--text2);text-align:center;
  line-height:1.5;padding:0 8px}
/* 头像弹层底部的面板地址：等宽字体，长了就省略 ——
   这行的作用是「确认现在连的是哪台面板」，截断了也不影响。 */
.avbig-url{margin-top:10px;max-width:100%;font-size:calc(11px*var(--fs));color:var(--text3);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
/* 「正在执行 N 个 / 排队 N 个」高亮：主色 + 数字加粗，跟面板运行时间那段区分开 */
.ovcard .meta.live{margin-top:9px;font-size:calc(13px*var(--fs));color:var(--text)}
.ovcard .live-num{color:var(--accent);font-weight:700;font-size:calc(15px*var(--fs));margin:0 2px}
.ov2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ov2 .ovcard{padding:13px 13px 15px}
.ov2 .ic{flex:none;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:calc(15px*var(--fs));line-height:1;color:#fff}
.ov2 .pc{margin-left:auto;font-size:calc(15px*var(--fs));font-weight:700}
.ov2 .lb{font-size:calc(11.5px*var(--fs));color:var(--text2);margin-top:10px;word-break:break-all}
/* 进度条：轨道 fill，填充用行内渐变 + 宽度 */
.meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;border-radius:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 4px;text-align:center}
.stats .n{font-size:calc(20px*var(--fs));font-weight:700;line-height:1.2}
/* 今日失败 > 0 时标红。用 --red（浅色主题下是 iOS 红，深色下也够亮），
   不另开颜色变量 —— 免得又和主题那套替换机制打架。 */
.stats .n.bad{color:var(--red)}
.stats .l{font-size:calc(11px*var(--fs));color:var(--text2);margin-top:3px}
/* 近 7 日趋势。每列一根柱：柱高 = 当天执行数 / 七天里最大的那天；
   柱子里**贴底**那段是成功数（绿），上面一截是失败数（红）。
   贴底而不是贴顶，是因为柱子是从基线往上长的 —— 反过来会看着像倒挂。 */
.trend{display:flex;align-items:flex-end;gap:5px}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.trend .tv{font-size:calc(11px*var(--fs));color:var(--text2);margin-bottom:4px;font-weight:600}
.trend .tbar{width:100%;height:92px;display:flex;align-items:flex-end;
  background:var(--fill);border-radius:5px;overflow:hidden}
.trend .tbar i{display:block;width:100%;position:relative;background:var(--red);border-radius:5px}
.trend .tbar i b{position:absolute;left:0;right:0;bottom:0;display:block;
  background:var(--green);border-radius:5px}
.trend .td{font-size:calc(10px*var(--fs));color:var(--text3);margin-top:5px;white-space:nowrap}
.tlg{display:flex;gap:14px;margin-top:11px;font-size:calc(11px*var(--fs));color:var(--text2)}
.tlg .d{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}
/* 1.0.25：7 / 30 天切换。7 天看不出「是不是越来越常失败」，30 天才看得出。
   两个小按钮长在标题右侧（.tsw），点一下只重拉趋势那一个接口。 */
.tsw{display:flex;gap:5px}
.tsw button{padding:4px 10px;border-radius:999px;border:1px solid var(--sep);
  background:transparent;color:var(--text2);font-family:inherit;
  font-size:calc(11px*var(--fs));cursor:pointer}
.tsw button.on{background:var(--tint);border-color:var(--accent);color:var(--accent);font-weight:600}
/* 30 天时一根柱子只剩 ~9px 宽，柱顶那个两位数（「12」）根本塞不下，
   硬塞会互相挤到看不清 —— 所以 30 天模式直接不显示柱顶数字，
   要看某天具体多少次就点那根柱子（读数在 .tread 里）。 */
.trend.d30{gap:3px}
.trend.d30 .tv{display:none}
/* 每根柱子是可以点的（看那天的成功/失败各多少次）。button 要清掉默认样式，
   否则它在 .trend 的 flex 里会被撑出内边距、跟别的柱子对不齐。 */
.tb{background:none;border:0;padding:0;margin:0;font-family:inherit;color:inherit;cursor:pointer}
.tb.on .tbar{outline:2px solid var(--accent);outline-offset:1px}
/* 读数：默认显示整个区间的汇总，点了某根柱子就显示那天。 */
.tread{font-size:calc(11px*var(--fs));color:var(--text2);margin-top:8px;line-height:1.5}
.tread b{color:var(--text);font-weight:600}
/* 主页「N 个任务正在执行」可点 —— 点了跳到任务页的「运行中」筛选。
   同样是 button 清零默认样式（它长在 .meta 里，字号要跟着父级）。 */
.livebtn{background:none;border:0;padding:0;font-family:inherit;font-size:inherit;
  color:inherit;cursor:pointer;text-align:left;display:block;width:100%}

/* 2 列卡片网格。 */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* 卡片：标题左上、图标右中、箭头左下。
   三个元素都用绝对定位钉住，**不依赖 flex 定位**：
   真机上出现过箭头和图标挤在一起的现象 —— 图标紧贴箭头、而卡片右侧空着一大块，
   说明 justify-content:space-between 没生效。最可能的原因是老 WebView 对
   <button> 上的 display:flex 支持不好，按钮退回 inline-block 后宽度收缩成内容宽，
   space-between 就没空间可分了。
   所以这里：① display:block + width:100% 保证卡片一定填满网格单元；
   ② 图标 / 箭头绝对定位，卡片多宽都不影响它们落在该在的角上。 */
.fcard{position:relative;display:block;width:100%;min-height:120px;
  padding:14px 14px 50px;border-radius:18px;background:var(--card);text-align:left}
/* 标题右侧留出 54px 给图标，再长的标题也不会钻到图标底下 */
.fcard .ft{font-size:calc(14.5px*var(--fs));font-weight:600;line-height:1.3;word-break:break-all;
  max-width:calc(100% - 54px)}
/* 图标：贴右边缘、垂直居中（「右中」） */
.fcard .fi{position:absolute;right:13px;top:50%;transform:translateY(-50%);
  width:42px;height:42px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:calc(19px*var(--fs));line-height:1;color:#fff}
/* 圆形进入按钮：钉在左下角，用主色（照参考图那个箭头是绿的；灰色太淡几乎看不见） */
.fcard .go{position:absolute;left:14px;bottom:14px;
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:calc(13px*var(--fs));line-height:1;
  color:var(--accent)}
/* 窄屏（≤340px）卡片只剩约 138px，留给标题的宽度不够 4 个字 —— 缩字号 + 少给图标留位，
   否则「定时任务」会折成「定时任/务」，很难看。 */
@media (max-width:340px){
  .fcard .ft{font-size:calc(13.5px*var(--fs));max-width:calc(100% - 46px)}
}

/* ---------- 文本编辑器 ---------- */
/* pre-wrap 而不是 pre：pre 不折行，手机上只能左右拖着看 —— 这就是「输入框不适配屏幕」的根因。
   高度用 dvh（可视视口）：vh 在移动端按「地址栏收起后」的最大高度算，
   键盘弹起 / 地址栏变化时会把框顶出屏幕，dvh 跟随实际可视高度。不支持 dvh 时退回 vh。 */
.editor{width:100%;max-width:100%;min-height:44vh;min-height:44dvh;background:var(--card);
  border-radius:var(--r);padding:12px 13px;
  font-size:calc(12.5px*var(--fs));line-height:1.65;resize:vertical;white-space:pre-wrap;
  overflow-wrap:break-word;overflow-wrap:anywhere;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---------- 列表 ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:var(--r);padding:13px 14px}
.item .nm{font-size:calc(15px*var(--fs));font-weight:600;word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:calc(10px*var(--fs));padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--text2);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.empty{text-align:center;color:var(--text2);padding:56px 20px}
.empty .ei{font-size:calc(40px*var(--fs));opacity:.35;display:block;margin-bottom:12px}
.secttl{font-size:calc(12px*var(--fs));font-weight:600;color:var(--text2);margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.4px}
.kv{display:flex;gap:12px;padding:11px 14px;font-size:calc(14px*var(--fs));align-items:flex-start}
.kv .k{color:var(--text2);flex:0 0 72px}
.kv .v{flex:1;text-align:right;word-break:break-all}
.kv .v.left{text-align:left}
/* 「外观模式 ›」这种带箭头的设置行。套在 .card 里，整条可点；
   跟 .kv 共享左右边距和字号。 */
.kvrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;
  font-size:calc(14px*var(--fs));text-align:left}
.kvrow .k{color:var(--text2);flex:0 0 72px}
.kvrow .v{flex:1;min-width:0;text-align:right;color:var(--accent);font-weight:500}
/* 一张卡里放多行设置时要有分隔线（比如「外观」卡里的外观模式 + 字体大小） */
.kvrow:not(:last-child){border-bottom:1px solid var(--sep)}
/* 外观选择弹层里的三个选项（照参考图） */
.theme-opt{display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:13px 16px;font-size:calc(15px*var(--fs));border-radius:0}
.theme-opt:not(:last-child){border-bottom:1px solid var(--sep)}
.theme-opt.on{color:var(--accent);font-weight:600}
.theme-opt .ck{color:var(--accent);font-size:calc(18px*var(--fs));line-height:1}

/* ---------- 字体大小（拖动调节） ---------- */
/* 预览区。整页字号都挂在 --fs 上，所以这里**不用做任何特殊处理** ——
   改 --fs 它自己就跟着变，真正所见即所得。 */
.fsdemo{background:var(--card);border-radius:var(--r);padding:16px 16px 18px}
.fsdemo .dt{font-size:calc(17px*var(--fs));font-weight:600;margin-bottom:7px}
.fsdemo .ds{font-size:calc(13px*var(--fs));color:var(--text2);line-height:1.65}

/* 滑杆那一行：小 A —— 滑杆 —— 大 A */
.fsrow{display:flex;align-items:center;gap:14px}
/* 两端的 A 同时是「点一下进一档」的按钮。左边小、右边大，方向一眼看出来。 */
.fsa{flex:none;width:34px;height:34px;border-radius:10px;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;
  color:var(--accent);transition:opacity .15s}
.fsa:active{opacity:.55}
/* 到两头就置灰（syncFsBtns 管的）。不置灰的话用户会一直点，以为卡住了。 */
.fsa[disabled]{opacity:.3}
.fsa.sm{font-size:calc(12px*var(--fs))}
.fsa.lg{font-size:calc(21px*var(--fs))}
.fsval{text-align:center;font-size:calc(12px*var(--fs));color:var(--text2);margin-top:12px}
.fsval b{color:var(--text);font-size:calc(15px*var(--fs))}

/* 滑杆本体。**必须自己画轨道和滑块**：上面那条
   `input,textarea{appearance:none;background:none}` 会把 range 的原生轨道和滑块
   一起干掉 —— 不画的话就是一条看不见也点不着的线（页面上不报错，
   表现是「拖动条没反应」，最难查的那类问题）。 */
#fsRange{-webkit-appearance:none;appearance:none;flex:1;min-width:0;width:auto;
  height:30px;background:none}
#fsRange::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--fill2)}
#fsRange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:26px;height:26px;margin-top:-11px;border-radius:50%;background:#fff;
  box-shadow:0 1px 5px rgba(0,0,0,.3)}
/* 深色下滑块还是白的（照 iOS），但要给轨道提亮一点，否则整条看不清。
   ⚠️ 深色规则**必须写成媒体查询**：属性选择器那种形式是构建脚本改写出来的产物，
   源码里直接写的话，手动/自动两份深色规则会同时存在，以后改一处忘另一处就开始打架。
   （这里也刻意不把两个选择器写进注释 —— 静态检查是在整段样式上做正则的。） */
[data-theme="dark"] #fsRange::-webkit-slider-runnable-track{background:rgba(255,255,255,.28)}
#fsRange::-moz-range-track{height:4px;border-radius:2px;background:var(--fill2)}
#fsRange::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;
  box-shadow:0 1px 5px rgba(0,0,0,.3)}
.code{background:var(--fill);border-radius:10px;padding:11px 12px;font-size:calc(12px*var(--fs));line-height:1.5;
  white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.logbox{background:#12161c;color:#d6e2ee;border-radius:11px;padding:11px 12px;font-size:calc(11px*var(--fs));line-height:1.55;
  white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;
  max-height:46vh;max-height:46dvh;overflow:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
/* 日志 / 文件正文的加高版本，替代原先 4 处内联高度
   （内联样式会盖住上面这条，而且写死了 vh，键盘弹起会把框顶出屏幕）。 */
.logbox.lg{max-height:70vh;max-height:70dvh}
/* 面板日志的级别配色。.logbox 的底色恒为深色（终端观感，不跟主题走），
   所以这里也写死亮色文字 —— 用主题变量的话浅色主题下会变成深底深字。 */
.logbox .lv-error{color:#ff8f8f}
.logbox .lv-warn{color:#ffd479}
.logbox .lv-info{color:#8fd0ff}
.logbox .lv-debug{color:#93a0ad}
/* 「只看错误」模式下每行前面的行号。**独立于级别色**（不套在 .lv-error 里），
   否则行号也会跟着变红。复制走的是原始文本，不带行号。 */
.logbox .ln{display:inline-block;width:3.4em;text-align:right;margin-right:.7em;
  color:#5d6b7a;user-select:none}
/* 搜索命中的字。同样是**写死的颜色**（.logbox 底色恒为深色）：
   黄底 + 近黑字，深底上最扎眼，也不跟主题走。 */
.logbox .hl{background:#ffd479;color:#1a1200;border-radius:2px}
/* 列表里的搜索命中：**同一个黄底**（用户已经知道「黄底 = 命中」，不另造一套）。
   作用域必须单独写 —— 上面那条是 `.logbox .hl`，出了日志框不生效。
   黄底 + 深色字在两套主题下都看得清，所以写死颜色，不跟主题变量。 */
.item .hl{background:#ffd479;color:#1a1200;border-radius:2px}
.spin{width:16px;height:16px;border:2px solid var(--fill2);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.center{display:flex;align-items:center;justify-content:center;gap:8px;padding:36px;color:var(--text2);font-size:calc(13px*var(--fs))}

/* ---------- 面板设置（应用设置 / 其他设置 / 登录日志） ---------- */

/* 凭据行。Client ID 是 32 位十六进制，窄屏 + 最大字号下横着放不下
   「标签 + 值 + 两个按钮」，所以让标签独占一行（flex:0 0 100% 强制换行），
   值那一行才有整行宽度给等宽字。 */
.cred{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:9px}
.cred .cl{flex:0 0 100%;font-size:calc(11px*var(--fs));color:var(--text2)}
.cred .cv{flex:1;min-width:0;font-size:calc(11.5px*var(--fs));color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
/* 贴在凭据后面的小按钮。比 .btn 矮一档 —— 一行里要塞两个。 */
.cpb{flex:none;padding:4px 10px;border-radius:8px;background:var(--fill);
  font-size:calc(11px*var(--fs));font-weight:600;color:var(--accent)}
.cpb:active{opacity:.55}
/* 换密钥后弹出来的那串新密钥：要一眼看清、要好选中，所以放大 + 等宽 + 允许断行，
   并加 user-select:all 让长按一次选中整串（不然 32 位要点半天）。 */
.cv2{font-size:calc(14px*var(--fs));line-height:1.6;word-break:break-all;user-select:all;
  -webkit-user-select:all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* 权限多选：两列。八个权限正好四行，一眼看全，比下拉框少一次点击。
   手机上原生 <select multiple> 基本没法用，checkbox 又太小点不准。 */
.scopegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.scopebtn{padding:11px 8px;border-radius:11px;background:var(--card);
  font-size:calc(13px*var(--fs));font-weight:600;color:var(--text2);
  border:1.5px solid transparent;transition:opacity .15s}
.scopebtn:active{opacity:.55}
.scopebtn.on{background:rgba(0,122,255,.12);color:var(--accent);border-color:var(--accent)}
[data-theme="dark"] .scopebtn.on{background:rgba(10,132,255,.2)}

/* 「其他设置」里的字段：标签 + 输入框 + 一个确认按钮，照面板网页版的排法。
   不做「改完自动保存」—— 这些是会影响面板运行的开关，误触代价比多点一次大。 */
.fld{padding:9px 0}
.fld .fl{margin-bottom:4px}
.fl{font-size:calc(11px*var(--fs));color:var(--text2)}
/* 确认按钮占满卡片宽度，但比 .btn 矮一档 —— 一屏里要塞六七个字段。
   margin-bottom 跟卡片的下内边距(4px)凑成 14px，跟左右对齐。 */
.fldbtn{width:100%;padding:9px;margin-bottom:10px;font-size:calc(14px*var(--fs));background:var(--fill)}
/* 输入框 + 单位（「天」）同行 */
.inrow{display:flex;align-items:center;gap:8px}
.inrow input{flex:1;min-width:0}
.inrow .unit{flex:none;font-size:calc(13px*var(--fs));color:var(--text2)}
/* 下拉框：只统一字号/颜色，**不设 appearance:none** —— 保留系统箭头，
   用户一眼就知道能点（自己画箭头在深色模式下容易糊成一块）。 */
select{max-width:100%;font-size:calc(14px*var(--fs));background:none;text-overflow:ellipsis}

/* 备份模块多选：也是两列，但比权限按钮矮（有 10 项，太高要滚很久才看得到「备份」按钮） */
.modgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modbtn{padding:9px 6px;border-radius:10px;background:var(--fill);
  font-size:calc(12px*var(--fs));font-weight:600;color:var(--text2);
  border:1.5px solid transparent;transition:opacity .15s}
.modbtn:active{opacity:.55}
.modbtn.on{background:rgba(0,122,255,.12);color:var(--accent);border-color:var(--accent)}
/* 「基础数据」恒选中且点不动（后端 exportData() 里 base 对应 db + upload，
   面板网页版里这项也是 disabled 的）。压暗一点表示「选着，但你别碰」。 */
.modbtn.fixed{opacity:.7}
[data-theme="dark"] .modbtn.on{background:rgba(10,132,255,.2)}

/* 「面板设置」那三行右边不是「当前值」而是一句说明，走灰色而不是 .kvrow .v 的主色。
   必须写成 .kvrow .v.desc（三个类）才压得住上面那条 (0,2,0) 的规则。 */
.kvrow .v.desc{color:var(--text3);font-weight:400;font-size:calc(12px*var(--fs))}

/* ---------- 弹层 ---------- */
/* z-index 必须高于 #login(30)：登录失败时用户进不去主界面，诊断只能从登录页发起，
   弹层要是压在登录页下面，表现就是「点了没反应」。（踩过一次，别改小。） */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
#sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .22s}
#sheet.on .mask{opacity:1}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;top:calc(var(--top) + 6px);
  background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);overflow:hidden}
#sheet.on .panel{transform:translateY(0)}
#sheet .head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--sep)}
#sheet .head .t{font-size:calc(16px*var(--fs));font-weight:600;flex:1;min-width:0}
#sheet .body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 16px calc(20px + var(--bot))}
#sheet .x{font-size:calc(15px*var(--fs));color:var(--accent);font-weight:600}
#toast{position:fixed;left:0;right:0;top:calc(var(--top) + 10px);z-index:50;display:flex;
  justify-content:center;pointer-events:none}
#toast .t{max-width:86%;padding:9px 15px;border-radius:12px;font-size:calc(13px*var(--fs));font-weight:500;
  background:rgba(28,28,30,.92);color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.22);
  transform:translateY(-24px);opacity:0;transition:transform .22s,opacity .22s}
#toast.on .t{transform:translateY(0);opacity:1}
#toast .t.err{background:rgba(200,40,30,.95)}

/* ---------- 登录 ---------- */
/* 用 block + overflow-y:auto 而不是 flex 居中：内容一多（小屏 + 记住密码 + 安全提示），
   居中的 flex 容器会把顶部溢出部分裁掉且滚不到，按钮就点不着了。 */
#login{position:fixed;inset:0;z-index:30;background:var(--bg);display:block;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(var(--top) + 8vh) 24px calc(var(--bot) + 24px)}
#login .logo{width:76px;height:76px;border-radius:20px;margin:0 auto 16px;display:block}
#login h1{font-size:calc(21px*var(--fs));font-weight:700;text-align:center;margin:0 0 4px}
#login .sub{text-align:center;color:var(--text2);font-size:calc(13px*var(--fs));margin-bottom:26px}
.field{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.field label{display:block;font-size:calc(11px*var(--fs));color:var(--text2);margin-bottom:3px}
.field input{font-size:calc(16px*var(--fs))}
.rem{display:flex;align-items:center;gap:9px;font-size:calc(12.5px*var(--fs));color:var(--text2);
  margin:14px 4px 2px;line-height:1.5}
.rem input{width:17px;height:17px;flex:none;margin:0;accent-color:var(--accent)}
.warn{background:rgba(255,149,0,.12);border-radius:11px;padding:10px 12px;font-size:calc(11.5px*var(--fs));
  line-height:1.55;color:#8a5a00;margin-top:16px}
[data-theme="dark"] .warn{color:#ffc766}
</style>
</head>
<body>

<div id="login" class="hidden">
  <img class="logo" id="loginLogo" alt="">
  <h1>青龙管家</h1>
  <div class="sub">连接你的青龙面板</div>
  <div class="field"><label>面板地址</label>
    <input id="inServer" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="http://192.168.1.10:5700"></div>
  <div class="field"><label>用户名</label>
    <input id="inUser" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="admin"></div>
  <div class="field"><label>密码</label>
    <input id="inPass" type="password" placeholder="••••••••"></div>
  <div class="field hidden" id="codeField"><label>两步验证码</label>
    <input id="inCode" type="text" inputmode="numeric" maxlength="6" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="6 位动态码"></div>
  <label class="rem" for="inRemember">
    <input type="checkbox" id="inRemember">
    <span>记住账号密码，下次打开直接进</span></label>
  <button class="btn pri" id="btnLogin" style="width:100%;margin-top:6px">登录</button>
  <button class="btn" id="btnDiagLogin" style="width:100%;margin-top:10px">连不上？点这里诊断</button>
  <div class="warn">面板是明文 http 时，密码会以明文经过网络。建议给面板配上 HTTPS，或只在可信网络里使用。<br>
    勾选「记住账号密码」后，凭据会存在本机 App 的私有目录里（其他应用读不到），
    但手机若已 root 或被人拿到，仍可能被读走 —— 不放心就取消勾选。</div>
</div>

<div id="app" class="hidden">
  <div id="topbar">
    <!-- 「所有功能」页的「切换账号」胶囊放在大标题上方，照参考图。其它 tab 藏起来。 -->
    <div id="acctBar" class="hidden"></div>
    <div class="row">
      <div class="sp">
        <div class="ttl" id="ttl">定时任务</div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="acts">
        <button class="ico hidden" id="btnBack" title="返回">‹</button>
        <button class="ico" id="btnRefresh" title="刷新">↻</button>
        <!-- 顶栏「+」（照参考图：主色实心圆）。任务 / 环境变量 / 脚本 / 订阅 /
             依赖 / 配置文件 这几页才出现，其余 tab 藏起来。
             脚本页点开是下拉菜单，别的页直接进新建表单。 -->
        <button class="ico pri hidden" id="btnScrAdd" title="新建">+</button>
      </div>
    </div>
    <!-- 「+」的下拉菜单（照参考图：挂在按钮下方、右对齐）。
         放在 #topbar 里而不是 #main 里，才不会跟着列表一起滚走。 -->
    <div id="scrAddMenu" class="dropdown hidden">
      <button data-sact="upload"><span class="di">⇪</span><span class="sp" style="text-align:left">上传脚本</span></button>
      <button data-sact="newfile"><span class="di">✚</span><span class="sp" style="text-align:left">新建脚本</span></button>
      <button data-sact="newdir"><span class="di">⌸</span><span class="sp" style="text-align:left">新建文件夹</span></button>
    </div>
  </div>
  <div id="main">
    <div id="ptr">↓ 下拉刷新</div>

    <!-- 主页：底栏最左。只有面板概览（面板 / 系统状态 / 任务概况 / 近 7 日趋势），
         功能模块不在这里 —— 留在「我的」。 -->
    <section class="view" id="v-home">
      <div id="homeBody"></div>
    </section>

    <section class="view" id="v-crons">
      <!-- 定时视图 tab：对应面板「定时任务」页顶部那排。
           内容是 /api/crons/views 拉回来的**保存好的筛选条件**（不是时间轴）。
           拉不到（老面板没这个接口）或一个视图都没有时整条藏起来，任务页照常可用。 -->
      <div class="viewtabs hidden" id="cronViewTabs"></div>
      <div class="searchbar"><input id="cronSearch" type="search" placeholder="搜索任务名 / 命令 / 标签" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <!-- 工具条：左边「编辑」（进批量模式），右边四个状态筛选，排布照青龙网页版。
           四个筛选跟后端 status 字段一一对应 —— 运行中 0 / 未使用 1 / 已禁用 2
           （排队中 3 归进「运行中」，它也是「在用」）。见 cronBucket()。 -->
      <div class="cronbar">
        <button class="cfbtn" id="btnCronEdit">编辑</button>
        <div class="cfwrap" id="cronFilters"></div>
      </div>
      <div class="list" id="cronList"></div>
      <div id="cronFoot"></div>
    </section>

    <section class="view" id="v-envs">
      <div class="searchbar"><input id="envSearch" type="search" placeholder="搜索变量名" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <!-- 工具条：「编辑」进批量模式（全选 / 启用 / 禁用 / 删除），排布照任务页。
           变量一多（京东 cookie 一堆账号）逐个点按钮太慢，而且「批量删掉过期的那几个」
           是换 cookie 时的常规操作。 -->
      <div class="cronbar">
        <button class="cfbtn" id="btnEnvEdit">编辑</button>
      </div>
      <!-- 标签筛选条：点一个标签就只看带这个标签的变量，选中态高亮。
           没有标签时不占位置（renderEnvs 里控制显隐）。 -->
      <div class="tagbar hidden" id="envTagBar"></div>
      <div class="list" id="envList"></div>
      <div style="margin-top:12px"><button class="btn" id="btnNewEnv" style="width:100%">+ 新建环境变量</button></div>
    </section>

    <section class="view" id="v-scripts">
      <div class="searchbar wi">
        <span class="si">⌕</span>
        <input id="scrSearch" type="search" placeholder="搜索脚本名称或路径…" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="list stree" id="scrList"></div>
      <!-- 文件选择器：点「上传脚本」时用 JS 触发它，选完在 change 里直接上传 -->
      <input type="file" id="filePick" class="vh" aria-hidden="true" tabindex="-1">
    </section>

    <section class="view" id="v-subs">
      <div class="searchbar"><input id="subSearch" type="search" placeholder="搜索订阅名 / 链接" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="list" id="subList"></div>
      <div style="margin-top:12px"><button class="btn" id="btnNewSub" style="width:100%">+ 新建订阅</button></div>
    </section>

    <section class="view" id="v-deps">
      <div class="seg" id="depSeg">
        <button data-segval="nodejs" class="on">NodeJs</button>
        <button data-segval="python3">Python3</button>
        <button data-segval="linux">Linux</button>
      </div>
      <div class="searchbar" style="margin-top:12px"><input id="depSearch" type="search" placeholder="搜索依赖名" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="list" id="depList"></div>
      <div style="margin-top:12px"><button class="btn" id="btnNewDep" style="width:100%">+ 新建依赖</button></div>
    </section>

    <section class="view" id="v-configs">
      <div class="list" id="cfgList"></div>
      <div style="margin-top:12px"><button class="btn" id="btnNewCfg" style="width:100%">+ 新建配置文件</button></div>
    </section>

    <section class="view" id="v-logs">
      <!-- 填了东西就跨目录找文件名（日志树是一次性整棵拉回来的，不用再打接口）；
           清空就回到正常的目录浏览。 -->
      <div class="searchbar"><input id="logSearch" type="search" placeholder="搜索日志文件名"
        autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div id="logCrumbs" class="f12 t2" style="margin:0 4px 10px"></div>
      <div class="list" id="logList"></div>
    </section>

    <!-- 应用设置：面板「系统设置 → 应用设置」的移动版。管理开放接口的
         Client ID / Secret 和权限。入口在「我的 → 系统设置」里的面板设置区块。 -->
    <section class="view" id="v-apps">
      <div class="list" id="appList"></div>
      <div style="margin-top:12px"><button class="btn" id="btnNewApp" style="width:100%">+ 新建应用</button></div>
    </section>

    <!-- 其他设置：面板「系统设置 → 其他设置」的移动版。 -->
    <section class="view" id="v-sysconf">
      <div id="sysconfBody"></div>
      <!-- 还原数据用的文件选择器：点「还原数据」时由 JS 触发 -->
      <input type="file" id="fileScImport" accept=".tgz,.tar.gz,application/gzip" class="vh" aria-hidden="true" tabindex="-1">
    </section>

    <!-- 登录日志：面板「系统设置 → 登录日志」的移动版。 -->
    <section class="view" id="v-loginlog">
      <div class="list" id="loginlogList"></div>
    </section>

    <!-- 面板日志：面板「系统设置 → 系统日志」的移动版。接口回的是纯文本，
         所以这里是「分段按钮 + 刷新/清空 + 一个等宽滚动块」，不是列表。 -->
    <section class="view" id="v-syslog">
      <div id="syslogBody"></div>
    </section>

    <section class="view" id="v-me">
      <div id="meBody"></div>
    </section>
  </div>

  <!-- 底栏只留四项：订阅原先占的那一格换成「我的」。
       订阅管理、依赖管理、面板日志、应用设置、其他设置这些全部收进「我的」页，
       底栏放五个塞不下，而且这些页不是天天用的。 -->
  <nav id="tabbar">
    <button data-tab="home"><span class="ti">◰</span>主页</button>
    <button data-tab="crons"><span class="ti">▤</span>任务</button>
    <button data-tab="envs"><span class="ti">⚿</span>变量</button>
    <button data-tab="scripts"><span class="ti">⌘</span>脚本</button>
    <button data-tab="me"><span class="ti av" id="tabAv">◍</span>我的</button>
  </nav>
  <!-- 任务页批量编辑时的底部操作栏。fixed 贴底，编辑模式下底栏（#tabbar）整体让位
       —— 这样就不用去猜底栏有多高，也不会互相压住。见 renderCronEditBar()。
       变量页同理，见 renderEnvEditBar()。两条栏共用同一套 CSS。 -->
  <div id="cronEditBar" class="hidden"></div>
  <div id="envEditBar" class="hidden"></div>
  <!-- 「跳到最新」：日志框往上翻过之后（自动跟随已停）才出现，见 syncLogTail()。
       页面级 fixed 元素 —— 弹层 #sheet 是 z-index 40，这条给 46 才压得住它。
       放在日志框上方的工具条里不行：日志框有 70vh 高，翻到中间时工具条早滚出屏幕了。 -->
  <button id="btnLogTail" class="hidden">跳到最新 ↓</button>
</div>

<div id="sheet"><div class="mask"></div><div class="panel">
  <div class="head"><div class="t" id="shT"></div><button class="x" id="shX">关闭</button></div>
  <div class="body" id="shB"></div>
</div></div>

<div id="toast"><div class="t" id="toastT"></div></div>

<script>
(function () {
'use strict';

/* ================= 基础工具 ================= */
var $ = function (s) { return document.querySelector(s); };
var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
var pad = function (n) { return String(n).padStart(2, '0'); };

var toastTimer = null;
function toast(msg, isErr) {
  var box = $('#toast'), t = $('#toastT');
  t.textContent = msg;
  t.className = 't' + (isErr ? ' err' : '');
  box.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { box.classList.remove('on'); }, 2400);
}

// 面板多半是明文 http，navigator.clipboard 在非安全上下文下不存在，所以要兜底
function copyText(text) {
  text = String(text == null ? '' : text);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { toast('已复制'); }, function () { fallbackCopy(text); });
    return;
  }
  fallbackCopy(text);
}
function fallbackCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    toast(ok ? '已复制' : '复制失败，请长按选择', !ok);
  } catch (e) {
    toast('复制失败，请长按选择', true);
  }
}

/* ================= 状态 ================= */
var K = {
  server: 'ql.server', user: 'ql.user', pass: 'ql.pass',
  token: 'ql.token', tab: 'ql.tab', remember: 'ql.remember', auto: 'ql.auto',
  theme: 'ql.theme', fs: 'ql.fs',
  /* 登录过的账号列表（多账号切换用），JSON 数组，见 acctRemember() */
  accts: 'ql.accts'
};
/* 登录页「面板地址」的默认值。**留空** —— 不预填任何地址：
   这份页面会被打进安卓 / iOS 安装包，也会推到仓库里，写死一个 IP 等于把自己的
   面板地址公开出去。留空的话用户第一次打开必须自己填，也就不会被别人蹭到。 */
var FALLBACK_SERVER = '';

/* ================= 外观模式 =================
   三档：跟随系统（默认）/ 浅色 / 深色。CSS 里所有深色规则都已从
   `@media (prefers-color-scheme:dark){...}` 改写成 `[data-theme="dark"] ...` 前缀
   （在 build.py 里机械替换），所以只要给 <html> 加 / 去掉这个属性就切。
   auto 模式要监听系统设置变化 —— 用户没改选项，但手机深色了，
   页面也得跟着深色。 */
function applyTheme() {
  var t = S.theme || 'auto';
  var isDark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  /* 这里只挂「是否深色」，不挂具体值 —— 三档选项都映射到同一个属性值。
     如果以后要区分 light/auto 的细节（比如浅色背景上不让某些元素强反白），
     再改成 `data-theme="light"` / `data-theme="auto"` / `data-theme="dark"` 三态。 */
  var html = document.documentElement;
  if (isDark) html.setAttribute('data-theme', 'dark');
  else html.removeAttribute('data-theme');
  syncNativeTheme(isDark);
}

/* 把「页面现在是深色还是浅色」告诉原生壳，原生据此决定状态栏文字用白还是黑。
   不通知的话：手机是深色、但用户在设置里把页面强制成浅色时，
   状态栏还是白字，压在浅色页面上基本看不见。
   原生不在（浏览器 / 没注入桥）就直接跳过，不影响页面。 */
function syncNativeTheme(isDark) {
  if (!window.QLNative || typeof window.QLNative.setTheme !== 'function') return;
  try { window.QLNative.setTheme(isDark ? 'dark' : 'light'); } catch (e) { /* 桥挂了不该影响页面 */ }
}

/* 必须在 boot 里跑一次，否则首屏按系统颜色闪一下才跟上 */
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function () {
  if ((S.theme || 'auto') === 'auto') applyTheme();
});

/* ================= 字体大小 =================
   四档，作用在 CSS 变量 --fs 上。页面里所有字号都写成了
   `calc(Npx*var(--fs))`（由 tools/_apply_fs.py 机械改过），所以改这一个变量
   整页字号一起变，不用逐个元素设。

   为什么不直接用 CSS `zoom`：zoom 会把 env(safe-area-inset-*) 一起放大，
   而这两者的相互作用我没法在本机验证（没有 Mac / 模拟器），赌错了状态栏内边距会偏。
   calc 的行为是完全确定的，浏览器 / 安卓 WebView / iOS WKWebView 表现一致。

   注意这里**只缩放字号**，不缩放图标和间距 —— 这是「字体大小」该有的语义
   （和微信、系统设置的字体大小一样）。行高用的是行盒的自动高度，
   字大了行自然变高，不会裁切。

   ---- 无级调节 ----
   调节方式是**拖动条**（两端各一个 A，点一下进一档），不是分档。
   老版本存的是 's'/'m'/'l'/'xl' 这四个档位键，新版本存的是数字倍数 ——
   fsValue() 两种都要认，否则老用户升级上来字号会莫名变回标准。 */
var FS = { s: 0.88, m: 1, l: 1.14, xl: 1.28 };   /* 只用于兼容老数据 + 迁移 */
var FS_DEF = 1;      /* 默认倍数。必须是 1：1 = 「什么都不缩放」，
                        写成别的值会让所有没动过设置的用户字号跟着变（静默的观感回归） */
var FS_MIN = 0.8;
var FS_MAX = 1.4;
var FS_STEP = 0.05;  /* 点两端那个 A 时一次走多少 */

/* 把任意输入归一成合法倍数。认不出的值一律回默认 —— **不能放行**，
   否则 --fs 会被写成 NaN，全站字号（所有 font-size 都乘它）直接崩掉。 */
function fsClamp(v) {
  var n = Number(v);
  if (!isFinite(n) || n <= 0) return FS_DEF;
  return Math.min(FS_MAX, Math.max(FS_MIN, n));
}

/* 当前字号倍数。S.fs 可能是数字（新数据）也可能是档位键（老数据）。 */
function fsValue() {
  var v = S.fs;
  if (typeof v === 'number') return fsClamp(v);
  if (typeof v === 'string') {
    /* hasOwnProperty 而不是 FS[v] —— FS['constructor'] 之类会命中原型上的东西 */
    if (Object.prototype.hasOwnProperty.call(FS, v)) return FS[v];
    var n = parseFloat(v);
    return isFinite(n) && n > 0 ? fsClamp(n) : FS_DEF;
  }
  return FS_DEF;
}

/* 系统设置那一行右边显示的值。无级调节就直接报百分比。 */
function fsLabel() {
  return Math.round(fsValue() * 100) + '%';
}

function applyFontScale() {
  document.documentElement.style.setProperty('--fs', String(fsValue()));
}

/* 拖动中的实时预览：只改 --fs 和百分比文字，**不落盘**。
   挂的是 input 事件 —— 拖的时候就要看到变化，等松手就太迟了。 */
function previewFontScale(pct) {
  var v = fsClamp(Number(pct) / 100);
  document.documentElement.style.setProperty('--fs', String(v));
  var el = $('#fsPct');
  if (el) el.textContent = Math.round(v * 100) + '%';
}

/* 落盘 + 应用。v 是倍数（1.1）或老档位键（'l'）；百分比换算在调用方做
   （滑杆给的是 80..140 这种整数）。 */
function setFontScale(v) {
  var n;
  if (typeof v === 'number') n = v;
  else if (typeof v === 'string' && Object.prototype.hasOwnProperty.call(FS, v)) n = FS[v];
  else n = parseFloat(v);
  if (!isFinite(n) || !(n > 0)) return;   /* 非法值不动状态（N11 钉的就是这条） */
  S.fs = fsClamp(n);
  sset(K.fs, String(S.fs));
  applyFontScale();
}

/* 点两端的 A：进一档。顺带把滑杆位置和百分比一起跟过去。 */
function stepFontScale(dir) {
  var el = $('#fsRange');
  var cur = el && isFinite(Number(el.value)) && el.value !== ''
    ? Number(el.value) : Math.round(fsValue() * 100);
  var next = fsClamp((cur + dir * Math.round(FS_STEP * 100)) / 100);
  setFontScale(next);
  if (el) el.value = String(Math.round(next * 100));
  var p = $('#fsPct');
  if (p) p.textContent = Math.round(next * 100) + '%';
  syncFsBtns();
}

function resetFontScale() {
  setFontScale(FS_DEF);
  openFontScale();     /* 重画一次，让滑杆位置和百分比跟过去 */
}

/* 到两头就把对应的 A 置灰 —— 不置灰的话用户点了没反应，会以为卡住了。 */
function syncFsBtns() {
  var el = $('#fsRange');
  var v = (el && isFinite(Number(el.value)) && el.value !== '')
    ? Number(el.value) / 100 : fsValue();
  var d = $('#btnFsDown'), u = $('#btnFsUp');
  if (d) d.disabled = v <= FS_MIN + 1e-9;
  if (u) u.disabled = v >= FS_MAX - 1e-9;
}

/* 滑杆的 input/change 必须**每次开弹层时重新绑**：弹层内容是用 innerHTML 换的，
   元素每次都是新的 —— 在 boot 里绑一次，绑到的是个早就被丢掉的元素，
   表现是「拖动条完全没反应」，而且页面上不报任何错。 */
function bindFsRange() {
  var el = $('#fsRange');
  if (!el || !el.addEventListener) return;
  el.addEventListener('input', function () { previewFontScale(this.value); syncFsBtns(); });
  el.addEventListener('change', function () { setFontScale(Number(this.value) / 100); });
}

/* 字号调节弹层：上面一段示例文字（跟着 --fs 实时变，不用特殊处理），
   下面一条滑杆，两端是 A（小）/ A（大），点一下进一档。 */
function openFontScale() {
  var pct = Math.round(fsValue() * 100);
  var lo = Math.round(FS_MIN * 100), hi = Math.round(FS_MAX * 100);
  var st = Math.round(FS_STEP * 100);
  var h = '';
  h += '<div class="fsdemo">' +
    '<div class="dt">定时任务</div>' +
    '<div class="ds">这是一段示例文字。拖动下面的滑杆，全 App 的字都会跟着变，' +
    '图标和间距不变。</div>' +
  '</div>';
  h += '<div class="card" style="padding:16px 14px;margin-top:12px">' +
    '<div class="fsrow">' +
      '<button class="fsa sm" id="btnFsDown" aria-label="缩小">A</button>' +
      '<input type="range" id="fsRange" min="' + lo + '" max="' + hi + '" step="' + st + '"' +
        ' value="' + pct + '" aria-label="字体大小">' +
      '<button class="fsa lg" id="btnFsUp" aria-label="放大">A</button>' +
    '</div>' +
    '<div class="fsval">当前 <b id="fsPct">' + pct + '%</b></div>' +
  '</div>';
  h += '<button class="btn" id="btnFsReset" style="width:100%;margin-top:12px">恢复默认</button>';
  h += '<div class="f11 t3" style="margin:10px 4px;line-height:1.7">' +
    '范围 ' + lo + '% – ' + hi + '%，默认 ' + Math.round(FS_DEF * 100) + '%。<br>' +
    '只影响文字大小，图标和间距不变。设置只存在这台手机上。</div>';
  openSheet('字体大小', h);
  bindFsRange();
  syncFsBtns();
}

/* ================= 本地存储 =================
   浏览器里直接用 localStorage。

   原生壳里改走 App 的私有存储（SharedPreferences），两个原因：
     1. 壳内页面是从本机回环服务加载的，端口不保证每次一样，而 localStorage
        按「源」隔离 —— 端口一变就取不到上次的数据，表现为每次重开都要重登。
     2. 浏览器清缓存 / 隐私模式会把 localStorage 清掉，令牌丢了就得重登。

   原生桥给到的是一份 JSON 快照，读改写都在内存里做，写完整体存回去。
   存储里可能带密码，所以 App 侧用的是私有目录下的 SharedPreferences
   （非 root 设备上其他应用读不到）。 */
var NS = null;                 // 原生存储快照；null 表示当前用 localStorage

function storeInit() {
  try {
    if (window.QLNative && typeof window.QLNative.loadState === 'function') {
      var raw = window.QLNative.loadState();
      var o = raw ? JSON.parse(raw) : null;
      NS = (o && typeof o === 'object') ? o : {};
    }
  } catch (e) {
    NS = null;                 // 桥有问题就退回 localStorage，不能因此起不来
  }
}

function storeFlush() {
  if (!NS) return;
  try { window.QLNative.saveState(JSON.stringify(NS)); } catch (e) {}
}

function sget(k) {
  if (NS) return (k in NS) ? NS[k] : null;
  try { return localStorage.getItem(k); } catch (e) { return null; }
}
function sset(k, v) {
  if (NS) { NS[k] = String(v); storeFlush(); return; }
  try { localStorage.setItem(k, v); } catch (e) {}
}
function sdel(k) {
  if (NS) { delete NS[k]; storeFlush(); return; }
  try { localStorage.removeItem(k); } catch (e) {}
}

/* 是否记住账号密码。没存过这个键时按「记住」算 —— 用户既然装了 App，
   默认就是不想每次手输。 */
function rememberOn() { return sget(K.remember) !== '0'; }

/* 下次打开时要不要自动登录。
   用户主动点过「退出登录」就置为 0 —— 否则他退出后重开 App 又被自动登进去，
   那个按钮就等于骗人。重新手动登录成功后会再置回 1。 */
function autoLoginOn() { return rememberOn() && sget(K.auto) !== '0'; }

/* 启动时该不该自动登一次。抽成纯函数是为了能脱离 DOM 测 —— 这段判断
   一旦写错，表现是「每次打开都要重登」或者「退出登录后又被自动登进去」，
   都属于用户会立刻骂人的那种。 */
function shouldAutoLogin() {
  return !S.token && autoLoginOn() && !!sget(K.pass) && !!sget(K.user);
}

storeInit();

/* 页面是不是从「本机」打开的（本机预览 / 直接双击文件）。
   注意 file:// 有两种完全不同的处境：
     · 用户在浏览器里双击打开 —— 浏览器禁止一切跨域请求
     · 跑在原生 App 壳里（安卓 APK）—— 壳已开启通用跨域访问，没有同源限制
   靠 __QL_NATIVE__ 标记区分，否则诊断会给出误导性的结论。 */
function isLocalPage() {
  if (window.__QL_NATIVE__) return false;
  var h = location.hostname;
  return !h || h === 'localhost' || h === '127.0.0.1' || h === '::1' ||
         location.protocol === 'file:';
}

/* 原生壳的名字。安卓壳注入 'android'，iOS 壳注入 'ios'。
   之前这里写死「安卓版」，iOS 上「设置 → 关于」会显示错的平台名，
   排查问题时很误导 —— 所以按标记区分。 */
function nativeLabel() {
  var n = window.__QL_NATIVE__;
  if (!n) return '网页版 ';
  return n === 'ios' ? 'iOS 版 ' : '安卓版 ';
}

/* 如果页面本身就是面板托管的（比如部署到 /ql.html），
   那就用 location.origin 当面板地址 —— 同源请求，既没有 CORS 也没有混合内容问题。
   判断办法：直接拿同源的 /api/system 探一下，返回青龙的格式就认。 */
async function detectServer() {
  if (sget(K.server)) return;   // 用户存过地址，尊重用户的选择
  if (window.__QL_NATIVE__) return;             // 原生壳里页面是本地假域名，探测没意义
  if (isLocalPage()) return;                    // 本机预览，用兜底地址
  if (location.protocol === 'file:') return;    // 本地文件，没有「同源」可言
  try {
    var res = await fetch(location.origin + '/api/system', {
      cache: 'no-store', headers: { Accept: 'application/json' }
    });
    var j = await res.json();
    if (j && j.code === 200 && j.data && typeof j.data.version === 'string') {
      S.server = location.origin;
    }
  } catch (e) { /* 不是面板，保持兜底地址 */ }
}

var S = {
  server: sget(K.server) || FALLBACK_SERVER,
  user: sget(K.user) || 'admin',
  token: sget(K.token) || '',
  /* 新装默认落在主页（1.0.16 起）。老用户存过 K.tab，会回到上次那一页，不受影响。 */
  tab: sget(K.tab) || 'home',
  /* 'auto'（跟随系统）/ 'light'（浅色）/ 'dark'（深色）。默认 auto —— 不主动覆盖系统选择 */
  theme: sget(K.theme) || 'auto',
  /* 's' / 'm'（标准，默认）/ 'l' / 'xl'。只缩放字号，见 applyFontScale() */
  /* 字号：默认 1（= 不缩放）。老数据里可能是 's'/'m'/'l'/'xl'，
     fsValue() 会认，所以这里原样读回来就行，不用在启动时改写用户存的值。 */
  fs: sget(K.fs) || FS_DEF,
  sys: null,
  /* 面板头像的**文件名**（登录后在 GET /api/user 里取回，形如 'xxxxxxxx.png'）。
     **只存文件名不存整条 URL** —— 面板地址是用户自己填的，换一台面板就得跟着换，
     把 URL 存下来会在切账号时串到上一台的头像上。空串 = 没设过头像 → 回退首字母。
     avatarSrc 才是 <img> 真正用的地址（fetch 回来转的 data: URL），见 loadAvatar()。 */
  avatar: '',
  avatarSrc: '',
  need2fa: false,
  detailId: null,
  /* 「从任务详情跳走」的来源。任务详情里的「脚本 / 最新日志 / 日志历史」三处直达
     是**跳去别的页面**，跳之前会把弹层关掉（S.detailId 一起清空），
     于是系统返回手势回来时没有任何可回的地方 —— 用户跳出去就回不来了。
     这里只记**一层**：返回一次就用掉。不做完整历史栈 ——
     用户按返回时心里想的是「回到我刚才那个任务」，连按四五次才出来反而更烦。
     用户主动点底栏换页 = 已经走开了，顺手清掉（见底栏 click）。 */
  backTo: null,
  /* filter: 状态筛选（all / running / unused / disabled），分档规则见 cronBucket()。
     edit / sel: 批量编辑模式 —— 勾选中的任务 id 记在 sel 里（键是 id，值是 true）。
     views / view / viewsFailed：任务页顶部那排「定时视图」tab。
     面板的「定时视图」**不是时间轴**，而是保存好的筛选条件（名称 + 若干
     「字段/操作符/值」+ 且或关系 + 排序）。查任务时把选中的那个整个塞进
     queryString 参数交给后端筛。这里只做「切换」，不做创建/编辑 ——
     手机上编那种多条件表单太局促，要改去面板网页版改，切回来就能看到。
     viewsFailed：/api/crons/views 是较新版本才有的接口，拉失败就置真、
     整条 tab 栏藏起来。视图是锦上添花，**不能因为它把任务页也带崩**。 */
  crons: { list: [], total: 0, page: 1, size: 20, q: '', loading: false,
           filter: 'all', edit: false, sel: {},
           views: [], view: null, viewsFailed: false },
  /* tag 是当前选中的标签筛选（空串 = 不筛）。标签本身来自后端 env.labels（v2.21 起有）。 */
  envs: { list: [], q: '', tag: '', loading: false, edit: false, sel: {} },
  /* logs.q：文件名搜索词。空串 = 正常目录浏览；非空 = 跨目录找整棵树。
     日志树是一次性整棵拉回来的，所以搜索不用再打接口。 */
  logs: { tree: [], path: [], q: '', loading: false },
  /* 日志文件弹层的状态。**放 S 里而不是 openLogFile 的闭包里**：
     「复制内容」「只看错误」这两个按钮走的是全局事件委托，委托函数拿不到闭包变量。
     txt 存**原始文本**（没加行号的那份），复制走它 —— 从 DOM 的 textContent 读的话
     会把「只看错误」模式下的行号一起复制走。
     q 是「在这个日志里搜关键字」，和 onlyErr 是**与**的关系（只看错误 + 搜索 =
     在错误行里找）。 */
  logfile: { lines: [], txt: '', onlyErr: false, q: '' },
  /* 详情页「运行日志」那一块的状态。和 logfile 分开存：
     两处的筛选是各自独立的（在日志文件里筛了错误，不该影响详情页的运行日志）。
     刷新日志时 lines 换新、onlyErr / q **保留** —— 开着「只看错误」按刷新，
     结果又被塞回全部，那个开关就白点了。 */
  cronlog: { lines: [], errN: 0, onlyErr: false, q: '', painted: false },
  /* scripts.expanded 的键是「从脚本根目录算起的相对路径」（如 dir1/sub），值是真值。
     默认全收起 —— 脚本目录动辄几百项，一进来全展开会卡。
     path 保留但恒为空数组：改成树形展开后不再逐层下钻，留着是为了不改动一堆
     loadScripts(S.scripts.path, true) 的调用点。 */
  scripts: { nodes: [], path: [], loading: false, expanded: {}, q: '' },
  /* 「我的」页的面板概览（/api/dashboard/*）。字段全部按「有就显示、没有就藏」处理，
     因为不同版本的面板返回的字段不完全一样，硬取会崩。 */
  /* seq 是「第几轮请求」：一轮没回来时又点刷新，旧的结果要丢掉，
     否则慢的那次后到，会把新数据覆盖回去。 */
  dash: {
    sys: null, ov: null, rt: null, trend: null,
    loading: false, err: '', seq: 0,
    /* 1.0.25：趋势图看几天（7 / 30）和当前点中的那一天（下标，null = 看汇总）。
       两个都放在这里而不是渲染时临时算 —— 切完 30 天再切回 7 天，
       用户期望的还是上次那个区间，不该每次都弹回默认的 7 天。 */
    trendDays: 7, tday: null
  },
  subs: { list: [], q: '', loading: false },
  deps: { list: [], type: 'nodejs', q: '', loading: false },
  configs: { list: [], loading: false },
  /* 应用设置（面板的开放接口应用）。list 里每项是
     { id, name, client_id, client_secret, scopes: [], tokens: [] }。 */
  apps: { list: [], loading: false, err: '' },
  /* 其他设置：cfg 是 GET /api/system/config 回来的 data.info。
     mods 是备份时勾选的模块（base 恒为真，见 BACKUP_MODULES）。 */
  sysconf: { cfg: null, loading: false, err: '', mods: { base: 1 } },
  loginlog: { list: [], loading: false, err: '' },
  /* 面板日志（面板「系统设置 → 系统日志」）。GET /api/system/log 回的是把区间内
     的 .log 文件首尾拼起来的一大段**纯文本**（不是 {code,data} 包装），所以走
     apiText()。range 只留「今天 / 近 7 天」两档 —— 手机上摆不开日期选择器，
     面板自己也只允许查最近 7 天。 */
  syslog: { text: '', range: 'today', loading: false, err: '', onlyErr: false, q: '', painted: false },
  busy: false
};

/* ================= 网络 ================= */
/* 用户填的面板地址，例如 http://1.2.3.4:5700 */
function base() { return S.server.replace(/\/+$/, ''); }

/* 从面板地址里取出「主机:端口」。用户可能填 http://1.2.3.4:5700/、1.2.3.4:5700
   或 https://ql.example.com，去掉协议头、路径和结尾斜杠就够看了。
   （青龙不返回主机名，概览页拿这个当「这是哪台面板」的标识。） */
function hostOf(u) {
  return String(u == null ? '' : u)
    .replace(/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//, '')
    .replace(/\/.*$/, '')
    .replace(/\/+$/, '');
}

/* 请求实际发往哪里。
   安卓壳里页面是从 App 内置的回环服务加载的（http://127.0.0.1:<随机端口>），
   /api/ 请求发给它，由 App 用系统 HTTP 栈转发到真正的面板。这样页面侧
   完全同源 —— 没有跨域、没有预检、不依赖 WebView 的网络实现，而且
   连不上面板时 App 会把具体原因当 JSON 回来，不再是空泛的 Failed to fetch。 */
function apiBase() {
  if (window.__QL_NATIVE__ && location.hostname === '127.0.0.1') return location.origin;
  return base();
}

/* 把面板地址告诉原生代理。地址一变就要同步一次，否则请求会转发到旧地址。 */
function syncTarget() {
  if (window.QLNative && typeof window.QLNative.setTarget === 'function') {
    try { window.QLNative.setTarget(base()); } catch (e) { /* 桥不可用就算了 */ }
  }
}

/* XMLHttpRequest 版的请求，只作为 fetch 的兜底。返回一个跟 Response 形状
   一致的替身，好让调用方无感。 */
function xhrFetch(url, init) {
  return new Promise(function (resolve, reject) {
    var x = new XMLHttpRequest();
    try {
      x.open(init.method || 'GET', url, true);
    } catch (e) {
      reject(new Error('XMLHttpRequest 打不开这个地址'));
      return;
    }
    x.timeout = 15000;
    var hs = init.headers || {};
    Object.keys(hs).forEach(function (k) {
      try { x.setRequestHeader(k, hs[k]); } catch (e) {}
    });
    x.onload = function () {
      var h = {};
      try { h['Content-Type'] = x.getResponseHeader('Content-Type') || 'application/json'; } catch (e) {}
      try {
        resolve(new Response(x.responseText, { status: x.status, headers: h }));
      } catch (e) {
        resolve({
          status: x.status,
          ok: x.status >= 200 && x.status < 300,
          text: function () { return Promise.resolve(x.responseText); }
        });
      }
    };
    x.onerror = function () { reject(new Error('XMLHttpRequest 网络错误')); };
    x.ontimeout = function () { reject(new Error('XMLHttpRequest 超时')); };
    try {
      x.send(init.body === undefined ? null : init.body);
    } catch (e) {
      reject(new Error('XMLHttpRequest 发送失败'));
    }
  });
}

async function api(path, opt) {
  opt = opt || {};
  var url = apiBase() + path;
  if (opt.query) {
    var u = new URLSearchParams();
    Object.keys(opt.query).forEach(function (k) {
      var v = opt.query[k];
      if (v !== undefined && v !== null && v !== '') u.append(k, v);
    });
    var qs = u.toString();
    if (qs) url += '?' + qs;
  }
  var headers = { Accept: 'application/json' };
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  var init = { method: opt.method || 'GET', headers: headers, cache: 'no-store' };
  if (opt.form) {
    /* 上传文件用。**绝不能自己设 Content-Type** —— 浏览器要在里面塞 multipart 边界，
       手写成 multipart/form-data 会缺 boundary，后端 multer 解析不出文件，
       表现是「上传成功但面板里没有这个文件」。 */
    init.body = opt.form;
  } else if (opt.body !== undefined) {
    headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(opt.body);
  }

  var res;
  try {
    res = await fetch(url, init);
  } catch (e) {
    var err = new Error('连不上面板：' + (e && e.message ? e.message : '网络错误'));
    err.url = url;
    err.network = true;
    throw err;
  }

  var text = await res.text();
  var json = null;
  try { json = text ? JSON.parse(text) : null; } catch (e) { json = null; }

  if (res.status === 401) {
    signOut(true);
    throw new Error((json && json.message) || '登录已失效，请重新登录');
  }
  if (!res.ok) {
    throw new Error((json && json.message) || ('服务器错误 HTTP ' + res.status));
  }
  if (!json || typeof json.code !== 'number') throw new Error('响应格式异常');

  if (json.code === 200) return json;
  if (json.code === 420) { var e2 = new Error('需要两步验证'); e2.need2fa = true; throw e2; }
  if (json.code === 401) { signOut(true); throw new Error(json.message || '登录已失效'); }
  throw new Error(json.message || ('请求失败 code ' + json.code));
}

/* 下载接口（scripts/download）回的是**文件字节流**，不是 {code,data} 包装，
   所以不能走 api()。出错时后端才回 JSON，所以失败分支里再尝试解析一次原因。 */
async function apiBlob(path, body, method) {
  var url = apiBase() + path;
  var headers = { Accept: '*/*', 'Content-Type': 'application/json' };
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  var res;
  try {
    /* method 默认 POST（脚本下载那个接口就是 POST）。数据备份是 PUT，
       所以要能改 —— 写死 POST 会直接 404。 */
    res = await fetch(url, { method: method || 'POST', headers: headers, body: JSON.stringify(body || {}), cache: 'no-store' });
  } catch (e) {
    var err = new Error('连不上面板：' + (e && e.message ? e.message : '网络错误'));
    err.network = true;
    throw err;
  }
  if (res.status === 401) { signOut(true); throw new Error('登录已失效，请重新登录'); }
  if (!res.ok) {
    var t = '';
    try { t = await res.text(); } catch (e3) { t = ''; }
    var j = null;
    try { j = t ? JSON.parse(t) : null; } catch (e4) { j = null; }
    throw new Error((j && j.message) || ('下载失败 HTTP ' + res.status));
  }
  return await res.blob();
}

/* 取「原样正文」的接口（配置文件详情就是这种）。不能走 api()：那个强制要求
   响应是 {code,data} 包装，拿到纯文本会直接判成「响应格式异常」。
   顺便兼容被包了一层的版本 —— 青龙不同小版本的实现不一致。 */
async function apiText(path, query) {
  var url = apiBase() + path;
  if (query) {
    var u = new URLSearchParams();
    Object.keys(query).forEach(function (k) {
      var v = query[k];
      if (v !== undefined && v !== null && v !== '') u.append(k, v);
    });
    var qs = u.toString();
    if (qs) url += '?' + qs;
  }
  var headers = { Accept: '*/*' };
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  var res;
  try {
    res = await fetch(url, { headers: headers, cache: 'no-store' });
  } catch (e) {
    var err = new Error('连不上面板：' + (e && e.message ? e.message : '网络错误'));
    err.url = url;
    err.network = true;
    throw err;
  }
  if (res.status === 401) { signOut(true); throw new Error('登录已失效，请重新登录'); }
  if (!res.ok) throw new Error('服务器错误 HTTP ' + res.status);
  var text = await res.text();
  if (text && text.charAt(0) === '{') {
    var j = null;
    try { j = JSON.parse(text); } catch (e2) { j = null; }
    if (j && typeof j.code === 'number') {
      if (j.code === 200) return j.data == null ? '' : String(j.data);
      throw new Error(j.message || ('请求失败 code ' + j.code));
    }
  }
  return text;
}

/* ================= 格式化 ================= */
function fmtAbs(d) {
  return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
         pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function fmtRel(ms) {
  if (!ms || ms <= 0) return '从未运行';
  var diff = (Date.now() - ms) / 1000;
  if (diff < 0) return fmtAbs(new Date(ms));
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
  return fmtAbs(new Date(ms));
}
function fmtCountdown(d) {
  var s = (d.getTime() - Date.now()) / 1000;
  if (s < 0) return '已过期';
  if (s < 60) return '不到 1 分钟后';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟后';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时后';
  return Math.floor(s / 86400) + ' 天后';
}
/* 1.0.27：「下次执行」格式 —— 之前是 `MM-DD HH:MM:SS（X 小时后）`，秒数都是 :00 占着位置、
   跨日的看不出是今天 / 明天、跟「上次 X 小时前」的相对时间风格不一致。
   新版：**今天 / 明天 / MM-DD** 前缀，去秒数。任务列表里直接显示完整（之前 split 掉了
   倒计时 —— 新格式短了 4 个字符，单元格塞得下）；详情 / 编辑页照旧。 */
function sameYMD(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}
function fmtNext(d) {
  var now = new Date();
  var tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  var prefix = sameYMD(d, now) ? '今天' :
               sameYMD(d, tomorrow) ? '明天' :
               pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  return prefix + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) +
         '（' + fmtCountdown(d) + '）';
}
function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
/* 依赖 / 订阅列表给的时间是 ISO 字符串，不是毫秒数，直接喂 fmtRel 会得到「从未运行」 */
function fmtWhen(v) {
  if (!v) return '—';
  var t = typeof v === 'number' ? v : Date.parse(v);
  if (!t || isNaN(t)) return String(v);
  return fmtRel(t);
}
/* 任务的两个时间字段单位都跟直觉相反（面板前端怎么写，这里就怎么对齐）：
   · last_execution_time 是**秒**级时间戳，不是毫秒。面板前端写的是
     `dayjs(record.last_execution_time * 1000)`。我们直接 new Date(x) 的话，
     1.79e9 会被当成毫秒 → 显示成 1970-01-2x（用户看到的就是这个）。
   · last_running_time **根本不是时间戳**，是「上次运行了多久（秒）」。
     面板前端用 diffTime(x)（内部 num * 1000）拆成 天/时/分/秒。
     以前这里写成 new Date(x)，x=1 就显示 1970-01-01 08:00:00。 */
function cronMs(sec) {
  var n = Number(sec);
  return isFinite(n) && n > 0 ? n * 1000 : 0;
}
/* 「本次已经跑了多久」（秒）= 现在 - 本次开始时间。
   **只有 status === 0（运行中）时 last_execution_time 才是本次的开始时间** ——
   排队中（3）的时候它还是上一次跑的时间，算出来会是「十几小时」这种离谱值，
   所以调用方必须先确认状态。见 paintCronState。 */
function cronElapsed(t) {
  var start = cronMs(t && t.last_execution_time);
  if (!start) return 0;
  return Math.max(0, Math.round((Date.now() - start) / 1000));
}
/* 运行时长：秒 → 「X 天 X 时」。只留前两档 ——
   手机上「1 天 2 时 3 分 4 秒」一屏放不下，也没必要那么精确。 */
function fmtDur(sec) {
  var n = Number(sec);
  if (!isFinite(n) || n <= 0) return '—';
  var d = Math.floor(n / 86400);
  var h = Math.floor((n % 86400) / 3600);
  var m = Math.floor((n % 3600) / 60);
  var s = Math.round(n % 60);
  if (d) return d + ' 天 ' + h + ' 时';
  if (h) return h + ' 时 ' + m + ' 分';
  if (m) return m + ' 分 ' + s + ' 秒';
  return s + ' 秒';
}
/* 脚本树 / 日志树的 createTime 来自后端 readDirs() 的 stats.birthtime.getTime()，
   **单位是毫秒，这里没问题**（跟 last_execution_time 那种秒级字段不是一回事）。
   但 Docker 里挂载卷的 birthtime 有可能是 0 或纪元值 —— 那时 new Date(0) 会老老实实
   显示成「01-01 08:00:00」，看着就像我们算错了。面板自己的脚本页干脆不显示时间，
   所以这里也挡一道：不合理就不显示，不编。 */
function fmtFileTime(v) {
  var n = Number(v);
  /* 2000-01-01 之前的一律当无效：脚本不可能比青龙这个项目还老 */
  if (!isFinite(n) || n < 946684800000) return '';
  return fmtAbs(new Date(n));
}
function stripAnsi(s) {
  return String(s == null ? '' : s)
    .replace(/\u001b\][^\u0007\u001b]*(\u0007|\u001b\\)/g, '')
    .replace(/\u001b\[[0-9;?]*[ -\/]*[@-~]/g, '');
}
function maskValue(v) {
  var s = String(v == null ? '' : v);
  if (!s) return '（空）';
  return '•'.repeat(Math.min(Math.max(s.length, 6), 20)) + '  (' + s.length + ' 字符)';
}

/* ================= 任务状态 =================
   这四个值和青龙后端的 status 字段一一对应，任务页的筛选条就是按它们分的
   （见 cronBucket）。文案照青龙网页版：「1」那里用「未使用」而不是「空闲」，
   跟筛选按钮叫法保持一致，否则筛「未使用」出来的卡片写着「空闲」，看着像筛错了。 */
var ST = {
  0: { t: '运行中', c: 'green' },
  1: { t: '未使用', c: 'blue' },
  2: { t: '已禁用', c: 'gray' },
  3: { t: '排队中', c: 'orange' }
};
function statusOf(t) {
  if (t.isDisabled === 1 || t.status === 2) return { t: '已禁用', c: 'gray' };
  return ST[t.status] || ST[1];
}
function isBusy(t) {
  var s = statusOf(t).t;
  return s === '运行中' || s === '排队中';
}
function pill(s) { return '<span class="pill ' + s.c + '">' + esc(s.t) + '</span>'; }

/* ================= cron 下次执行时间 ================= */
var MACROS = {
  '@yearly': '0 0 1 1 *', '@annually': '0 0 1 1 *', '@monthly': '0 0 1 * *',
  '@weekly': '0 0 * * 0', '@daily': '0 0 * * *', '@midnight': '0 0 * * *', '@hourly': '0 * * * *'
};
var MNAMES = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
var WNAMES = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };

function cronVal(s, names) {
  s = String(s).toLowerCase();
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  return names[s] !== undefined ? names[s] : null;
}
function cronField(raw, lo, hi, names) {
  var s = String(raw).trim();
  var all = new Set();
  if (s === '*' || s === '?') {
    for (var i = lo; i <= hi; i++) all.add(i);
    return { set: all, restricted: false };
  }
  var set = new Set();
  var parts = s.split(',');
  for (var p = 0; p < parts.length; p++) {
    var part = parts[p], step = 1, body = part;
    var sl = part.indexOf('/');
    if (sl >= 0) {
      body = part.slice(0, sl);
      step = parseInt(part.slice(sl + 1), 10);
      if (!(step > 0)) return null;
    }
    var a, b;
    if (body === '*' || body === '?' || body === '') { a = lo; b = hi; }
    else if (body.indexOf('-') > 0) {
      var xy = body.split('-');
      a = cronVal(xy[0], names); b = cronVal(xy[1], names);
    } else {
      a = cronVal(body, names);
      b = step > 1 ? hi : a;
    }
    if (a === null || b === null || a > b) return null;
    for (var v = a; v <= b; v += step) if (v >= lo && v <= hi) set.add(v);
  }
  if (!set.size) return null;
  return { set: set, restricted: true };
}
function parseCron(expr) {
  if (!expr) return null;
  var t = String(expr).trim();
  if (!t) return null;
  if (t.charAt(0) === '@') {
    var m = MACROS[t.toLowerCase()];
    if (!m) return null;
    t = m;
  }
  var f = t.split(/\s+/).filter(Boolean);
  if (f.length === 6) f.shift();
  if (f.length !== 5) return null;
  var mi = cronField(f[0], 0, 59), ho = cronField(f[1], 0, 23),
      dm = cronField(f[2], 1, 31), mo = cronField(f[3], 1, 12, MNAMES),
      dw = cronField(f[4], 0, 6, WNAMES);
  if (!mi || !ho || !dm || !mo || !dw) return null;
  var dws = new Set();
  dw.set.forEach(function (v) { dws.add(v % 7); });
  return { mi: mi.set, ho: ho.set, dm: dm.set, mo: mo.set, dw: dws, dmR: dm.restricted, dwR: dw.restricted };
}
function nextRunDate(sch) {
  if (!sch) return null;
  var now = new Date();
  var cur = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes() + 1, 0, 0);
  var hours = Array.from(sch.ho).sort(function (a, b) { return a - b; });
  var mins = Array.from(sch.mi).sort(function (a, b) { return a - b; });
  for (var d = 0; d < 400; d++) {
    var day = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + d);
    if (!sch.mo.has(day.getMonth() + 1)) continue;
    var dom = day.getDate(), wd = day.getDay(), ok;
    if (sch.dmR && sch.dwR) ok = sch.dm.has(dom) || sch.dw.has(wd);
    else if (sch.dmR) ok = sch.dm.has(dom);
    else if (sch.dwR) ok = sch.dw.has(wd);
    else ok = true;
    if (!ok) continue;
    for (var i = 0; i < hours.length; i++) {
      for (var j = 0; j < mins.length; j++) {
        var cand = new Date(day.getFullYear(), day.getMonth(), day.getDate(), hours[i], mins[j], 0, 0);
        if (cand >= cur) return cand;
      }
    }
  }
  return null;
}
function nextRunText(expr) {
  var sch = parseCron(expr);
  if (!sch) return null;
  var d = nextRunDate(sch);
  if (!d) return null;
  return fmtNext(d);
}

/* ================= 登录 / 登出 ================= */

/* 令牌失效后自动重登的次数锁。密码要是改了，不加锁会一直重试。 */
var autoRetried = false;

function showLogin() {
  $('#login').classList.remove('hidden');
  $('#app').classList.add('hidden');
  $('#inServer').value = S.server;
  $('#inUser').value = S.user;
  var rem = rememberOn();
  if ($('#inRemember')) $('#inRemember').checked = rem;
  $('#codeField').classList.toggle('hidden', !S.need2fa);
  // 记住密码时直接填回去，用户点一下就能进
  $('#inPass').value = rem ? (sget(K.pass) || '') : '';
  $('#inCode').value = '';
  // 有填好的密码就聚焦登录按钮，别把光标怼在密码框里
  setTimeout(function () {
    if ($('#inServer').value && $('#inUser').value && !$('#inPass').value) $('#inServer').focus();
    else if (!$('#inPass').value) $('#inPass').focus();
  }, 220);
}
function showApp() {
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
}
function signOut(silent) {
  S.token = '';
  S.sys = null;
  S.avatar = '';      // 换账号时别把上一台的头像带过去
  S.avatarSrc = '';
  sdel(K.token);
  S.crons.list = []; S.crons.total = 0; S.crons.page = 1;
  S.envs.list = []; S.logs.tree = []; S.logs.path = []; S.logs.q = '';
  S.scripts.nodes = []; S.scripts.path = [];
  S.subs.list = []; S.deps.list = []; S.configs.list = [];
  /* 概览也要清干净：换账号后如果还留着上一条面板的数据，会看着像「新面板就是那样」。
     seq 一并自增，让还在飞的那一轮结果作废。 */
  S.dash.sys = null; S.dash.ov = null; S.dash.rt = null; S.dash.trend = null;
  S.dash.err = '';
  S.dash.seq = (S.dash.seq || 0) + 1; S.dash.loading = false;
  closeSheet();
  showLogin();
  if (!silent) {
    sset(K.auto, '0');     // 主动退出就别在下次打开时又自动登进来
    toast('已退出登录');
    return;
  }
  /* silent 表示令牌失效（过期 / 面板重启过）。存了账号密码就自动重登一次，
     用户完全无感。autoRetried 兜住「密码错了」的情况，避免无限重试。 */
  if (!autoRetried && autoLoginOn() && sget(K.pass) && sget(K.user)) {
    autoRetried = true;
    doLogin(true);
  }
}

/* 按复选框决定要不要留下凭据。用户取消勾选时必须把已存的密码删掉 ——
   只是「不写」的话，上次存的那份会一直留着，跟界面显示的状态不符。 */
function saveCreds(pass) {
  var want = $('#inRemember') ? $('#inRemember').checked : true;
  sset(K.remember, want ? '1' : '0');
  if (want) sset(K.pass, pass);
  else sdel(K.pass);
}

/* ================= 登录历史（多账号切换） =================

   每登录成功一次就记一笔：用户名 + 面板地址 + 密码 + 时间。
   同一组（用户名 + 地址）只留最新的一条，按时间倒序，最多 ACCT_MAX 条。
   密码就存在本机（跟「记住密码」同一套存储），不上传任何地方。 */

var ACCT_MAX = 8;

function acctList() {
  try {
    var a = JSON.parse(sget(K.accts) || '[]');
    return Object.prototype.toString.call(a) === '[object Array]' ? a : [];
  } catch (e) { return []; }
}
function acctPut(list) { sset(K.accts, JSON.stringify(list.slice(0, ACCT_MAX))); }

/* 同一个人在不同面板上算两个账号 —— 用户名很可能都叫 admin，
   只比用户名会把两个面板的凭据混在一起。 */
function acctKey(a) { return String(a.u || '') + '@' + String(a.s || ''); }

function acctRemember(user, pass, server) {
  if (!user) return;
  var me = { u: user, p: pass || '', s: server || '', t: Date.now() };
  var list = acctList().filter(function (a) { return acctKey(a) !== acctKey(me); });
  list.unshift(me);
  acctPut(list);
}

function acctForget(i) {
  var list = acctList();
  if (i < 0 || i >= list.length) return;
  list.splice(i, 1);
  acctPut(list);
}

function acctIsCurrent(a) {
  return a.u === S.user && (a.s || '') === (S.server || '');
}

/* 切到另一个账号：面板地址、用户名、密码一起换，然后重新登录。
   不走 signOut —— 它会清掉自动登录标记并弹一句「已退出登录」，
   切账号不该让用户看到那句话。 */
async function acctSwitch(i) {
  var a = acctList()[i];
  if (!a) return;
  if (acctIsCurrent(a)) { toast('已经是这个账号了'); return; }
  if (!a.p) { toast('这个账号没存密码，请手动登录一次', true); return; }
  closeSheet();
  toast('正在切到 ' + a.u + '…');
  /* 地址要先交给原生代理，否则请求还发到旧面板上（doLogin 里还会再同步一次） */
  S.server = a.s || S.server;
  sset(K.server, S.server);
  syncTarget();
  return doLogin(true, { server: a.s || S.server, user: a.u, pass: a.p });
}

/* auto=true 表示这是自动重登，失败时不要弹提示和诊断，免得一开屏就糊一脸。
   creds 给了就直接用它 —— 多账号切换走这条，不用先往登录页的输入框里塞值。 */
async function doLogin(auto, creds) {
  var server = creds ? String(creds.server || '') : $('#inServer').value.trim();
  var user = creds ? String(creds.user || '') : $('#inUser').value.trim();
  var pass = creds ? String(creds.pass || '') : $('#inPass').value;
  var code = creds ? String(creds.code || '') : $('#inCode').value.trim();
  if (!server) { if (!auto) toast('请填写面板地址', true); return false; }
  if (!user || !pass) { if (!auto) toast('请填写用户名和密码', true); return false; }
  if (S.need2fa && !code) { if (!auto) toast('请填写动态验证码', true); return false; }

  var btn = $('#btnLogin');
  btn.disabled = true; btn.textContent = '登录中…';
  S.server = server;
  syncTarget();          // 用户可能刚改过地址，先同步给原生代理再发请求
  try {
    var r;
    if (S.need2fa) {
      r = await api('/api/user/two-factor/login', { method: 'PUT', body: { username: user, password: pass, code: code } });
    } else {
      r = await api('/api/user/login', { method: 'POST', body: { username: user, password: pass } });
    }
    S.token = (r.data && r.data.token) || '';
    if (!S.token) throw new Error('服务器没有返回令牌');
    S.user = user;
    S.need2fa = false;
    autoRetried = false;
    sset(K.server, S.server);
    sset(K.user, S.user);
    sset(K.token, S.token);
    sset(K.auto, '1');     // 登录成功 → 下次打开可以自动进
    saveCreds(pass);
    acctRemember(user, pass, server);   // 记进登录历史，之后在系统设置里能一键切回来
    showApp();
    if (!auto) toast('登录成功');
    await bootAfterLogin();
    return true;
  } catch (e) {
    if (e.need2fa) {
      S.need2fa = true;
      $('#codeField').classList.remove('hidden');
      $('#inCode').focus();
      toast('该账号开了两步验证，请输入动态码', true);
    } else if (auto) {
      // 自动重登失败：静默退回登录页，凭据已经填好了，用户点一下就行
      S.need2fa = false;
      $('#codeField').classList.add('hidden');
      console.warn('[青龙管家] 自动登录失败', e);
    } else {
      S.need2fa = false;
      $('#codeField').classList.add('hidden');
      toast(e.message || '登录失败', true);
