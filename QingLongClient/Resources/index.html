    loadDeps();
  });

  $('#shX').addEventListener('click', closeSheet);
  $('#sheet').querySelector('.mask').addEventListener('click', closeSheet);

  document.addEventListener('click', onClick, false);
  bindPTR();
}

function onClick(ev) {
  /* 所有可点元素都挂在这一个选择器上。新增模块时别忘了往这里加属性/ id，
     否则表现是「点了没反应」—— 不报错，最难查。
     注意：data-sact 的按钮同时也带 data-scr，所以下面的分支必须
     「先判 data-sact，再判 data-scr」，顺序反了会把菜单项当成打开文件。 */
  var el = ev.target.closest ? ev.target.closest(
    '[data-cron],[data-act],[data-mact],[data-dact],[data-edit],[data-del],[data-copycmd],' +
    '[data-cf],[data-view],[data-cbatch],[data-viewav],' +
    /* 1.0.25：趋势图的「7 / 30 天」切换 + 点柱子看那天 + 主页「正在执行」跳任务页。
       另起一行加，别拼进上面那行 —— 上面那行被 V32 锚着（它是整条一起比的）。 */
    '[data-tdays],[data-tday],[data-gocrons],' +
    '[data-ebatch],' +
    '[data-goscript],[data-gocronlog],[data-gocronlogdir],' +
    '[data-acct],[data-acctdel],' +
    '[data-env],[data-eact],[data-envtag],[data-theme-set],[data-log],[data-preset],[data-path],' +
    '[data-scr],[data-sact],[data-scrtog],[data-depact],[data-subact],[data-cfg],[data-cfgsample],[data-goto],' +
    /* 面板设置三页：应用的增删改 / 权限标签 / 复制 / 显隐密钥；
       其他设置的字段确认 / 备份模块勾选。 */
    '[data-appedit],[data-appsecret],[data-appdel],[data-reveal],[data-copy],' +
    '[data-scope],[data-scsave],[data-scmod],' +
    '#btnCronEdit,#btnCronAll,#btnAccts,' +
    /* 变量页批量编辑 + 日志「跳到最新」：单独新起一行，别拼进下面那一行 ——
       下面那行的「只看错误 / 复制」那组按钮 id 被 AB19 / AC24 两条变异锚着，
       往它里面加东西会打散锚点（等于那两条变异白写）。
       ⚠️ 这句注释**不许原样抄那串 id**：断言是拿正则在整份源码里搜字面量，
       注释里再留一份副本的话，变异把真实那行删掉、断言照样能在注释里搜到，
       于是「一条都不报错」= 那条变异被悄悄废掉（1.0.24 就是这么出来的 2 条 MISS）。 */
    '#btnEnvEdit,#btnEnvAll,#btnLogTail,' +
    '#btnSaveCron,#btnDelEnv,#btnSaveEnv,#btnLogReload,#btnLogCopy,#btnCopyLog,#btnLogErr,#btnDelLog,' +
    '#btnCronLogErr,#btnSysLogErr,#btnSysLogCopy,' +
    '#btnSaveServer,#btnLogout,#logUp,#btnDiag,#btnDiagLogin,' +
    '#btnNewScriptOk,#btnSaveScript,#btnRunScript,#btnRenameScript,#btnDelScript,#btnRenameOk,' +
    '#btnSaveDep,#btnDepLogReload,#btnSaveSub,#btnSubLogReload,#btnSaveCfg,#btnNewCfgOk,' +
    '#btnAcct,#btnSettings,#btnTheme,#btnFs,#btnFsDown,#btnFsUp,#btnFsReset,' +
    '#btnNewApp,#btnAppSave,#btnAppRetry,#btnScExport,#btnScImport,#btnScCheck,#btnScReload,' +
    '#btnScRetry,#btnLogRetry,#btnCopyNewSec'
  ) : null;
  if (!el) return;

  var id = el.dataset.id;

  /* 系统设置 → 外观：三档选项。点哪个就切哪个，再重画弹层让 ✓ 跟过去。 */
  if (el.dataset.themeSet != null) {
    setTheme(el.dataset.themeSet);
    openTheme();
    return;
  }
  /* 系统设置 → 点「外观模式」整条 */
  if (el.id === 'btnTheme') return openTheme();

  /* 系统设置 → 字体大小：两端那个 A 点一下进一档；「恢复默认」回 100%。
     滑杆本身走 input/change，不在 click 委托里（见 bindFsRange）。 */
  if (el.id === 'btnFsDown') return stepFontScale(-1);
  if (el.id === 'btnFsUp') return stepFontScale(1);
  if (el.id === 'btnFsReset') return resetFontScale();
  /* 系统设置 → 点「字体大小」整条 */
  if (el.id === 'btnFs') return openFontScale();

  /* 账号切换（系统设置 → 账号，以及「我的」页胶囊里那个入口）。
     删除要排在切换前面判 —— 两个属性名前缀相同，先判 data-acct 的话
     data-acctdel 的元素会走进切换分支（dataset.acct 是 undefined，看着像没反应）。 */
  if (el.id === 'btnAccts') return openAccounts();
  if (el.dataset.acctdel != null) {
    acctForget(Number(el.dataset.acctdel));
    openAccounts();
    return;
  }
  if (el.dataset.acct != null) return acctSwitch(Number(el.dataset.acct));

  /* ---------- 面板设置 → 应用设置 ----------
     「换密钥」要排在「编辑」前面判：两者属性名不同（appsecret / appedit），
     本身不冲突，但破坏性的分支先判是这里的惯例 —— 以后有人把属性名写成
     data-appedit-secret 之类的前缀重叠形式，也不会误进编辑分支。 */
  if (el.id === 'btnNewApp') return openAppEdit(null);
  if (el.id === 'btnAppRetry') return loadApps(true);
  if (el.dataset.appdel != null) return deleteApp(el.dataset.appdel);
  if (el.dataset.appsecret != null) return resetAppSecret(el.dataset.appsecret);
  if (el.dataset.appedit != null) return openAppEdit(el.dataset.appedit);
  if (el.id === 'btnAppSave') return saveApp(editingAppId);
  /* 权限标签：只切这一个按钮的选中态，**不重画弹层** ——
     重画会把名称输入框里已经打的字冲掉。 */
  if (el.dataset.scope != null) { el.classList.toggle('on'); return; }
  if (el.dataset.reveal != null) return toggleAppSecret(el);
  /* 复制。注意跟上面的 data-copycmd 是两个属性（dataset.copy vs dataset.copycmd），
     互不干扰；空值单独挡一道，否则会「提示已复制但剪贴板是空的」。 */
  if (el.dataset.copy != null) {
    if (!el.dataset.copy) { toast('没有内容可复制', true); return; }
    copyText(el.dataset.copy);
    return;
  }
  if (el.id === 'btnCopyNewSec') return copyText(lastNewSecret);

  /* ---------- 面板设置 → 其他设置 ---------- */
  if (el.dataset.scsave != null) return saveSysconfFromDom(el.dataset.scsave);
  if (el.dataset.scmod != null) return toggleBackupMod(el);
  if (el.id === 'btnScRetry') return loadSysconf(true);
  if (el.id === 'btnScExport') return exportBackup();
  /* 还原：点按钮只是去点那个藏起来的 file input。
     input 不能 display:none —— 部分 WebView 对隐藏的文件选择器不弹选择器。 */
  if (el.id === 'btnScImport') { var fi = $('#fileScImport'); if (fi) fi.click(); return; }
  if (el.id === 'btnScCheck') return checkPanelUpdate();
  if (el.id === 'btnScReload') return reloadPanel();

  /* ---------- 面板设置 → 登录日志 ---------- */
  if (el.id === 'btnLogRetry') return loadLoginLog(true);

  /* 任务页工具条：编辑开关 / 状态筛选 / 底部批量操作栏。
     必须排在下面的「任务列表」分支之前 —— 这些按钮都在任务页里，
     顺序反了会被 data-cron 之类的分支先截走。 */
  if (el.id === 'btnCronEdit') return toggleCronEdit();
  if (el.dataset.cf) return setCronFilter(el.dataset.cf);
  /* 视图 id 用 != null 判而不是真值判：id 是后端自增主键，虽然目前从 1 起，
     但真值判会顺手把 '0' 也吞掉，以后面板改了主键起点就是个哑 bug。 */
  if (el.dataset.view != null) return setView(el.dataset.view);
  if (el.id === 'btnCronAll') return cronSelectAll(cronSelCount() !== cronFiltered().length);
  if (el.dataset.cbatch) return cronBatch(el.dataset.cbatch);
  /* 变量页工具条 / 批量栏 / 日志「跳到最新」。和上面一样必须排在
     data-env / data-eact 之前，否则会被那些分支先截走。 */
  /* 1.0.25：趋势图「7 / 30 天」切换 + 点柱子看那天；
     主页「正在执行 N 个」跳到任务页的「运行中」筛选。
     data-tday 用 `!= null` 判断：那天下标是 0 时字符串 '0' 也成立，
     但写成 `if (el.dataset.tday)` 也能过 —— 这里按数取值，显式一点。 */
  if (el.dataset.gocrons) return gotoCrons(el.dataset.gocrons);
  if (el.dataset.tdays) return setTrendDays(el.dataset.tdays);
  if (el.dataset.tday != null) return pickTrendDay(Number(el.dataset.tday));
  if (el.id === 'btnEnvEdit') return toggleEnvEdit();
  if (el.id === 'btnEnvAll') return envSelectAll(envSelCount() !== envFiltered().length);
  if (el.dataset.ebatch) return envBatch(el.dataset.ebatch);
  if (el.id === 'btnLogTail') return jumpLogTail();
  /* 主机卡的头像：弹大图（带「刷新」按钮）。没设过头像也照样进。 */
  if (el.dataset.viewav) return openAvSheet();
  /* 任务详情里的三处直达：脚本 / 最新日志 / 日志历史 */
  if (el.dataset.goscript) return gotoScript(el.dataset.goscript);
  if (el.dataset.gocronlog) return openCronLog(cronById(el.dataset.gocronlog));
  if (el.dataset.gocronlogdir) return gotoCronLogDir(cronById(el.dataset.gocronlogdir));

  /* 任务列表 */
  if (el.dataset.act) {
    ev.stopPropagation();
    if (el.dataset.act === 'more') return openCronMore(id);
    return cronAction(id, el.dataset.act);
  }
  /* 编辑模式下点整张卡片 = 勾选 / 取消勾选，不再是打开详情 */
  if (el.dataset.cron) {
    if (S.crons.edit) return toggleCronSel(Number(el.dataset.cron));
    return openCron(Number(el.dataset.cron));
  }

  /* 任务详情 / 更多菜单里的动作 */
  if (el.dataset.mact) { closeSheet(); return cronAction(id, el.dataset.mact); }
  if (el.dataset.dact) { cronAction(id, el.dataset.dact); return; }
  if (el.dataset.edit) return openCronEdit(id);
  if (el.dataset.copycmd) {
    var t = S.crons.list.filter(function (x) { return x.id === Number(id); })[0];
    if (t) copyText(t.command || '');
    return;
  }
  if (el.dataset.del) {
    if (!confirm('确认删除这个任务？删除后不可恢复。')) return;
    closeSheet();
    cronAction(id, 'delete');
    return;
  }

  /* 编辑表单里的常用规则 */
  if (el.dataset.preset) {
    var sc = $('#eSched');
    if (sc) {
      sc.value = el.dataset.preset;
      sc.dispatchEvent(new Event('input', { bubbles: true }));
    }
    return;
  }

  /* 日志相关 */
  if (el.id === 'btnLogReload') {
    if (S.detailId) loadCronLog(S.detailId, false);
    return;
  }
  if (el.id === 'btnLogCopy') {
    /* 复制的是**筛过的那份**（按当前开关），而且走原文 ——
       读 box.textContent 的话，开了筛选会把行号一起复制走。 */
    var cl = S.cronlog;
    return copyText(logPickText(cl.lines, cl.onlyErr, cl.q));
  }
  /* 详情页运行日志的「只看错误」：和日志文件弹层同一个开关语义，
     点一次只看错误、再点一次看全部，**不重新打接口**。 */
  if (el.id === 'btnCronLogErr') {
    S.cronlog.onlyErr = !S.cronlog.onlyErr;
    return paintCronLog();
  }

  /* 面板日志的「只看错误」/「复制」：和另外两处日志界面同一个开关语义。
     内容已经在 S.syslog.text 里，**不重新打接口**（切一下开关就打一次接口
     既慢又会闪一下）。复制走原文 —— 读 DOM 的话筛选态会把行号一起复制走。 */
  if (el.id === 'btnSysLogErr') {
    S.syslog.onlyErr = !S.syslog.onlyErr;
    return paintSysLog();
  }
  if (el.id === 'btnSysLogCopy') {
    var sg = S.syslog;
    if (!sg.onlyErr && !sg.q) return copyText(sg.text || '');
    return copyText(logPickText(sysLogLines(), sg.onlyErr, sg.q));
  }

  /* 任务保存 */
  if (el.id === 'btnSaveCron') return saveCron(id || null);

  /* 变量：标签筛选条。再点一次同一个标签 = 取消筛选（比去找「全部」按钮顺手）。 */
  if (el.dataset.envtag != null) {
    var tg = el.dataset.envtag;
    S.envs.tag = (tg === '__all' || S.envs.tag === tg) ? '' : tg;
    renderEnvs();
    return;
  }

  /* 变量：编辑模式下点整行 = 勾选 / 取消勾选（不再是「什么都不发生」——
     行本身以前没有点击行为，只有行内按钮管用）。 */
  if (el.dataset.env && S.envs.edit) return toggleEnvSel(Number(el.dataset.env));

  /* 变量 */
  if (el.dataset.eact) {
    var v = S.envs.list.filter(function (x) { return x.id === Number(id); })[0];
    if (!v) return;
    /* 复制的是**真实值**（不是打码的那份），也不用先「显示值」——
       打码只是防肩窥，复制这个动作本来就是用户主动要的。 */
    if (el.dataset.eact === 'copy') { copyText(v.value || ''); return; }
    if (el.dataset.eact === 'reveal') {
      var line = document.querySelector('[data-val="' + id + '"]');
      if (!line) return;
      var shown = line.dataset.shown === '1';
      line.textContent = shown ? maskValue(v.value) : (v.value || '（空）');
      line.dataset.shown = shown ? '0' : '1';
      /* 显示时换成换行完整显示 —— 单行省略号会把长 cookie 截掉大半
         （见 .envval.full 的注释）。藏起来时换回 .ell 的单行。 */
      line.classList.toggle('full', !shown);
      el.textContent = shown ? '显示值' : '隐藏值';
      return;
    }
    if (el.dataset.eact === 'edit') return openEnvEdit(id);
    if (el.dataset.eact === 'enable' || el.dataset.eact === 'disable') {
      var path = el.dataset.eact === 'enable' ? '/api/envs/enable' : '/api/envs/disable';
      api(path, { method: 'PUT', body: [Number(id)] })
        .then(function () { toast('已' + (el.dataset.eact === 'enable' ? '启用' : '禁用')); loadEnvs(); })
        .catch(function (e) { toast(e.message, true); });
      return;
    }
  }
  if (el.id === 'btnSaveEnv') return saveEnv(id || null);
  if (el.id === 'btnDelEnv') {
    if (!confirm('确认删除这个变量？')) return;
    api('/api/envs', { method: 'DELETE', body: [Number(id)] })
      .then(function () { toast('已删除'); closeSheet(); loadEnvs(); })
      .catch(function (e) { toast(e.message, true); });
    return;
  }

  /* 日志文件 */
  if (el.dataset.log) {
    var key = el.dataset.log;
    /* key 是完整相对路径，直接拆成逐级前缀 —— 搜索结果也能正确下钻。
       进目录就退出搜索态：不然点了之后列表还是那批搜索结果，像没反应。 */
    if (el.dataset.dir === '1') { clearLogSearch(); return loadLogs(logKeyPath(key)); }
    /* 搜索结果可能来自任意目录，不能只在当前层找 */
    var node = findLogNode(key);
    if (node) return openLogFile(node);
  }
  /* 返回上一级同样退出搜索态（搜索态下根本不渲染 logUp，能点到这里说明在浏览） */
  if (el.id === 'logUp') { clearLogSearch(); return loadLogs(S.logs.path.slice(0, -1)); }
  /* 复制的是 S.logfile 里的**原始文本**，不是从 DOM 读 ——
     「只看错误」模式下 DOM 里每行前面带了行号，读 DOM 会把行号一起复制走。 */
  if (el.id === 'btnCopyLog') return copyText(logCopyText());
  /* 切「只看错误」：**不重新打接口**，内容已经在 S.logfile 里了 */
  if (el.id === 'btnLogErr') {
    S.logfile.onlyErr = !S.logfile.onlyErr;
    return paintLogFile();
  }
  if (el.id === 'btnDelLog') {
    if (!confirm('确认删除这个日志文件？')) return;
    api('/api/logs', { method: 'DELETE', body: { filename: el.dataset.file, path: el.dataset.path } })
      .then(function () { toast('已删除'); closeSheet(); loadLogs(S.logs.path); })
      .catch(function (e) { toast(e.message, true); });
    return;
  }

  /* ---------- 脚本管理 ---------- */
  /* 先判 data-sact：菜单项和行内「⋯」都同时带 data-scr，反了会误当成「打开文件」 */
  if (el.dataset.sact) {
    var sf = el.dataset.scr;
    /* data-path 是「这个条目所在的文件夹」。顶栏「+」菜单里的项没有 data-path，
       落到 scriptDir()（树形模式恒为空串 = 根目录）；文件夹的 ⋯ 菜单里则带着那个文件夹。
       两种情况共用下面同一段逻辑。 */
    var sd = el.dataset.path != null ? el.dataset.path : scriptDir();
    var act = el.dataset.sact;

    /* 「+」菜单：上传 / 新建脚本 / 新建文件夹 */
    if (act === 'upload') {
      closeSheet();
      $('#scrAddMenu').classList.add('hidden');
      S.scripts.upDir = sd;
      var pick = $('#filePick');
      /* 先清空：同一个文件连选两次时，值没变就不会触发 change */
      if (pick) { pick.value = ''; pick.click(); }
      return;
    }
    if (act === 'newfile') {
      $('#scrAddMenu').classList.add('hidden');
      return openScriptNew(false, sd);
    }
    if (act === 'newdir') {
      $('#scrAddMenu').classList.add('hidden');
      return openScriptNew(true, sd);
    }

    if (act === 'more') return openScriptMore(sd, sf, el.dataset.scrtype);
    if (act === 'edit') {
      var en = findScriptNode(sd, sf);
      if (en) openScriptEditor(en, sd);
      return;
    }
    closeSheet();
    if (act === 'run') return runScript(sd, sf, false);
    if (act === 'log') return openScriptLog(sd, sf);
    if (act === 'download') return downloadScript(sd, sf);
    if (act === 'rename') return openScriptRename(sd, sf);
    if (act === 'delete') return delScript(sd, sf, el.dataset.scrtype);
    return;
  }
  /* 文件夹右边的「⌄」：只在本机展开/收起 */
  if (el.dataset.scrtog != null) return toggleScrDir(el.dataset.scrtog);
  if (el.dataset.scr) {
    var sdir = el.dataset.path || '';
    /* 点文件夹整行也当展开/收起 —— 树形界面里这是最不容易点错的行为。
       要在这个文件夹里新建/上传，走右边的「⋯」。 */
    if (el.dataset.scrtype === 'directory') return toggleScrDir(scrKey(sdir, el.dataset.scr));
    var sn = findScriptNode(sdir, el.dataset.scr);
    if (sn) openScriptEditor(sn, sdir);
    return;
  }
  if (el.id === 'btnNewScriptOk') return createScript(el.dataset.dir === '1', el.dataset.path);
  if (el.id === 'btnSaveScript') return saveScript(el.dataset.path, el.dataset.file);
  if (el.id === 'btnRunScript') return runScript(el.dataset.path, el.dataset.file, true);
  if (el.id === 'btnRenameScript') return openScriptRename(el.dataset.path, el.dataset.file);
  if (el.id === 'btnDelScript') return delScript(el.dataset.path, el.dataset.file, 'file');
  if (el.id === 'btnRenameOk') return renameScript(el.dataset.path, el.dataset.file);

  /* ---------- 依赖管理 ---------- */
  if (el.dataset.depact) {
    var dact = el.dataset.depact;
    if (dact === 'log') return openDepLog(el.dataset.id);
    if (dact === 'more') return openDepMore(el.dataset.id);
    if (dact === 'edit') { closeSheet(); return openDepEdit(el.dataset.id); }
    return depAction(el.dataset.id, dact);
  }
  if (el.id === 'btnSaveDep') return saveDep(el.dataset.id || null);
  if (el.id === 'btnDepLogReload') return openDepLog(el.dataset.id);

  /* ---------- 订阅管理 ---------- */
  if (el.dataset.subact) {
    var suact = el.dataset.subact;
    var sx = S.subs.list.filter(function (y) { return y.id === Number(el.dataset.id); })[0];
    if (suact === 'log') return openSubLog(el.dataset.id);
    if (suact === 'more') return openSubMore(el.dataset.id);
    if (suact === 'edit') { closeSheet(); return openSubEdit(el.dataset.id); }
    if (suact === 'copyurl') { closeSheet(); copyText(sx ? sx.url || '' : ''); return; }
    if (suact === 'delete') {
      if (!confirm('确认删除这个订阅？已经拉取到脚本目录的文件会保留。')) return;
      return subAction(el.dataset.id, 'delete');
    }
    if (suact === 'forcedel') {
      if (!confirm('删除订阅，并把已经拉取到脚本目录的文件一起删掉？此操作不可恢复。')) return;
      return subAction(el.dataset.id, 'forcedel');
    }
    return subAction(el.dataset.id, suact);
  }
  if (el.id === 'btnSaveSub') return saveSub(el.dataset.id || null);
  if (el.id === 'btnSubLogReload') return loadSubLog(el.dataset.id);

  /* ---------- 配置文件 ---------- */
  if (el.dataset.cfg) return openConfigFile(el.dataset.cfg);
  if (el.dataset.cfgsample) {
    var cni = $('#cfgNewName');
    if (cni) cni.value = el.dataset.cfgsample;
    return;
  }
  if (el.id === 'btnSaveCfg') return saveConfig(el.dataset.name);
  if (el.id === 'btnNewCfgOk') return createConfig();

  /* 「所有功能」网格里的跳转卡片（依赖 / 配置 / 日志没有底栏 tab，从这里进）。
     切页之前**必须先关弹层** —— 这几张卡原来也在系统设置弹层里出现过（1.0.15 已撤），
     而 setTab() 只管换视图、不管弹层。不关的话页面在弹层后面换了，用户看到的是
     「点了没反应」，不报错、也不进日志，只有真机点一遍才发现。 */
  if (el.dataset.goto) { closeSheet(); return setTab(el.dataset.goto); }
  /* 网格里那两张「不是 tab」的卡片：走弹层 */
  if (el.id === 'btnAcct') return openAccount();
  if (el.id === 'btnSettings') return openSettings();

  /* 我的 */
  if (el.id === 'btnSaveServer') {
    var v2 = $('#meServer').value.trim();
    if (!v2) return toast('地址不能为空', true);
    if (v2 === S.server) return toast('地址没有变化');
    S.server = v2;
    sset(K.server, v2);
    syncTarget();          // 地址变了，原生代理也要跟着改，否则转发到旧地址
    signOut(true);
    toast('地址已更新，请重新登录');
    return;
  }
  if (el.id === 'btnLogout') {
    if (!confirm('确认退出登录？')) return;
    signOut(false);
    return;
  }
  /* 登录页上的诊断入口。必须放在这里 —— 登录失败时用户进不去「我的」，
     把诊断只挂在「我的」页等于没有。 */
  if (el.id === 'btnDiagLogin' || el.id === 'btnDiag') {
    openSheet('连接诊断', '<div class="f13 t2" style="padding:6px 4px 12px">正在测试，大概几秒钟…</div>');
    diagnose().then(function (html) { openSheet('连接诊断', html); });
    return;
  }
}

/* ================= 连接诊断 ================= */

/* 原生自检的返回值登记表。原生侧是异步的，做完通过 window.__qlProbe 回调回来。 */
var _probes = {};
window.__qlProbe = function (id, res) {
  var p = _probes[id];
  if (!p) return;
  delete _probes[id];
  clearTimeout(p.timer);
  p.resolve(res);
};

/* 让 App 的原生壳用系统 HTTP 栈去请求一次，完全绕开 WebView。
   这是整个诊断里最有价值的一步：它能把「手机的网络不通」和
   「页面里的请求被拦」彻底分开 —— 前者改代码没用，后者才有救。 */
function nativeProbe(url) {
  return new Promise(function (resolve) {
    if (!window.QLNative || typeof window.QLNative.probe !== 'function') {
      resolve(null);
      return;
    }
    var id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    _probes[id] = {
      resolve: resolve,
      timer: setTimeout(function () {
        delete _probes[id];
        resolve({ ok: false, step: -1, err: '原生自检 15 秒没返回', ms: 15000 });
      }, 15000)
    };
    try {
      window.QLNative.probe(url, id);
    } catch (e) {
      clearTimeout(_probes[id].timer);
      delete _probes[id];
      resolve({ ok: false, step: -1, err: '调用原生失败：' + (e && e.message), ms: 0 });
    }
  });
}

/* 头像自检。头像这条链比别的请求多一步（先 /api/user 拿文件名，再取图），
   而且**每一步失败都是静默的** —— 页面上只是继续显示首字母，不报错、不留痕。
   所以在这儿把三段全摊开：avatar 字段是什么、拼出来的地址长什么样、
   取图那步 HTTP 多少、拿到多少字节。出问题就不用靠猜了。 */
async function diagAvatar() {
  var L = [];
  var raw = '';
  try {
    var me = await api('/api/user');
    raw = (me.data && me.data.avatar) ? String(me.data.avatar).trim() : '';
    L.push('/api/user   OK     username=' + ((me.data && me.data.username) || '?') +
      '  avatar=' + (raw || '（空 —— 面板上没设头像，显示首字母是对的）'));
  } catch (e) {
    L.push('/api/user   失败：' + (e && e.message ? e.message : '错误'));
    return L;
  }
  if (!raw) return L;
  if (/^data:/i.test(raw)) { L.push('面板直接给了 data: URL，拿来就能用。'); return L; }
  var url = avStaticUrl(raw);
  L.push('取图地址    ' + url);
  try {
    var res = await fetch(url, {
      headers: S.token ? { Authorization: 'Bearer ' + S.token } : {},
      cache: 'no-store'
    });
    L.push('HTTP        ' + res.status + (res.ok ? '' : '   ← 不是 2xx，图取不到'));
    var blob = await res.blob();
    L.push('字节        ' + (blob ? blob.size : 0) + (blob && blob.size ? '' : '   ← 空的'));
    if (blob && blob.size) L.push('结论：头像能取到，App 里应该显示成图片而不是首字母。');
  } catch (e) {
    L.push('取图失败    ' + (e && e.message ? e.message : '错误'));
  }
  return L;
}

async function diagnose() {
  var L = [];
  var viaProxy = apiBase() !== base();
  L.push('运行环境    ' + (!window.__QL_NATIVE__ ? '浏览器'
    : (window.__QL_NATIVE__ === 'ios' ? 'iOS App' : '安卓 App')));
  L.push('面板地址    ' + base());
  L.push('请求发往    ' + apiBase() + (viaProxy ? '   （App 内置代理，同源转发）' : '   （直连）'));
  L.push('页面地址    ' + location.href);
  L.push('页面协议    ' + location.protocol);
  L.push('安全上下文  ' + (window.isSecureContext ? '是' : '否'));
  L.push('本机打开    ' + (isLocalPage() ? '是' : '否'));
  L.push('User-Agent  ' + navigator.userAgent);
  try {
    sset('__t', '1');
    var roundTrip = sget('__t') === '1';
    sdel('__t');
    L.push('本地存储    ' + (roundTrip ? '可读写' : '写进去了读不回来（登录状态存不住）')
      + '，后端 ' + (NS ? 'App 私有存储' : 'localStorage'));
  } catch (e) {
    L.push('本地存储    不可用（令牌存不下，登录会一直失败）');
  }
  L.push('记住密码    ' + (rememberOn() ? '已开启' : '未开启')
    + (sget(K.pass) ? '，凭据已保存' : ''));
  L.push('原生桥      ' + (window.QLNative ? '已接上' : '没有'));

  /* ── 第一段：原生自检，绕开 WebView ── */
  L.push('');
  L.push('══ 原生自检（绕开 WebView，走系统 HTTP 栈）══');
  var np = await nativeProbe(base() + '/api/system');
  var nativeVerdict = null;   // true=网络通 false=网络不通 null=测不了
  if (!np) {
    L.push('不可用 —— 当前不是原生 App。');
  } else if (np.ok) {
    nativeVerdict = true;
    L.push('DNS   OK    ' + (np.ip || '') + ':' + np.port);
    L.push('TCP   OK    已连上');
    L.push('HTTP  OK    ' + np.status + '     ' + np.ms + 'ms');
    L.push('响应        ' + String(np.body || '').slice(0, 120).replace(/\s+/g, ' '));
  } else {
    nativeVerdict = false;
    L.push('第 ' + (np.step + 1) + ' 步失败    用了 ' + np.ms + 'ms');
    L.push('目标        ' + (np.ip || np.host || '?') + ':' + np.port);
    L.push('原因        ' + np.err);
  }

  /* ── 第二段：页面实际走的请求 ── */
  L.push('');
  L.push('══ 页面请求 GET /api/system ══');
  var t0 = Date.now();
  try {
    var res = await fetch(apiBase() + '/api/system', {
      cache: 'no-store', headers: { Accept: 'application/json' }
    });
    var txt = await res.text();
    L.push('HTTP ' + res.status + '    ' + (Date.now() - t0) + 'ms');
    L.push('响应 ' + txt.slice(0, 150).replace(/\s+/g, ' '));
    var j = null;
    try { j = JSON.parse(txt); } catch (e) {}
    L.push('');
    if (j && j.code === 200 && j.data) {
      L.push('结论：面板可达，地址和网络都没问题。');
      L.push('      面板版本 ' + (j.data.version || '?') + '，登录失败的话是账号密码的问题。');
      L.push('');
      L.push('══ 头像 ══');
      L.push.apply(L, await diagAvatar());
    } else if (j && j.code === 502) {
      L.push('结论：App 内置代理转发失败，原因就是上面那句。');
      L.push('      这不是跨域或页面的问题 —— 是这台手机到面板这一段不通。');
    } else {
      L.push('结论：连上了，但返回的不是青龙的响应。');
      L.push('      地址可能指向了别的服务，检查端口号有没有写错。');
    }
    return diagHtml(L);
  } catch (e) {
    L.push('失败：' + (e && e.name ? e.name + ' · ' : '') + (e && e.message ? e.message : '网络错误'));
  }

  /* ── 第三段：结论 ── */
  L.push('');
  L.push('══ 结论 ══');
  if (nativeVerdict === false) {
    L.push('跟 App、跟页面都没关系 —— 这台手机的网络连不上面板。');
    L.push('也就是说：换成浏览器、换成电脑，只要在这台手机/这个网络下，一样连不上。');
    L.push('');
    L.push('按失败的那一步去查：');
    if (np.step === 0) L.push('· 地址格式不对，确认写成 http://IP:端口');
    if (np.step === 1) L.push('· 域名解析不了，换成 IP 地址试试');
    if (np.step === 2) L.push('· 端口 ' + np.port + ' 不通。三种可能：面板进程没在跑；');
    if (np.step === 2) L.push('  云服务器安全组没放行这个端口；当前网络（比如公司/校园网）封了它。');
    if (np.step === 3) L.push('· TCP 通了但 HTTP 没回应。确认这个端口上跑的确实是青龙，');
    if (np.step === 3) L.push('  以及没被中间的设备拦下来。');
    L.push('');
    L.push('最快的验证：用手机浏览器直接打开 ' + base() + ' ，打不开就证实了。');
  } else if (nativeVerdict === true) {
    L.push('手机的网络到面板是通的（原生自检拿到了正常响应），');
    L.push('但页面这一侧的请求失败了。');
    L.push('');
    L.push('· 如果「请求发往」写的是 App 内置代理，那说明代理转发环节出了问题，');
    L.push('  把这份报告发我。');
    L.push('· 可以先去「我的」页把面板地址重新填一次再试，排除地址里混进了空格。');
  } else {
    L.push('请求没能发出去、或没能回来。');
    L.push('');
    if (window.__QL_NATIVE__) {
      L.push('· 在原生 App 里，壳已放开跨域，理论上没有同源限制。');
      L.push('  既然还是连不上，多半是当前网络到面板不通。');
    } else if (location.protocol === 'file:') {
      L.push('· 页面是双击文件用 file:// 打开的。浏览器禁止这种页面发网络请求。');
      L.push('  要改成 http 地址访问：部署到面板上，或本机起个服务。');
    } else if (location.protocol === 'https:' && base().indexOf('http://') === 0) {
      L.push('· 混合内容：https 页面不能请求 http 地址，浏览器会直接拦掉。');
      L.push('  要么把页面也放 http 上，要么给面板配 HTTPS，要么加一层 https 中转。');
    } else if (isLocalPage()) {
      L.push('· 页面在本机、面板在公网，属于跨域请求，可能被浏览器或本机代理拦截。');
      L.push('  最稳的做法：把页面部署到面板上，用同源地址访问。');
    } else {
      L.push('· 地址写错了（确认带 http:// 前缀和端口号）。');
      L.push('· 当前网络到面板不通（换手机流量试试，确认防火墙放行了该端口）。');
      L.push('· 面板进程没在运行。');
    }
  }
  L.push('');
  L.push('完整地址 ' + base() + '/api/system');
  return diagHtml(L);
}

function diagHtml(L) {
  return '<div class="card" style="padding:14px">' +
    '<pre style="margin:0;white-space:pre-wrap;word-break:break-all;font-size:calc(12px*var(--fs));' +
    'line-height:1.75;font-family:ui-monospace,Menlo,Consolas,monospace">' +
    esc(L.join('\n')) + '</pre></div>' +
    '<div class="f11 t3" style="margin:12px 4px">把这段内容发给我就能直接定位问题。</div>';
}

/* ================= 启动 ================= */
async function boot() {
  bind();
  syncTarget();          // 先把面板地址交给原生代理，之后所有 /api 请求才转得出去
  applyTheme();          // 外观：先把 data-theme 挂上去，避免首屏按系统色闪一下才跟上
  applyFontScale();      // 字体大小：同理，先挂 --fs，免得首屏先按标准字号画一遍再跳
  await detectServer();

  if (!S.token) {
    /* 没有令牌：第一次用、令牌过期、或存储被清过。
       存了账号密码就直接自动登一次 —— 用户不该为「App 重开了」这件事买单。
       失败就静默退回登录页（凭据已填好，点一下就行）。 */
    showLogin();
    if (shouldAutoLogin()) {
      autoRetried = true;
      if (await doLogin(true)) return;
    }
    return;
  }

  showApp();
  try {
    var sys = await api('/api/system');
    S.sys = sys.data || null;
  } catch (e) { /* 忽略 */ }
  setTab(S.tab, true);
  /* 头像**必须在这条路上也拉一次**。
     这条「已经有令牌」的分支才是 App 的**常规**启动路径（用户平时重开 App 走的就是
     它），而以前只有 doLogin 那条路会调 loadAvatar —— 于是只要 App 一重开，
     头像就永远是首字母。1.0.17 那次「真机不显示」其实一直没被走到。
     不 await：它要连下两个请求（/api/user + 取图），压在这里会拖慢首屏；
     先让界面出来（这时是首字母），拉到了 paintAvatars 就地换掉。 */
  loadAvatar().then(paintAvatars);
}

document.addEventListener('DOMContentLoaded', boot);

})();
</script>
