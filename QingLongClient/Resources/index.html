/* 头像取用户名首字母。用户名要登录之后才知道，所以登录前后都必须能安全调用
   （未登录时 S.user 是空串，退回一个字形）。 */
function avChar() {
  var u = String(S.user == null ? '' : S.user).trim();
  return u ? u.charAt(0).toUpperCase() : '◍';
}
/* ================= 面板头像 =================
   两段式：
     文件名  GET /api/user → data.avatar（青龙存的是 uuid + 原扩展名，只有文件名）
     图      /api/static/<文件名>  —— back/loaders/express.ts 里
             `app.use('/api/static', express.static(uploadPath))` 挂在 jwt **之前**，
             理论上不带鉴权。

   **但不直连，走 fetch。** 第一版就是直接把 /api/static/xxx 塞进 <img src>，
   真机上不显示，原因至少有三条：
     · iOS 的页面是 loadFileURL 加载的（file:// 源），远程子资源能不能加载没保证；
     · 安卓的页面来自 App 内置回环服务，那个服务只代理**页面发出的 fetch**，
       <img> 的加载它不管，地址会打到回环服务上直接 404；
     · 万一某版面板把静态挂载挪到鉴权后面，直连还会 401。
   走 fetch 就和其它所有请求同一条路（iOS 原生桥 / 安卓本地代理），还能带上 token，
   拿回 blob 再转成 data: URL 塞进 <img>。代价是图片过一次 base64（只在内存里），
   换的是「一定能显示」。 */
function avStaticUrl(file) {
  var f = String(file == null ? '' : file).trim();
  if (!f) return '';
  /* 有的面板/改版把整条 URL 或 data: 直接塞在 avatar 字段里 —— 那就别再拼了 */
  if (/^(data:|https?:\/\/)/i.test(f)) return f;
  /* 以 `/` 开头的是**相对面板**的路径（如 `/api/static/x.png`）。
     不能原样塞进 <img src>：iOS 的页面是 file:// 加载的，以 `/` 开头的地址
     会被解析成 `file:///api/static/x.png`，永远加载不出来 —— 而且**不报错**，
     表现就是「头像一直是首字母」。所以一律补上面板地址。 */
  if (f.charAt(0) === '/') return apiBase() + f;
  return apiBase() + '/api/static/' + encodeURIComponent(f);
}
/* <img> 真正用的地址：S.avatarSrc（data: URL，或面板直接给的 URL）。空串 = 没头像 */
function avUrl() { return String(S.avatarSrc || ''); }
/* 头像的**内部**那段 HTML：有图出图，没图出首字母。 */
function avInner() {
  var u = avUrl();
  if (!u) return esc(avChar());
  return '<img class="avimg" src="' + esc(u) + '" alt="">';
}
function blobToDataUrl(blob) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () { res(String(fr.result || '')); };
    fr.onerror = function () { rej(new Error('图片读取失败')); };
    fr.readAsDataURL(blob);
  });
}
/* 拉一次头像。**任何一步失败都只是「没有头像」**，绝不往外抛 ——
   一张图不该有权力影响登录流程。 */
async function loadAvatar() {
  S.avatar = ''; S.avatarSrc = '';
  try {
    var me = await api('/api/user');
    var raw = (me.data && me.data.avatar) ? String(me.data.avatar).trim() : '';
    if (!raw) return;
    S.avatar = raw;
    /* 面板直接塞了个 data: URL —— 拿来就能用，不用再取一次 */
    if (/^data:/i.test(raw)) { S.avatarSrc = raw; return; }
    /* 其余**一律走 fetch 拿字节再转 data: URL**，包括面板给的 http(s) 绝对地址。
       iOS 的页面是 file:// 加载的，<img src> 指远程地址能不能加载没保证
       （安卓那边更明确：回环服务只代理页面发出的 fetch，<img> 的加载它不管）。
       走 fetch 就和其他所有请求同一条路，还能带上 token。 */
    var res = await fetch(avStaticUrl(raw), {
      headers: S.token ? { Authorization: 'Bearer ' + S.token } : {},
      cache: 'no-store'
    });
    if (!res.ok) return;
    var blob = await res.blob();
    if (!blob || !blob.size) return;
    S.avatarSrc = await blobToDataUrl(blob);
  } catch (e) { S.avatar = ''; S.avatarSrc = ''; }
}
/* 头像没了（取不到 / 解码失败）→ 三处**一起**退回首字母。
   只换掉出问题的那一个没用：三处用的是同一张图，一张不行就是都不行。 */
function avFallbackAll() {
  S.avatar = ''; S.avatarSrc = '';
  $$('.hav, .acct .av, #tabAv').forEach(function (box) { box.textContent = avChar(); });
}
/* 给刚渲染出来的头像 <img> 挂 error 监听（data: URL 也可能解不出来）。
   **必须每次渲染完调一次**：img 是 innerHTML 塞进去的，新元素上没有任何监听；
   而且整段脚本包在 IIFE 里（没有全局函数），写 onerror="xxx(this)" 取不到函数。 */
function bindAvImgs() {
  $$('.avimg').forEach(function (im) {
    if (im.__avb) return;      // 同一个元素别重复挂
    im.__avb = true;
    im.addEventListener('error', avFallbackAll);
  });
}
/* 头像异步到位之后，把**已经画出来的**三处就地换掉 —— 不整页重渲染，
   省得用户正看着的内容闪一下。没进 DOM 的（比如没进过「我的」页）自然跳过。 */
function paintAvatars() {
  setAvInner($('#tabAv'));
  $$('.hav, .acct .av').forEach(function (box) { setAvInner(box); });
  bindAvImgs();
}
/* 把 avInner() 的结果塞进一个已有元素。
   **没图的时候走 textContent**：结果就是一个字符，没必要过一遍 HTML 解析 ——
   用户名里真要有 & < 之类的字符，走 innerHTML 会被当成标签吃掉。
   有图（含 '<'）时才用 innerHTML。 */
function setAvInner(el) {
  if (!el) return;
  var h = avInner();
  if (h.indexOf('<') < 0) { el.textContent = h; return; }
  el.innerHTML = h;
}
function syncTabAvatar() {
  setAvInner($('#tabAv'));
  bindAvImgs();
}

/* 点头像弹大图。
   主机卡里那个 46px 的圆根本看不清面板上传的图是谁，点开才有意义。
   顺手带个「刷新」：用户在面板网页版改了头像，App 这边要再拉一次 /api/user 才看得到。
   再带个「复制地址」：发现头像不对时，下一步一定是去面板网页版改，
   而面板地址是在 App 里手输的、多半记不住，一键复制过去最省事。
   **没有头像时也照样能进** —— 弹层里就显示首字母 + 一句提示，省得用户点了没反应。 */
async function openAvSheet() {
  var u = avUrl();
  var meta = [];
  if (S.user) meta.push(esc(S.user));
  if (S.sys && S.sys.version) meta.push('青龙 ' + esc(S.sys.version));
  if (S.dash.sys && S.dash.sys.platform) meta.push(esc(S.dash.sys.platform));
  /* meta.join(' · ') 可能为空数组 → ''，fallback 到「未登录」一眼就能看出来 */
  var metaTxt = meta.length ? meta.join(' · ') : '未连接面板';
  var h =
    '<div class="avsheet">' +
      (u
        ? '<img class="avbig" src="' + esc(u) + '" alt="">'
        : '<div class="avbig avbig-fb">' + esc(avChar()) + '</div>') +
      '<div class="avbig-meta">' + metaTxt + '</div>' +
      (u ? '' : '<div class="avbig-tip">面板「系统设置 → 安全设置 → 更换头像」里传一张就有了</div>') +
      (S.server ? '<div class="avbig-url ell">' + esc(S.server) + '</div>' : '') +
      '<div class="row" style="gap:8px;margin-top:14px">' +
        '<button class="btn pri" style="flex:1" id="avSheetReload">刷新</button>' +
        (S.server ? '<button class="btn" style="flex:1" id="avSheetCopy">复制地址</button>' : '') +
        '<button class="btn" style="flex:1" id="avSheetClose">关闭</button>' +
      '</div>' +
    '</div>';
  openSheet('头像', h);
  var sheetEl = $('#sheet');
  var big = sheetEl.querySelector ? sheetEl.querySelector('.avbig') : null;
  if (big && big.tagName === 'IMG') bindAvImgs();
  /* 刷新 = 重新走一遍 loadAvatar（/api/user + 取图）→ 换掉三处头像。
     拉不到保持原状（不弹错误，免得用户以为 App 坏了）。 */
  $('#avSheetReload').addEventListener('click', async function () {
    var old = S.avatar;
    await loadAvatar();
    if (!S.avatar && old) toast('没取到新头像', true);
    paintAvatars();
    /* 弹层里的大图也要跟着换 —— 只换外面三处的话，用户正盯着看的这张没变，
       会以为「点了没反应」。整张弹层重开一次最省事。 */
    openAvSheet();
  });
  var cp = $('#avSheetCopy');
  if (cp) cp.addEventListener('click', function () { copyText(S.server || ''); });
  $('#avSheetClose').addEventListener('click', closeSheet);
}

/* ================= 「我的」页：面板概览 ================= */
/* 数据来自青龙 v2.21+ 的 /api/dashboard/*（back/api/dashboard.ts）。
   **面板真实提供的字段就这些**（对着 tag v2.21.0 的源码逐字核过）：
     系统  platform / uptime(面板进程秒数，不是开机时长) / memTotal / memFree /
           memUsagePercent('37.5' 这种**字符串**) / heapUsed / heapTotal(单位 MB) /
           loadAvg[3] / cpus
     概览  total / enabled / disabled / todayRuns / todaySuccess / todayFail /
           successRate(字符串) / avgTime(毫秒)
     趋势  [{date:'MM-DD', total, success, fail}]，固定补齐 days 天，没跑过的日子是 0
     运行  {runningCount, queuedCount, running[], idleTasks[]}
   面板**没有**磁盘、没有 CPU 使用率百分比、也没有主机名 —— 它自己的「系统资源」卡
   （src/pages/dashboard/index.tsx）就只有内存使用率 / 运行时长 / 堆内存 / 负载 / 核数 /
   platform。所以「主机名」改显示登录用户名，「CPU」那格标的是负载不是使用率，
   磁盘和堆内存直接不做（不编数字）。
   其余全部「有就显示、没有就藏」—— 面板小版本不同字段可能缺，硬取会白屏。 */

/* 秒 → 「3 天 4 小时」/「4 小时 12 分」/「12 分 30 秒」 */
function fmtUptime(sec) {
  /* 先挡一道 null/undefined：Number(null) 是 0，不挡的话「没有数据」会显示成「0 秒」，
     看着像面板刚重启。 */
  if (sec == null || sec === '') return '';
  var s = Number(sec);
  if (!isFinite(s) || s < 0) return '';
  var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  var m = Math.floor((s % 3600) / 60);
  if (d > 0) return d + ' 天 ' + h + ' 小时';
  if (h > 0) return h + ' 小时 ' + m + ' 分';
  if (m > 0) return m + ' 分 ' + Math.floor(s % 60) + ' 秒';
  return Math.floor(s) + ' 秒';
}
/* 字节 → GB/MB。面板给的是 os.totalmem() 的字节数。 */
function fmtBytes(n) {
  var b = Number(n);
  if (!isFinite(b) || b <= 0) return '';
  if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
  return Math.round(b / 1048576) + ' MB';
}
/* 百分比取数字。面板给的是 '37.5' 这种字符串，直接参与运算会变成字符串拼接。 */
function pctNum(v) {
  var n = parseFloat(v);
  if (!isFinite(n)) return null;
  return Math.max(0, Math.min(100, n));
}
/* 占用率分档配色：<70 绿 / <90 橙 / 其余红 */
function meterColor(p) { return p < 70 ? '#34C759' : (p < 90 ? '#FF9500' : '#FF3B30'); }

/* 一张带图标 + 百分比 + 进度条的指标卡（照参考图：左上小图标，右上百分比）。
   必须放在 .ov2 里 —— .ic/.pc 的样式是按 .ov2 作用域写的。 */
function ovMeter(icon, color, label, pct, sub) {
  if (pct == null) return '';
  var p = pct.toFixed(1);
  return '<div class="ovcard">' +
    '<div class="row"><span class="ic" style="background:' + color + '">' + icon + '</span>' +
      '<span class="pc">' + p + '%</span></div>' +
    '<div class="lb">' + esc(label) + '</div>' +
    '<div class="meter"><i style="width:' + p + '%;background:' + meterColor(pct) + '"></i></div>' +
    (sub ? '<div class="lb" style="margin-top:6px">' + esc(sub) + '</div>' : '') +
    '</div>';
}

/* 主机信息卡。
   第一版显示的是面板地址（hostOf(S.server)），用户说改成登录用户名 ——
   用户名就是 S.user，登录之后就一定有，比地址更好认。
   「正在执行 N 个」和「排队 N 个」单独高亮（主色 + 加粗），不跟面板运行时间混在一起。 */
function dashHost() {
  var s = S.dash.sys || {};
  var rt = S.dash.rt || {};
  var meta = [];
  var ver = (S.sys && S.sys.version) || '';
  if (ver) meta.push('青龙 ' + ver);
  if (S.sys && S.sys.branch) meta.push(S.sys.branch);
  if (s.platform) meta.push(s.platform);

  /* 「正在执行 N 个」+「排队 N 个」拼成一段，前后用主色和高亮样式
     —— 跟参考图一致，跟面板运行时间灰色那段区分开。
     1.0.25：整段做成可点的，点了跳到任务页的「运行中」筛选 ——
     看到「有 2 个在跑」之后最自然的下一步就是「到底是哪两个」，
     以前得自己切到底栏再点一次筛选。（排队中 3 在 cronBucket 里也归「运行中」桶，
     所以两个都指向同一个筛选。）
     只有真的有在跑 / 在排队时才做成按钮：0 个的话点了也是空列表，不如不点。 */
  var runN = Number(rt.runningCount);
  if (!isFinite(runN) || runN < 0) runN = 0;
  var queN = Number(rt.queuedCount);
  if (!isFinite(queN) || queN < 0) queN = 0;
  var live = [];
  if (runN) live.push('<span class="live-num">' + esc(runN) + '</span> 个任务正在执行');
  if (queN) live.push('<span class="live-num">' + esc(queN) + '</span> 个排队');

  return '<div class="ovcard ovhost">' +
    '<div class="sp">' +
      '<div class="row" style="gap:7px"><span class="dot"></span>' +
        '<span class="f12 t2">已连接</span></div>' +
      '<div class="big">' + esc(S.user || '未登录') + '</div>' +
      (meta.length ? '<div class="meta">' + esc(meta.join(' · ')) + '</div>' : '') +
      (s.uptime != null ? '<div class="meta">面板已运行 ' + esc(fmtUptime(s.uptime)) + '</div>' : '') +
      (live.length
        ? '<div class="meta live"><button class="livebtn" data-gocrons="running">' +
          live.join(' · ') + ' ›</button></div>'
        : '') +
    '</div>' +
    /* 头像：面板上传过的图优先，没设过才退回首字母。
       未登录时 avChar() 退回一个字形，不是一个空白圆。
       data-viewav 是「点头像弹大图」的钩子 —— 46px 的圆里
       根本看不清面板上传的图是谁，点开才有意义。 */
    '<span class="hav" data-viewav>' + avInner() + '</span>' +
    '</div>';
}

/* 系统状态：内存 + CPU 负载。两个都要有数据才画这一节。
   磁盘/堆内存按用户要求删了 —— 磁盘本来就走 df 兜底，不在这里。 */
function dashSysCards() {
  var s = S.dash.sys || {};
  var out = '';

  var mem = pctNum(s.memUsagePercent);
  if (mem != null) {
    var mt = fmtBytes(s.memTotal);
    var used = (Number(s.memTotal) - Number(s.memFree));
    out += ovMeter('▤', 'linear-gradient(135deg,#5AA9FF,#2E6BFF)', '内存使用率', mem,
      mt ? ('已用 ' + fmtBytes(used) + ' / 共 ' + mt) : '');
  }

  /* 负载：面板只给 loadAvg（1/5/15 分钟）。换算成「相对核数的百分比」只是为了让
     进度条有个长度，标签写「CPU 负载」而不是「CPU 使用率」—— 两者不是一回事，
     真机上别让人误读。 */
  var la = s.loadAvg;
  var cpus = Number(s.cpus);
  if (Array.isArray(la) && la.length && isFinite(cpus) && cpus > 0) {
    var l1 = Number(la[0]);
    if (isFinite(l1)) {
      out += ovMeter('◈', 'linear-gradient(135deg,#4ED8A8,#12A16F)', 'CPU 负载',
        Math.min(100, l1 / cpus * 100), '1 分钟 ' + l1 + ' · ' + cpus + ' 核');
    }
  }
  return out ? '<div class="sec">系统状态</div><div class="ov2">' + out + '</div>' : '';
}

/* 任务概览：总任务 / 已启用 / 今日执行 / 成功率（照参考图的 2×2，这里 4 列一行）。 */
function dashTasks() {
  var o = S.dash.ov;
  if (!o) return '';
  var rate = pctNum(o.successRate);
  /* 「今日失败」是这六格里**唯一一个会让人立刻去干点什么**的数 ——
     前面几格都是「跑得怎么样」，只有它回答「有没有事要管」。
     面板的 overview 一直有 todaySuccess / todayFail，之前只是没画出来。 */
  var fail = Number(o.todayFail);
  if (!isFinite(fail) || fail < 0) fail = null;
  /* 六格三列（原来是四格）。失败 > 0 才标红 —— 0 也标红的话天天红着，
     真出事那天反而看不出区别。 */
  var cells = [
    [o.total == null ? '—' : o.total, '总任务', 0],
    [o.enabled == null ? '—' : o.enabled, '已启用', 0],
    [o.todayRuns == null ? '—' : o.todayRuns, '今日执行', 0],
    [o.todaySuccess == null ? '—' : o.todaySuccess, '今日成功', 0],
    [fail == null ? '—' : fail, '今日失败', fail > 0 ? 1 : 0],
    [rate == null ? '—' : rate.toFixed(1) + '%', '成功率', 0]
  ];
  var h = '<div class="stats">';
  cells.forEach(function (c) {
    h += '<div><div class="n' + (c[2] ? ' bad' : '') + '">' + esc(c[0]) +
      '</div><div class="l">' + esc(c[1]) + '</div></div>';
  });
  h += '</div>';
  return '<div class="sec">任务概览</div><div class="ovcard">' + h + '</div>';
}

/* 趋势图可看的天数。7 天太短 —— 脚本「是不是越来越常失败」在七天里根本看不出来，
   （今天挂一次明天好一次，图上就是两根孤零零的红）；30 天才看得出趋势。
   面板前端自己只给 7 天，但接口 `days` 是通用的，传 30 一样回 30 条。 */
var TREND_DAYS = [7, 30];

/* 切天数。**只重拉趋势那一个接口** —— 系统 / 概览 / 运行时跟天数无关，
   跟着一起重拉纯属多等一次往返（而且会把整页闪一下）。 */
async function setTrendDays(n) {
  n = Number(n);
  var d = S.dash;
  if (TREND_DAYS.indexOf(n) < 0) return;
  if (n === d.trendDays) return;
  d.trendDays = n;
  /* 换区间就取消选中：下标在新区间里指的是另一天了 */
  d.tday = null;
  var r;
  try {
    r = await api('/api/dashboard/trend', { query: { days: n } });
  } catch (e) {
    toast(e.message, true);
    renderHome();
    return;
  }
  d.trend = r.data || null;
  renderHome();
}

/* 点某根柱子：选中它（再点一次取消，回到整个区间的汇总）。 */
function pickTrendDay(i) {
  var d = S.dash;
  d.tday = (d.tday === i) ? null : i;
  renderHome();
}

/* 图下面那行读数：没点柱子时是整个区间的汇总，点了就是那天。
   30 天模式下柱顶那个数字被藏了（一根只有 ~9px 宽塞不下两位数），
   这行是那时候唯一能读出「具体多少次」的地方。 */
function trendReadout(days, sel) {
  var i, n, m, st = 0, so = 0;
  if (sel == null) {
    for (i = 0; i < days.length; i++) {
      n = Number(days[i].total); if (isFinite(n) && n > 0) st += n;
      m = Number(days[i].success); if (isFinite(m) && m > 0) so += m;
    }
    return '近 ' + days.length + ' 天共执行 <b>' + st + '</b> 次 · 成功 <b>' + so +
      '</b> · 失败 <b>' + (st - so) + '</b>（点柱子看某天）';
  }
  var x = days[sel] || {};
  n = Number(x.total); if (!isFinite(n) || n < 0) n = 0;
  m = Number(x.success); if (!isFinite(m) || m < 0) m = 0;
  if (m > n) m = n;
  return esc(x.date || '') + ' 共 <b>' + n + '</b> 次 · 成功 <b>' + m +
    '</b> · 失败 <b>' + (n - m) + '</b>（再点一次看汇总）';
}

/* 近 N 日执行趋势（/api/dashboard/trend?days=N）。
   面板回的是 [{date:'MM-DD', total, success, fail}]，固定补齐 days 天、没跑过的日子是 0。
   **没有数据就整节不画** —— 面板版本老没这个接口时，画一排空柱子只会让人以为
   「这几天一个任务都没跑」。 */
function dashTrend() {
  var d = S.dash;
  var t = d.trend;
  if (!Array.isArray(t)) return '';
  /* 面板偶尔会塞进 null 项，过滤掉，免得渲染出 undefined */
  var days = t.filter(function (x) { return x && typeof x === 'object'; });
  if (!days.length) return '';

  var max = 0;
  days.forEach(function (x) {
    var n = Number(x.total);
    if (isFinite(n) && n > max) max = n;
  });
  if (max <= 0) {
    return '<div class="sec">近 ' + days.length + ' 日任务趋势</div>' +
      '<div class="ovcard"><div class="f12 t3">近 ' + days.length + ' 天没有执行记录</div></div>';
  }

  /* 30 根柱子挤在 358px 里每根只剩 ~9px：柱顶数字和日期标签都得稀疏散，
     不然「30」两个数字会顶到隔壁柱子上、七个日期全糊成一条。
     按**数据条数**判断而不是按 d.trendDays —— 面板补齐规则不一样时也能对。 */
  var dense = days.length > 14;
  var step = dense ? Math.ceil(days.length / 6) : 1;
  var sel = (d.tday == null || d.tday < 0 || d.tday >= days.length) ? null : d.tday;

  var sw = '<span class="tsw">';
  TREND_DAYS.forEach(function (n) {
    sw += '<button data-tdays="' + n + '" class="' + (d.trendDays === n ? 'on' : '') +
      '">' + n + ' 天</button>';
  });
  sw += '</span>';

  var h = '<div class="sec row" style="justify-content:space-between;gap:8px">' +
    '<span>近 ' + days.length + ' 日任务趋势</span>' + sw + '</div>';
  h += '<div class="ovcard"><div class="trend' + (dense ? ' d30' : '') + '">';
  days.forEach(function (x, i) {
    var total = Number(x.total);
    if (!isFinite(total) || total < 0) total = 0;
    var ok = Number(x.success);
    if (!isFinite(ok) || ok < 0) ok = 0;
    if (ok > total) ok = total;
    /* 柱高按区间最大值归一，最小留 4% —— 总数为 1 的那天也要看得见一根 */
    var hp = total > 0 ? Math.max(4, Math.round(total / max * 100)) : 0;
    var op = total > 0 ? (ok / total * 100) : 0;
    /* 日期标签：密集时只标每 step 个 + 最后一个，其余留空占位（高度还在，不会跳） */
    var lab = (!dense || i % step === 0 || i === days.length - 1) ? (x.date || '') : '';
    h += '<button class="tb' + (sel === i ? ' on' : '') + '" data-tday="' + i + '">' +
      '<div class="tv">' + esc(total) + '</div>' +
      '<div class="tbar"><i style="height:' + hp + '%">' +
        '<b style="height:' + op.toFixed(1) + '%"></b></i></div>' +
      '<div class="td">' + esc(lab) + '</div>' +
      '</button>';
  });
  h += '</div><div class="tlg">' +
    '<span><span class="d" style="background:var(--green)"></span>成功</span>' +
    '<span><span class="d" style="background:var(--red)"></span>失败</span>' +
    '</div><div class="tread">' + trendReadout(days, sel) + '</div></div>';
  return h;
}

/* 概览区。加载中只盖住这一块，下面的功能网格立刻就能用。 */
function dashCards() {
  var d = S.dash;
  if (d.loading && !d.sys && !d.ov) {
    return '<div class="center"><span class="spin"></span>读取面板状态…</div>';
  }
  var h = '';
  if (d.sys || d.rt) h += '<div class="sec">面板</div>' + dashHost();
  h += dashSysCards();
  h += dashTasks();
  if (d.err) {
    h += '<div class="f11 t3" style="margin:12px 4px;line-height:1.6">' + esc(d.err) + '</div>';
  }
  return h;
}

/* 渲染整页。功能网格是静态的，跟网络无关 —— 必须**同步**渲染出来，
   否则进页面先是一片空白（测试里也读不到卡片）。 */
function renderDash() {
  $('#sub').textContent = '';
  /* 「切换账号」胶囊渲染进顶栏的槽（在大标题上方），不在 #main 里 */
  /* 头像同上：有面板头像就出图，没有才用首字母。 */
  $('#acctBar').innerHTML = '<button class="acct" id="btnAcct">' +
    '<span class="av">' + avInner() + '</span>' +
    '<span class="un ell">' + esc(S.user) + '</span>' +
    '<span class="sw">切换账号</span></button>';
  bindAvImgs();

  /* 概览**不在这里** —— 它搬到「主页」了（renderHome）。这页只留功能网格，
     这样即使统计接口全挂，功能入口也是同步渲染出来的、立刻能点。 */
  var h = '<div class="sec">功能</div>';
  h += '<div class="fgrid">';
  FEATURES.forEach(function (f) { h += featCard(f); });
  h += '</div>';
  h += '<div class="f11 t3" style="margin:14px 4px 0;line-height:1.6">共 ' + FEATURES.length +
    ' 个功能模块。登录状态和凭据只存在本机（' + (NS ? 'App 私有存储' : '浏览器 localStorage') +
    '），不会上传到任何第三方。</div>';
  $('#meBody').innerHTML = h;
}

/* 主页：面板 / 系统状态 / 任务概况 / 近 7 日趋势。
   和「我的」页各渲染各的 —— 概览要等网络，功能网格不能跟着一起等。 */
function renderHome() {
  var el = $('#homeBody');
  if (!el) return;
  el.innerHTML = dashCards() + dashTrend();
  /* 主机卡里的头像是 innerHTML 塞进去的 <img>，得重新挂一次 error 兜底 */
  bindAvImgs();
}

async function loadDash() {
  var d = S.dash;
  /* 已经有一轮在飞：只重画一遍（可能刚切回来，DOM 被清过），不重复打接口。
     **不能在这里直接 return** —— 那样切回来会看到空白页。 */
  if (d.loading) { renderDash(); renderHome(); return; }
  d.loading = true;
  d.err = '';
  d.seq = (d.seq || 0) + 1;
  var seq = d.seq;
  renderDash();
  renderHome();

  /* 四个接口各自 catch：面板小版本不同，可能只装了其中一部分，
     一个 404 不该把整页拖成空白（趋势没有就整节不画）。 */
  var one = function (p, q) {
    return api(p, q ? { query: q } : undefined)
      .then(function (r) { return r.data; })
      .catch(function () { return null; });
  };
  var rs = await Promise.all([
    one('/api/dashboard/system'),
    one('/api/dashboard/overview'),
    one('/api/dashboard/runtime'),
    one('/api/dashboard/trend', { days: d.trendDays || 7 })
  ]);
  /* 期间用户又点了一次刷新：这次的结果已经过期，丢掉，别把新数据覆盖回去 */
  if (seq !== d.seq) return;
  d.sys = rs[0]; d.ov = rs[1]; d.rt = rs[2]; d.trend = rs[3];
  /* 刷新后原来选中的那天下标可能已经越界（区间换了 / 数据少了），直接清掉 */
  d.tday = null;
  d.loading = false;
  if (!rs[0] && !rs[1]) {
    d.err = '这个面板没有统计接口（需要青龙 v2.21 及以上）。功能模块不受影响。';
  }
  renderDash();
  renderHome();
}

/* 磁盘 + 堆内存已按用户要求移除（跑 df 的兜底命令、解析函数一并撤了）。
   执行趋势后来又要回来了 —— 现在在主页，见 dashTrend()。 */

/* 切换账号：账号级的东西都收在这里（地址 / 重新登录 / 退出登录）。
   原来这些直接摊在「我的」页上，占了整整一屏；收进弹层后页面才腾得出位置放功能网格。 */
function openAccount() {
  var h = '';
  h += '<div class="secttl" style="margin-top:0">当前账号</div><div class="card">';
  h += kv('用户名', S.user || '未知');
  h += kv('接口地址', base());
  h += '</div>';

  /* 登录过的账号在同一个列表里（系统设置 → 账号 进的是同一个弹层）。
     只有一个账号时不显示，免得白占一行。 */
  var accts = acctList();
  if (accts.length > 1) {
    h += '<div style="margin-top:12px">' +
      '<button class="btn" id="btnAccts" style="width:100%">切换账号（已记 ' + accts.length + ' 个）</button>' +
      '</div>';
  }

  h += '<div class="secttl">服务器地址</div>';
  h += '<div class="card" style="padding:4px 14px"><div style="padding:9px 0">' +
    '<input id="meServer" autocapitalize="off" autocorrect="off" spellcheck="false" value="' +
    esc(S.server) + '"></div></div>';
  h += '<div class="f12 t3" style="margin:8px 4px">改完点下面的按钮保存，会退出登录（令牌是按面板签发的）。</div>';
  h += '<button class="btn" id="btnSaveServer" style="width:100%">保存地址并重新登录</button>';

  h += '<div style="margin-top:18px">' +
    '<button class="btn danger" id="btnLogout" style="width:100%">退出登录</button></div>';
  openSheet('切换账号', h);
}

/* 系统设置：面板信息 / 连接诊断 / 关于。 */
function openSettings() {
  var h = '';
  h += '<div class="secttl" style="margin-top:0">面板</div><div class="card">';
  h += kv('版本', (S.sys && S.sys.version) || '未知');
  h += kv('分支', (S.sys && S.sys.branch) || '未知');
  h += '</div>';

  /* 面板网页版「系统设置」里那几个页签（应用设置 / 其他设置 / 登录日志 / 面板日志），
     1.0.14 之前在这里也放了一份入口，1.0.15 撤掉了 —— 用户反馈「没法用」。
     真因在下面 data-goto 那条分支：它切页前没关弹层，页面在弹层后面换了、用户看不见
     （已修）。不过即便修好，也没必要留两份入口 —— 这四项在「我的」页的功能网格里
     各有一张卡片，从那儿进没有弹层挡着，路径更短。
     四套代码（loadApps / loadSysconf / loadLoginLog / loadSysLog）都还在，
     只是入口收敛到「我的」页一处。 */

  /* 账号：登录过的账号都在这儿，点一下就切过去。
     跟「我的」页顶部的「切换账号」胶囊进的是同一个弹层。 */
  var accts = acctList();
  h += '<div class="secttl">账号</div>';
  h += '<div class="card" style="padding:0">' +
    '<button class="kvrow" id="btnAccts">' +
        '<span class="k">切换账号</span>' +
        '<span class="v">' + esc(S.user || '未登录') +
          (accts.length > 1 ? ' · 共 ' + accts.length + ' 个' : '') + ' ›</span>' +
      '</button>' +
    '</div>';
  h += '<div class="f11 t3" style="margin:8px 4px;line-height:1.6">' +
    '登录过的账号会自动记下来，下次点一下就切过去，不用重新输密码。</div>';

  /* 外观 / 字体：跟在系统里看到的「显示」类设置一样。点整条打开选项弹层。
     当前值显示在右边（onAction），让人一眼看出现在是什么档。 */
  h += '<div class="secttl">显示</div>';
  h += '<div class="card" style="padding:0">' +
    '<button class="kvrow" id="btnTheme">' +
        '<span class="k">外观模式</span>' +
        '<span class="v">' + esc(themeLabel(S.theme)) + ' ›</span>' +
      '</button>' +
    '<button class="kvrow" id="btnFs">' +
        '<span class="k">字体大小</span>' +
        '<span class="v">' + esc(fsLabel(S.fs)) + ' ›</span>' +
      '</button>' +
    '</div>';
  h += '<div class="f11 t3" style="margin:8px 4px;line-height:1.6">' +
    '外观模式：跟随系统 = 用手机当前的深浅色模式；浅色 / 深色 强制指定。<br>' +
    '字体大小：只改文字大小，图标和间距不变。</div>';

  h += '<div class="secttl">排查</div>';
  h += '<button class="btn" id="btnDiag" style="width:100%">连接诊断</button>';
  h += '<div class="f11 t3" style="margin:8px 4px;line-height:1.6">连不上面板时点这个，' +
    '会测出问题卡在哪一层，并给出具体原因。</div>';

  h += '<div class="secttl">关于</div><div class="card">';
  h += kv('客户端', nativeLabel() + APP_VER);
  h += kv('适配面板', '青龙 v2.21.x');
  h += '</div>';
  h += '<div class="f11 t3" style="margin:10px 4px;line-height:1.6">' +
    '面板走明文 http 时，密码与令牌会以明文经过网络，建议配置 HTTPS。</div>';
  openSheet('系统设置', h);
}

/* 账号切换弹层：列出登录过的账号，点一条直接切过去（不用重新输密码）。
   系统设置里的「切换账号」和「我的」页顶部那个胶囊都进这里。 */
function openAccounts() {
  var list = acctList();
  var h = '';
  if (!list.length) {
    h += '<div class="empty" style="padding:26px 0"><span class="ei">◍</span>还没有登录记录</div>';
  } else {
    h += '<div class="secttl" style="margin-top:0">登录过的账号</div><div class="card" style="padding:0">';
    list.forEach(function (a, i) {
      var cur = acctIsCurrent(a);
      h += '<div class="kvrow" style="padding:0;gap:0">' +
        '<button class="acctsw" data-acct="' + i + '">' +
          '<span class="anm ell">' + esc(a.u) +
            (cur ? ' <span class="tag">当前</span>' : '') + '</span>' +
          /* 第二行：面板地址 + 最后登录时间。时间才是「历史记录」的意义所在 ——
             光有一串账号，看不出哪个是刚用过的。 */
          '<span class="f11 t3 ell">' + esc(hostOf(a.s) || a.s || '') +
            (a.t ? ' · ' + esc(fmtRel(a.t)) : '') + '</span>' +
        '</button>' +
        (cur ? '<span class="ck2">✓</span>'
             : '<button class="acctdel" data-acctdel="' + i + '" title="删除">✕</button>') +
      '</div>';
    });
    h += '</div>';
  }
  h += '<div class="f11 t3" style="margin:10px 4px;line-height:1.6">' +
    '点一个账号就直接切过去，不用重新输密码。密码只存在这台手机上。</div>';
  openSheet('切换账号', h);
}

/* 外观三档的中文文案 */
function themeLabel(t) {

}

/* 外观选择弹层：照参考图是三个圆角条目，当前选中高亮 */
function openTheme() {

function setTheme(t) {

/* ================= 应用设置（面板的开放接口应用） =================
   对应面板网页版「系统设置 → 应用设置」。这一页管的是**开放接口**的凭据：
   每个应用有自己的 client_id / client_secret 和一组权限，外部程序拿它换 token 调面板。
   跟你在 App 里登录用的账号密码完全是两回事 —— 别把它们搞混。

   面板内部那个名为 system 的应用不会出现在列表里（后端 list() 里过滤掉了），
   所以这里不用特判。

   接口（v2.21，见 back/api/open.ts）：
     GET    /api/apps                     → { code, data: [App] }
     POST   /api/apps    { name, scopes } → 新建，返回带新 client_id/secret 的 App
     PUT    /api/apps    { id, name, scopes }
     DELETE /api/apps    [id]             ← body 是 **id 数组**，不是对象
     PUT    /api/apps/{id}/reset-secret   → 换一对新的 secret（顺带清掉旧 token）
   App = { id, name, client_id, client_secret, scopes: string[], tokens: [] } */

/* 权限枚举。**值必须和面板一字不差** —— 后端就是按这些字符串鉴权的，
   拼错了等于给了一个用不了的权限，而且不会有任何报错，只会在用的时候 403。
   顺序照面板 src/utils/config.ts 里的 scopes。 */
var APP_SCOPES = [
  ['crons', '定时任务'], ['envs', '环境变量'], ['subscriptions', '订阅管理'],
  ['configs', '配置文件'], ['scripts', '脚本管理'], ['logs', '日志管理'],
  ['dependencies', '依赖管理'], ['system', '系统信息']
];
var APP_SCOPE_NAME = {};
APP_SCOPES.forEach(function (x) { APP_SCOPE_NAME[x[0]] = x[1]; });

/* 面板把 'system' 这个名字留给内部应用，新建时用它会直接被 Joi 挡回来。 */
var APP_RESERVED = 'system';

async function loadApps(force) {
  var a = S.apps;
  if (a.loading) return;
  if (a.list.length && !force) { renderApps(); return; }
  a.loading = true;
  a.err = '';
  renderApps();
  try {
    var r = await api('/api/apps');
    a.list = (r.data && r.data.length !== undefined) ? r.data : [];
  } catch (e) {
    a.err = e.message;
    a.list = [];
  }
  a.loading = false;
  renderApps();
}

function findApp(id) {
  for (var i = 0; i < S.apps.list.length; i++) {
    if (Number(S.apps.list[i].id) === Number(id)) return S.apps.list[i];
  }
  return null;
}

function appScopeTags(scopes) {
  var arr = Object.prototype.toString.call(scopes) === '[object Array]' ? scopes : [];
  if (!arr.length) return '<span class="f11 t3">没有授权任何模块</span>';
  return arr.map(function (s) {
    /* 认不出的值也照原样显示：面板以后加了新权限，至少能看到是什么，
       而不是被悄悄吞掉、以为这个应用没权限。 */
    return '<span class="tag">' + esc(APP_SCOPE_NAME[s] || s) + '</span>';
  }).join('');
}

function renderApps() {
  var box = $('#appList');
  if (!box) return;
  var a = S.apps;
  /* 顶栏副标题跟别的页签一样报个数。不设的话会留着上一页的「共 N 个变量」，
     看起来像数据串了。 */
  $('#sub').textContent = a.list.length ? (a.list.length + ' 个应用') : '';
  if (a.loading && !a.list.length) {
    box.innerHTML = '<div class="center"><span class="spin"></span>读取应用…</div>';
    return;
  }
  if (a.err) {
    box.innerHTML = '<div class="empty"><span class="ei">!</span>' + esc(a.err) +
      '<div style="margin-top:16px"><button class="btn" id="btnAppRetry" style="padding:8px 22px">重试</button></div></div>';
    return;
  }
  if (!a.list.length) {
    box.innerHTML = '<div class="empty"><span class="ei">⚿</span>还没有开放接口应用' +
      '<div class="f11 t3" style="margin-top:10px;line-height:1.7">' +
      '应用是给外部程序用的（自己写的脚本、别的客户端等），<br>' +
      '拿 Client ID / Secret 换 token 来调面板。<br>' +
      '和你在这里登录用的账号密码不是一回事。</div></div>';
    return;
  }
  box.innerHTML = a.list.map(function (x) {
    var cid = String(x.client_id || '');
    var csec = String(x.client_secret || '');
    return '<div class="item">' +
      '<div class="row"><div class="nm sp ell">' + esc(x.name || '(未命名)') + '</div></div>' +
      '<div class="cred"><span class="cl">Client ID</span>' +
        '<span class="cv ell">' + esc(cid) + '</span>' +
        '<button class="cpb" data-copy="' + esc(cid) + '">复制</button></div>' +
      '<div class="cred"><span class="cl">Client Secret</span>' +
        '<span class="cv ell" data-secret="' + esc(csec) + '">••••••••••</span>' +
        '<button class="cpb" data-reveal="1">显示</button>' +
        '<button class="cpb" data-copy="' + esc(csec) + '">复制</button></div>' +
      '<div class="tags">' + appScopeTags(x.scopes) + '</div>' +
      '<div class="row" style="gap:8px;margin-top:11px">' +
        '<button class="btn" style="flex:1;padding:8px" data-appedit="' + esc(x.id) + '">编辑</button>' +
        '<button class="btn" style="flex:1;padding:8px" data-appsecret="' + esc(x.id) + '">换密钥</button>' +
        '<button class="btn danger" style="flex:1;padding:8px" data-appdel="' + esc(x.id) + '">删除</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* 编辑 / 新建应用。id 为空表示新建。
   权限用一排可点的标签做多选 —— 手机上原生多选控件不好用，
   而且八个权限一眼就能看全，比下拉框少一次点击。 */

/* 当前正在编辑的应用 id（null = 新建）。
   存成模块变量而不是塞进 DOM：从列表点进来时 id 是字符串，
   而「新建」时如果写成 data-appid="" 再读出来是空串 —— `'' != null` 为真，
   会被 saveApp 当成编辑，于是 PUT 一个不存在的 id。 */
var editingAppId = null;

function openAppEdit(id) {
  editingAppId = (id == null || id === '') ? null : Number(id);
  var app = editingAppId == null ? null : findApp(editingAppId);
  if (editingAppId != null && !app) { toast('这个应用已经不在了，刷新一下', true); return; }
  var cur = app ? (Object.prototype.toString.call(app.scopes) === '[object Array]' ? app.scopes : []) : [];
  var h = '';
  h += '<div class="secttl" style="margin-top:0">名称</div>';
  h += '<div class="card" style="padding:4px 14px"><div style="padding:9px 0">' +
    '<input id="appName" placeholder="例如：我的脚本" autocapitalize="off" autocorrect="off" spellcheck="false" value="' +
    esc(app ? (app.name || '') : '') + '"></div></div>';
  h += '<div class="secttl">权限</div>';
  h += '<div class="scopegrid">';
  APP_SCOPES.forEach(function (x) {
    var on = cur.indexOf(x[0]) >= 0;
    h += '<button class="scopebtn' + (on ? ' on' : '') + '" data-scope="' + x[0] + '">' +
      esc(x[1]) + '</button>';
  });
  h += '</div>';
  h += '<div class="f11 t3" style="margin:10px 4px;line-height:1.7">' +
    '勾上的模块才允许这个应用访问。至少要选一个 —— 一个权限都不给的话，<br>' +
    '换来的 token 什么都干不了。</div>';
  h += '<button class="btn" id="btnAppSave" style="width:100%">' +
    (app ? '保存修改' : '创建应用') + '</button>';
  if (app) {
    h += '<div class="f11 t3" style="margin:10px 4px;line-height:1.7">' +
      'Client ID 和 Secret 在创建时就定好了，这里改不了。<br>' +
      '想换密钥回上一页点「换密钥」。</div>';
  }
  openSheet(app ? '编辑应用' : '新建应用', h);
}

/* 把弹层里勾选的权限收集起来。没勾任何一项返回空数组 —— 调用方要挡住。 */
function appScopesPicked() {
  return $$('#shB .scopebtn.on').map(function (b) { return b.dataset.scope; });
}

async function saveApp(id) {
  var name = ($('#appName') ? $('#appName').value : '').trim();
  var scopes = appScopesPicked();
  if (!scopes.length) { toast('至少要选一个权限', true); return; }
  /* 后端 Joi 里 disallow('system')，本地先挡一道，省一次来回。 */
  if (name.toLowerCase() === APP_RESERVED) { toast('「' + APP_RESERVED + '」是面板保留名，换一个', true); return; }
  var body = { name: name, scopes: scopes };
  var url = '/api/apps';
  var method = 'POST';
  if (id != null) { body.id = Number(id); method = 'PUT'; }
  try {
    await api(url, { method: method, body: body });
    closeSheet();
    toast(id != null ? '已保存' : '已创建');
    await loadApps(true);
  } catch (e) {
    toast(e.message, true);
  }
}

/* 删除是**真删**，面板不会留备份，token 一起没。
   而且被删应用正在跑的外部程序会立刻全部 401。 */
async function deleteApp(id) {
  var app = findApp(id);
  var nm = app ? (app.name || '(未命名)') : String(id);
  if (!confirm('删除应用「' + nm + '」？\n\n这个应用的 Client ID / Secret 会立刻失效，' +
    '正在用它的程序会全部认证失败。删了不能恢复。')) return;
  try {
    /* body 是 id 数组，不是 { id }。写成对象后端会 400。 */
    await api('/api/apps', { method: 'DELETE', body: [Number(id)] });
    toast('已删除');
    await loadApps(true);
  } catch (e) {
    toast(e.message, true);
  }
}

/* 换完密钥直接把新值摆出来让人复制 —— 这是唯一一次「主动给」的机会，
   之后就只能回列表里点「显示」了。 */
var lastNewSecret = '';
async function resetAppSecret(id) {
  var app = findApp(id);
  var nm = app ? (app.name || '(未命名)') : String(id);
  if (!confirm('给「' + nm + '」换一对新密钥？\n\n' +
    '旧的 Client Secret 和它换出来的所有 token 会立刻失效，' +
    '正在用它的程序需要改成新密钥。')) return;
  try {
    var r = await api('/api/apps/' + Number(id) + '/reset-secret', { method: 'PUT' });
    lastNewSecret = (r.data && r.data.client_secret) ? String(r.data.client_secret) : '';
    await loadApps(true);
    openSheet('新密钥',
      '<div class="secttl" style="margin-top:0">Client Secret</div>' +
      '<div class="card"><div class="cv2" id="newSecTxt">' + esc(lastNewSecret) + '</div></div>' +
      '<button class="btn" id="btnCopyNewSec" style="width:100%;margin-top:14px">复制</button>' +
      '<div class="f11 t3" style="margin:10px 4px;line-height:1.7">' +
      '旧密钥已经失效了，记得把用到它的地方一起改掉。<br>' +
      '之后想再看这串，回列表点「显示」就行。</div>');
  } catch (e) {
    toast(e.message, true);
  }
}

/* Client Secret 的显示 / 隐藏。默认打码，跟面板网页版一致。
   明文放在 data-secret 属性里（不在可见文本里），点「显示」才写进 textContent，
   藏回去时清掉 —— 这样随手截图或者被人扫一眼屏幕，都不会漏密钥。
   不重画整张列表：重画会让滚动位置跳回顶部。 */
function toggleAppSecret(btn) {
  var row = btn.closest ? btn.closest('.cred') : null;
  var cv = row ? row.querySelector('.cv') : null;
  if (!cv) return;
  if (btn.dataset.on === '1') {
    cv.textContent = '••••••••••';
    btn.textContent = '显示';
    btn.dataset.on = '';
  } else {
    cv.textContent = cv.dataset.secret || '';
    btn.textContent = '隐藏';
    btn.dataset.on = '1';
  }
}

/* ================= 其他设置 =================
   对应面板「系统设置 → 其他设置」。面板网页版是「一个输入框 + 一个确认按钮」，
   这里照抄 —— 不做「改完自动保存」，因为这些都是会影响面板运行的开关，
   误触的代价比多点一次大。

   接口（v2.21，见 back/api/system.ts）：
     GET  /api/system/config                       → data.info 里是全套配置
     PUT  /api/system/config/panel-title           { panelTitle }        ≤100 字
     PUT  /api/system/config/log-remove-frequency  { logRemoveFrequency }
     PUT  /api/system/config/cron-concurrency      { cronConcurrency }
     PUT  /api/system/config/timezone              { timezone }
     PUT  /api/system/config/global-ssh-key        { globalSshKey }
     PUT  /api/system/config/lang                  { lang }   ''=跟随系统 / zh / en
     PUT  /api/system/data/export                  { type: [] } → tgz 字节流
     PUT  /api/system/data/import                  multipart 字段 data
     PUT  /api/system/data  （在 /api/update 下）  还原之后真正生效
     PUT  /api/system/update-check                 检查更新
     PUT  /api/update/reload                       重新启动面板

   注意两个容易踩的点：
   1. 配置全在 **data.info** 里，不是 data 本身。读 data.panelTitle 会永远是 undefined。
   2. 备份是 PUT + 二进制流，不能走 api()（它只认 {code,data} 的 JSON）。 */

/* 备份可选模块。'base' 是面板的基础数据（db + upload），恒选中且不可取消 ——
   面板网页版里这一项也是 disabled 的。后端 exportData() 里 base 不当作目录，
   它对应的是 db 和 upload 两个固定目录。 */
var BACKUP_MODULES = [
  ['base', '基础数据', 1], ['config', '配置文件'], ['scripts', '脚本文件'],
  ['log', '日志文件'], ['deps', '依赖文件'], ['syslog', '系统日志'],
  ['dep_cache', '依赖缓存'], ['raw', '远程脚本缓存'], ['repo', '远程仓库缓存'],
  ['ssh.d', 'SSH 文件缓存']
];

/* 语言只有三个值：空串 = 跟随系统。后端拿它去写 lang_env.sh。 */
var LANG_OPTIONS = [['', '跟随系统'], ['zh', '简体中文'], ['en', 'English']];

/* 常用时区。面板网页版是一长串，这里给常用的；不在表里的值也会被原样带出来
   （见 tzOptions），不会因为选项里没有就把面板上的值改掉。 */
var TZ_COMMON = [
  'Asia/Shanghai', 'Asia/Hong_Kong', 'Asia/Taipei', 'Asia/Tokyo', 'Asia/Seoul',
  'Asia/Singapore', 'Asia/Bangkok', 'Asia/Kolkata', 'Asia/Dubai',
  'Europe/London', 'Europe/Paris', 'Europe/Berlin', 'Europe/Moscow',
  'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
  'America/Sao_Paulo', 'Australia/Sydney', 'Pacific/Auckland', 'UTC'
];

async function loadSysconf(force) {
  var c = S.sysconf;
  if (c.loading) return;
  if (c.cfg && !force) { renderSysconf(); return; }
  c.loading = true;
  c.err = '';
  renderSysconf();
  try {
    var r = await api('/api/system/config');
    /* 配置在 data.info 里。面板自己的前端也是读 data.info 的。 */
    c.cfg = (r.data && r.data.info) ? r.data.info : (r.data || null);
    if (!c.cfg) throw new Error('面板没有返回配置内容');
  } catch (e) {
    c.err = e.message;
    c.cfg = null;
  }
  c.loading = false;
  renderSysconf();
}

/* 时区下拉的选项：常用表 + 当前值（防止面板上是表外的值时被下拉框吞掉）。 */
function tzOptions(cur) {
  var list = TZ_COMMON.slice();
  if (cur && list.indexOf(cur) < 0) list.unshift(cur);

}

    '<button class="btn fldbtn" data-scsave="log-remove-frequency">确认</button>' +

      }).join('') + '</select></div>' +

  h += '<div class="f11 t3" style="margin:8px 4px;line-height:1.7">' +

  h += '<div class="secttl">全局 SSH 密钥</div>';

  h += '<div class="card" style="padding:4px 14px">' +

  h += '<div class="f11 t3" style="margin:8px 4px;line-height:1.7">' +

  h += '<div class="secttl">语言</div>';
  h += '<div class="card" style="padding:0">' +
    '<div class="kvrow" style="padding:11px 14px"><span class="k" style="flex:0 0 60px">界面语言</span>' +
    '<select id="scLang" style="flex:1;text-align:right">' + LANG_OPTIONS.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + ((g.lang || '') === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('') + '</select></div>' +
  '</div>';
  h += '<div class="f11 t3" style="margin:8px 4px;line-height:1.7">' +
    '改的是**面板自己**的界面语言（网页版和通知里的文案），不影响这个 App。<br>' +
    '「跟随系统」= 跟浏览器/系统的语言走。</div>';

  h += '<div class="secttl">数据备份还原</div>';
  h += '<div class="card">' +
    '<div class="fl" style="margin-bottom:8px">备份内容</div>' +
    '<div class="modgrid">' + BACKUP_MODULES.map(function (m) {
      var on = m[2] ? 1 : (c.mods[m[0]] ? 1 : 0);
      return '<button class="modbtn' + (on ? ' on' : '') + (m[2] ? ' fixed' : '') +
        '" data-scmod="' + esc(m[0]) + '">' + esc(m[1]) + '</button>';
    }).join('') + '</div>' +
    '<button class="btn" id="btnScExport" style="width:100%;margin-top:12px">备份</button>' +
    '<button class="btn" id="btnScImport" style="width:100%;margin-top:8px">还原数据</button>' +
  '</div>';
  h += '<div class="f11 t3" style="margin:8px 4px;line-height:1.7">' +
    '备份会下载一个 data.tgz 到手机（基础数据必选，里面是数据库和上传目录）。<br>' +
    '还原是**覆盖式**的：选一个 tgz 传上去，面板会用里面的数据盖掉现在的，<br>' +
    '之后面板会自动重启。这一步做之前建议先备份一份。</div>';

  h += '<div class="secttl">检查更新</div>';
  h += '<div class="card">' +
    '<div class="f11 t3" style="line-height:1.7">当前版本 ' +
      esc((S.sys && S.sys.version) || '未知') + ' · ' + esc((S.sys && S.sys.branch) || '未知') + '</div>' +
    '<div class="row" style="gap:8px;margin-top:10px">' +
      '<button class="btn" id="btnScCheck" style="flex:1">检查更新</button>' +
      '<button class="btn danger" id="btnScReload" style="flex:1">重新启动</button>' +
    '</div>' +
  '</div>';
  h += '<div class="f11 t3" style="margin:8px 4px 20px;line-height:1.7">' +
    '「重新启动」会重启整个面板，期间几十秒连不上（正在跑的任务会被打断）。<br>' +
    '只检查不安装：要装新版得去面板网页版点更新。</div>';

  box.innerHTML = h;
}

/* 保存「其他设置」里的一个字段。
   path 是接口路径尾段，field 是请求体里的字段名 —— 两者**不一样**
   （比如 panel-title / panelTitle），混用会被 Joi 挡回来。 */
async function saveSysconfField(path, field, value, okMsg) {
  var body = {};
  body[field] = value;
  try {
    await api('/api/system/config/' + path, { method: 'PUT', body: body });
    toast(okMsg || '已保存');
    await loadSysconf(true);
  } catch (e) {
    toast(e.message, true);
  }
}

/* 从当前 DOM 里读某个字段并保存。返回 false 表示校验没过。 */
async function saveSysconfFromDom(path) {
  var c = S.sysconf;
  var cur = c.cfg || {};
  if (path === 'panel-title') {
    var t = ($('#scTitle') ? $('#scTitle').value : '').trim();
    if (t.length > 100) { toast('标题最多 100 个字', true); return; }
    return saveSysconfField(path, 'panelTitle', t, t ? '标题已改' : '已恢复默认标题');
  }
  if (path === 'log-remove-frequency') {
    return saveSysconfField(path, 'logRemoveFrequency', numOrNull($('#scLogFreq')), '日志删除频率已改');
  }
  if (path === 'cron-concurrency') {
    return saveSysconfField(path, 'cronConcurrency', numOrNull($('#scConcur')), '并发数已改');
  }
  if (path === 'timezone') {
    var tz = $('#scTz') ? $('#scTz').value : '';
    if (!tz) { toast('请选一个时区', true); return; }
    return saveSysconfField(path, 'timezone', tz, '时区已改');
  }
  if (path === 'global-ssh-key') {
    var k = ($('#scSsh') ? $('#scSsh').value : '').trim();
    /* 这里不做「像不像私钥」的校验：格式花样太多（RSA / ed25519 / 带注释），
       本地猜错了会把正确的东西挡在外面。面板认不认由它说了算。 */
    if (k && !confirm('要覆盖面板上的全局 SSH 密钥？' + (cur.globalSshKey ? '' : '\n\n原来没有设置过。'))) return;
    return saveSysconfField(path, 'globalSshKey', k, k ? '密钥已保存' : '密钥已清空');
  }
}

/* 输入框里的数字：空串和 NaN 都算「不限制」，对应后端的 null。 */
function numOrNull(el) {
  if (!el) return null;
  var v = String(el.value == null ? '' : el.value).trim();
  if (!v) return null;
  var n = Number(v);
  return isNaN(n) ? null : n;
}

function sysconfMods() {
  var out = ['base'];
  BACKUP_MODULES.forEach(function (m) {
    if (!m[2] && S.sysconf.mods[m[0]]) out.push(m[0]);
  });
  return out;
}

/* 备份模块的勾选。只改按钮的 class，不重画整个「其他设置」——
   重画会把上面几个输入框里还没点「确认」的内容一起冲掉。 */
function toggleBackupMod(btn) {
  var k = btn.dataset.scmod;
  /* 「基础数据」固定选中：后端 exportData() 里 base 对应 db + upload，
     取消掉等于备份了个空壳。面板网页版这项也是 disabled 的。 */
  if (btn.classList.contains('fixed')) { toast('「基础数据」是必选的，取消不了'); return; }
  var on = !S.sysconf.mods[k];
  S.sysconf.mods[k] = on ? 1 : 0;
  btn.classList.toggle('on', on);
}

async function exportBackup() {
  toast('正在打包，数据多的话要等一会儿…');
  try {
    /* 备份是 PUT + 二进制流：api() 只认 {code,data} 的 JSON，用不了。 */
    var blob = await apiBlob('/api/system/data/export', { type: sysconfMods() }, 'PUT');
    await saveBlobToDevice('data.tgz', blob);
  } catch (e) {
    toast(e.message, true);
  }
}

/* 还原：两步。先把 tgz 传上去解包，再调一次 reload 让面板真正用新数据起来。
   第二步不能省 —— 只上传的话文件躺在临时目录里，面板还是用旧的。 */
async function importBackup(file) {
  if (!file) return;
  if (!confirm('用「' + file.name + '」覆盖面板现在的数据？\n\n' +
    '面板上的任务、变量、脚本、配置都会变成备份里的样子，现在的会被盖掉。\n' +
    '还原后面板会自动重启，几十秒内连不上。')) return;
  toast('上传中…');
  try {
    var fd = new FormData();
    fd.append('data', file, 'data.tgz');
    await api('/api/system/data/import', { method: 'PUT', form: fd });
    toast('已上传，正在让面板重启…');
    /* 面板会自己退出重启，这个请求很可能等不到正常响应 —— 失败也算成功，
       因为真正的信号是「面板连不上了，然后又连上了」。 */
    try { await api('/api/update/data', { method: 'PUT' }); } catch (e) { /* 预期之内 */ }
    toast('已提交还原，面板重启中，稍后重新登录');
  } catch (e) {
    toast(e.message, true);
  }
}

async function checkPanelUpdate() {
  toast('检查中…');
  try {
    var r = await api('/api/system/update-check', { method: 'PUT' });
    var d = r.data || {};
    if (d.hasNewVersion) {
      /* 这里**不能**用 window.open 跳去面板网页版：壳里的 WKUIDelegate 把
         targetFrame == nil 的请求当成「在当前页打开」，一按 App 页面就被导航走了，
         而且没有返回入口（只能杀进程重开）。所以改成把地址摆出来让人自己复制。 */
      openSheet('有新版本',
        '<div class="secttl" style="margin-top:0">版本</div>' +
        '<div class="card">' +
          kv('当前', (S.sys && S.sys.version) || '未知') +
          kv('最新', d.lastVersion || '未知') +
        '</div>' +
        '<div class="secttl">面板地址</div>' +
        '<div class="card"><div class="cv2">' + esc(base()) + '</div></div>' +
        '<button class="btn" data-copy="' + esc(base()) + '" style="width:100%;margin-top:14px">复制面板地址</button>' +
        '<div class="f11 t3" style="margin:10px 4px;line-height:1.7">' +
        '装新版得去面板网页版点更新 —— 这个 App 只能帮你查，装不了。<br>' +
        '复制地址，用手机浏览器打开就能装。</div>');
    } else {
      toast('已是最新版' + (d.lastVersion ? '（' + d.lastVersion + '）' : ''));
    }
  } catch (e) {
    toast(e.message, true);
  }
}

async function reloadPanel() {
  if (!confirm('重新启动面板？\n\n所有正在跑的任务会被打断，重启期间（几十秒）面板连不上。')) return;
  try {
    await api('/api/update/reload', { method: 'PUT' });
    toast('面板重启中，稍后重新登录');
  } catch (e) {
    /* 面板是**自己退出**来重启的，连接被掐断是正常现象 —— 报错反而是成功信号。
       只有明确的 HTTP 业务错误（api() 抛出来的那种）才当失败。 */
    if (e && e.network) toast('面板重启中，稍后重新登录');
    else toast(e.message, true);
  }
}

/* ================= 登录日志 =================
   对应面板「系统设置 → 登录日志」。

   接口：GET /api/user/login-log → { code, data: [ { timestamp, address, ip, platform, status } ] }
   后端 getLoginLog() 是 `result.map(x => x.info)` —— **返回的对象里没有 id**，
   所以不能用 id 当 key，用数组下标。而且最多只留 100 条，按时间倒序。

   timestamp 是 **毫秒**（后端写的是 Date.now()）。status：0 = 成功，1 = 失败。 */

/* 登录日志要显示完整日期（面板里也是 YYYY-MM-DD HH:mm:ss）。
   已有的 fmtAbs() 只给 MM-DD HH:mm:ss，这里单独写一个。 */
function fmtFull(ms) {
  if (!ms) return '—';
  var d = new Date(Number(ms));
  if (isNaN(d.getTime())) return String(ms);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
    pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

async function loadLoginLog(force) {
  var l = S.loginlog;
  if (l.loading) return;
  if (l.list.length && !force) { renderLoginLog(); return; }
  l.loading = true;
  l.err = '';
  renderLoginLog();
  try {
    var r = await api('/api/user/login-log');
    l.list = (r.data && r.data.length !== undefined) ? r.data : [];
  } catch (e) {
    l.err = e.message;
    l.list = [];
  }
  l.loading = false;
  renderLoginLog();
}

function renderLoginLog() {
  var box = $('#loginlogList');
  if (!box) return;
  var l = S.loginlog;
  $('#sub').textContent = l.list.length ? (l.list.length + ' 条记录') : '';
  if (l.loading && !l.list.length) {
    box.innerHTML = '<div class="center"><span class="spin"></span>读取登录日志…</div>';
    return;
  }
  if (l.err) {
    box.innerHTML = '<div class="empty"><span class="ei">!</span>' + esc(l.err) +
      '<div style="margin-top:16px"><button class="btn" id="btnLogRetry" style="padding:8px 22px">重试</button></div></div>';
    return;
  }
  if (!l.list.length) {
    box.innerHTML = '<div class="empty"><span class="ei">▤</span>还没有登录记录</div>';
    return;
  }
  box.innerHTML = l.list.map(function (x, i) {
    /* 0 = 成功，1 = 失败。跟面板前端一样按下标取，认不出的值原样显示。 */
    var ok = Number(x.status) === 0;
    var st = (x.status === 0 || x.status === 1) ? { t: ok ? '成功' : '失败', c: ok ? 'green' : 'red' }
                                                : { t: '状态 ' + x.status, c: 'gray' };
    return '<div class="item">' +
      '<div class="row"><div class="nm sp">' + esc(fmtFull(x.timestamp)) + '</div>' + pill(st) + '</div>' +
      '<div class="f11 t3" style="margin-top:6px">第 ' + (i + 1) + ' 条</div>' +
      '<div class="meta">' +
        '<div class="kv"><span class="k">登录地址</span><span class="v">' + esc(x.address || '—') + '</span></div>' +
        '<div class="kv"><span class="k">登录 IP</span><span class="v mono">' + esc(x.ip || '—') + '</span></div>' +
        '<div class="kv"><span class="k">登录设备</span><span class="v">' + esc(x.platform || '—') + '</span></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* ---------- 面板日志（面板「系统设置 → 系统日志」） ---------- */
/* 接口 GET /api/system/log?startTime=&endTime= 回的是**纯文本**：后端把区间内
   所有 .log 文件按顺序首尾拼起来直接流回来，没有 {code,data} 包装，所以只能走
   apiText()。startTime / endTime 传 YYYY-MM-DD 就行 —— 后端自己会
   dayjs(x).startOf('d') / .endOf('d')，多传时分秒反而不一致。
   range 只留「今天 / 近 7 天」：手机上没有日期选择器，而且面板自己
   （setting/systemLog.tsx）也把可选范围卡死在最近 7 天。 */
function dateYmd(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function sysLogRange() {
  var end = new Date();
  var start = new Date();
  /* 近 7 天含今天，所以往回退 6 天 */
  if (S.syslog.range === '7d') start = new Date(end.getTime() - 6 * 86400000);
  return { startTime: dateYmd(start), endTime: dateYmd(end) };
}

async function loadSysLog(force) {
  var g = S.syslog;
  /* 已经有一轮在飞：直接返回。日志是整段文本，重复打没有意义。 */
  if (g.loading) return;
  /* 同一档已经拉到过内容就不重复打接口（从别的 tab 切回来重画即可）。
     force 是「刷新」按钮和切档位走的。 */
  if (g.text && !force) { renderSysLog(); return; }
  g.loading = true;
  g.err = '';
  renderSysLog();
  var seq = (g.seq = (g.seq || 0) + 1);
  try {
    var text = await apiText('/api/system/log', sysLogRange());
    /* 期间又点了一次刷新 / 切了档位：这次的结果已经过期，丢掉 */
    if (seq !== g.seq) return;
    /* ANSI 在这里**一次性**剥掉，不留给渲染层 ——
       面板日志是进程原样写的，带 `\x1b[31m` 这种颜色码；剥在这里的话
       正文、筛选、搜索、复制看到的都是同一份干净文本。
       （1.0.21 之前是渲染时逐行 stripAnsi；1.0.22 正文改走 logBoxHtml 后
       那个 stripAnsi 就没了，颜色码会直接显示成乱码 —— 所以挪到入口。） */
    g.text = stripAnsi(text || '');
  } catch (e) {
    if (seq !== g.seq) return;
    g.err = e.message;
    g.text = '';
  }
  g.loading = false;
  renderSysLog();
}

/* 按级别上色。面板日志的行长这样：`2026-09-18 13:00:00 [ℹ️info] ...`，
   但不同小版本里的记号不一样（有的纯文字 [info]、有的带 emoji 前缀），
   所以只认行里出现的级别词。**认不出就返回空串保持默认色** ——
   不能因为认不出就把整行丢掉或标红，那会把普通日志变成一堆假错误。 */
function logLv(line) {
  var m = /\[[^\]]{0,10}(debug|info|warn|error)/i.exec(line) ||
          /\b(debug|info|warn|error)\b/i.exec(line);
  return m ? m[1].toLowerCase() : '';
}

/* 日志正文里「算错误」的行。**只认级别记号，不认中文「失败」** ——
   「失败」两个字在正常日志里到处都是（「上次失败原因：无」「失败重试 0 次」），
   拿它当筛子会把一堆正常行捞进来，用户试一次就不信这个开关了。
   logLv 认不出级别就返回空串，所以这里天然是「宁缺勿滥」。 */
function isErrLine(line) {
  return logLv(line) === 'error';
}
/* 从整段日志里挑出要显示的行，带**原始行号**（面板网页版报错时会报行号，好对上）。
   onlyErr 和 q 是**与**的关系：两个都开着 = 在错误行里再搜关键字。
   计数、渲染、复制**都走这一个函数** —— 三处各写一遍的话，
   迟早出现「框里显示 3 行、复制出来 5 行」这种对不上的事。 */
function logPick(lines, onlyErr, q) {
  var k = String(q || '').toLowerCase();
  var out = [];
  (lines || []).forEach(function (l, i) {
    var s = String(l == null ? '' : l);
    if (onlyErr && !isErrLine(s)) return;
    if (k && s.toLowerCase().indexOf(k) < 0) return;
    out.push({ n: i + 1, t: s });
  });
  return out;
}
function logErrLines(lines) { return logPick(lines, true, ''); }
/* 按当前筛选拼出**纯文本**（不带行号）—— 复制走它。
   DOM 里那份带了行号和高亮标签，直接读 textContent 会把行号一起复制走。 */
function logPickText(lines, onlyErr, q) {
  return logPick(lines, onlyErr, q).map(function (x) { return x.t; }).join('\n');
}
/* 命中处高亮。**先按原文找位置、再分段转义** ——
   反过来（先 esc 再找）的话，关键字里带 `<` 或 `&` 就永远搜不到了。 */
function logHi(line, q) {
  var s = String(line == null ? '' : line);
  var k = String(q || '');
  if (!k) return esc(s);
  var low = s.toLowerCase(), kl = k.toLowerCase();
  var out = '', i = 0;
  for (;;) {
    var p = low.indexOf(kl, i);
    if (p < 0) break;
    out += esc(s.slice(i, p)) + '<span class="hl">' + esc(s.slice(p, p + kl.length)) + '</span>';
    i = p + kl.length;
  }
  return out + esc(s.slice(i));
}
/* 日志框的内容。一行一个 <span>（只拼字符串、不建 DOM 节点 ——
   几千行的日志逐行 createElement 在手机上会明显卡）。
   筛选（只看错误 / 搜索）时行首带行号，行号是**独立**的 span，
   不套在 .lv-error 里面，否则行号也会跟着变红；
   不筛选时**不带行号**，保持终端观感。 */
function logBoxHtml(lines, onlyErr, q) {
  var list = logPick(lines, onlyErr, q);
  var num = !!(onlyErr || q);
  return list.map(function (x) {
    var lv = logLv(x.t);
    return (num ? '<span class="ln">' + x.n + '</span>' : '') +
      '<span' + (lv ? ' class="lv-' + lv + '"' : '') + '>' + logHi(x.t, q) + '\n</span>';
  }).join('');
}
/* 「复制」到底复制什么：**按当前显示的那份来** ——
   开了「只看错误」还复制全文，用户会以为没生效（或者以为复制漏了）。
   走 S.logfile 里的原文，不读 DOM：DOM 里那份带了行号和高亮标签。 */
function logCopyText() {
  var lf = S.logfile;
  if (lf.onlyErr || lf.q) {
    return logPickText(lf.lines, lf.onlyErr, lf.q);
  }
  return lf.txt || '';
}
/* 重画日志框（切「只看错误」/ 改搜索词时用）。**不重新打接口** ——
   内容已经在 S.logfile.lines 里了，再请求一次纯属浪费，还会闪一下。 */
function paintLogFile() {
  var lf = S.logfile;
  var pre = $('#logPre');
  if (!pre) return;
  pre.innerHTML = logBoxHtml(lf.lines, lf.onlyErr, lf.q);
  /* 滚到哪儿：搜索时滚到**第一条匹配**（否则搜完还停在末尾，看着像没搜到）；
     其它情况贴到底 —— 新的日志追加在文件末尾，最新在下面。
     必须等 innerHTML 落地之后再滚，否则 scrollHeight 还是旧值。 */
  pre.scrollTop = lf.q ? 0 : pre.scrollHeight;
  var eb = $('#btnLogErr');
  if (eb) eb.textContent = lf.onlyErr ? '看全部' : '只看错误';
  var cp = $('#btnCopyLog');
  if (cp) cp.textContent = lf.q ? '复制匹配行' : (lf.onlyErr ? '复制错误行' : '复制内容');
  var fn = $('#logFindN');
  if (fn) {
    fn.textContent = lf.q ? (logPick(lf.lines, lf.onlyErr, lf.q).length + ' 行匹配') : '';
  }
  bindLogTailScroll(pre);
  syncLogTail();
}

/* 面板日志切行。末尾那个换行会切出一个空串，去掉 —— 否则日志框底下永远多一行空白，
   「共 N 行」也会多算一行。三处日志界面（弹层 / 详情页 / 面板日志）都这么切。 */
function sysLogLines() {
  var lines = String(S.syslog.text || '').split('\n');
  if (lines.length && lines[lines.length - 1] === '') lines.pop();
  return lines;
}

/* 重画面板日志的正文框（改搜索词 / 切「只看错误」走这里）。
   **不重新打接口**（内容已经在 S.syslog.text 里了），
   也**不重建搜索框** —— 重建会把已输入的字和光标位置弄丢。
   筛选逻辑和另外两处日志界面共用 logPick / logBoxHtml，不会出现
   「框里 3 行、复制出来 5 行」这种对不上的事。 */
function paintSysLog() {
  var pre = $('#syslogPre');
  if (!pre) return;
  var g = S.syslog;
  var lines = sysLogLines();
  var errN = logErrLines(lines).length;
  /* 贴底判断要在换 innerHTML 之前做（换完 scrollTop 会被重置成 0），
     第一次画直接跳到底：面板日志最新的一行在最下面，停在开头等于什么都没看到。 */
  var stick = !g.painted || atBottom(pre);
  pre.innerHTML = lines.length ? logBoxHtml(lines, g.onlyErr, g.q) : '（日志为空）';
  g.painted = true;
  if (g.q) pre.scrollTop = 0;
  else if (stick) pre.scrollTop = pre.scrollHeight;
  var eb = $('#btnSysLogErr');
  if (eb) {
    /* 一行错都没有就不给按钮（点了只会看到空框），跟另外两处一致 */
    eb.style.display = errN ? '' : 'none';
    eb.textContent = g.onlyErr ? '看全部' : '只看错误';
  }
  var cp = $('#btnSysLogCopy');
  if (cp) cp.textContent = g.q ? '复制匹配行' : (g.onlyErr ? '复制错误行' : '复制');
  var fn = $('#sysLogFindN');
  if (fn) fn.textContent = g.q ? (logPick(lines, g.onlyErr, g.q).length + ' 行匹配') : '';
  var mt = $('#sysLogMeta');
  if (mt) {
    if (g.onlyErr || g.q) {
      mt.textContent = '筛出 ' + logPick(lines, g.onlyErr, g.q).length + ' 行（共 ' + lines.length + ' 行）';
    } else {
      mt.textContent = '共 ' + lines.length + ' 行' + (errN ? ' · 错误 ' + errN : '');
    }
  }
}

function renderSysLog() {
  var box = $('#syslogBody');
  if (!box) return;
  var g = S.syslog;
  $('#sub').textContent = '';

  var h = segHtml('syslogSeg', [{ v: 'today', t: '今天' }, { v: '7d', t: '近 7 天' }], g.range);
  h += '<div class="row" style="gap:8px;margin:12px 0">' +
    '<button class="btn" id="btnSysLogReload" style="flex:1">' + (g.loading ? '刷新中…' : '刷新') + '</button>' +
    '<button class="btn danger" id="btnSysLogClear" style="flex:1">清空日志</button>' +
    '</div>';

  var lines = sysLogLines();

  if (g.err) {
    h += '<div class="empty"><span class="ei">!</span>' + esc(g.err) +
      '<div style="margin-top:16px"><button class="btn" id="btnSysLogReload2" style="padding:8px 22px">重试</button></div></div>';
  } else if (g.loading && !lines.length) {
    h += '<div class="center"><span class="spin"></span>读取面板日志…</div>';
  } else if (!lines.length) {
    h += '<div class="empty"><span class="ei">☰</span>这段时间没有面板日志</div>';
  } else {
    /* 几千行是常态：整块拼字符串一次性 innerHTML，不逐行建 DOM 节点 ——
       逐行 createElement 在手机上会明显卡住。正文交给 paintSysLog 填。 */
    h += '<div class="row" style="margin:0 4px 8px;gap:8px;align-items:center">' +
      '<div class="f11 t3 sp" id="sysLogMeta"></div>' +
      '<button class="btn" id="btnSysLogErr" style="display:none;padding:6px 12px;font-size:calc(12px*var(--fs));flex:0 0 auto">只看错误</button>' +
      '</div>';
    h += '<div class="searchbar" style="margin:0 4px 8px;display:flex;gap:8px;align-items:center">' +
      '<input id="sysLogFind" type="search" placeholder="在面板日志里搜关键字" style="flex:1">' +
      '<div class="f11 t3" id="sysLogFindN" style="flex:0 0 auto"></div>' +
      '</div>';
    h += '<pre class="logbox lg" id="syslogPre"></pre>';
    h += '<div class="row" style="margin-top:12px;gap:8px">' +
      '<button class="btn" id="btnSysLogCopy" style="flex:1">复制</button>' +
      '</div>';
    h += '<div class="f11 t3" style="margin:10px 4px 0;line-height:1.6">日志是面板进程自己写的，' +
      '跟任务运行日志不是一回事（任务日志在「日志文件」里）。</div>';
  }
  box.innerHTML = h;

  /* 搜索框是这次 innerHTML **新建**的，input 事件委托不到，得就地挂。
     paintSysLog 只改 #syslogPre、不会把这个 input 换掉，所以挂一次就够。
     但 renderSysLog 会被「刷新 / 切档位 / 切回本页」重新调用（那时输入框是新的），
     所以必须把 g.q **回填**进去 —— 不然搜过的词会凭空消失，看着像搜索没生效。 */
  var sfin = $('#sysLogFind');
  if (sfin) {
    sfin.value = g.q;
    sfin.addEventListener('input', function () {
      S.syslog.q = sfin.value.trim();
      paintSysLog();
    });
  }
  /* 正文交给 paintSysLog 填（顺带按「第一次画 / 本来就贴着底」决定滚到哪儿），
     和切「只看错误」走同一条路 —— 不搞两套滚动逻辑。 */
  if ($('#syslogPre')) paintSysLog();

  /* 这几个元素是刚被 innerHTML 换掉的，全局委托里没登记它们，就地绑。
     每次重画都是新元素，旧监听随旧元素一起消失，不会累积。 */
  bindSeg('#syslogSeg');
  var seg = $('#syslogSeg');
  if (seg) seg.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-segval]') : null;
    if (!b || b.dataset.segval === S.syslog.range) return;
    S.syslog.range = b.dataset.segval;
    /* 换档位必须先清空旧内容 —— loadSysLog 里那条「已有内容就只重画、不打接口」
       的短路会把新档位的结果一直挡在外面，表现是「点了没反应」。 */
    S.syslog.text = '';
    loadSysLog(true);
  });
  var reload = function () { S.syslog.text = ''; loadSysLog(true); };
  var rl = $('#btnSysLogReload');
  if (rl) rl.addEventListener('click', reload);
  var rl2 = $('#btnSysLogReload2');
  if (rl2) rl2.addEventListener('click', reload);
  var cl = $('#btnSysLogClear');
  if (cl) cl.addEventListener('click', clearSysLog);
}

async function clearSysLog() {
  if (!confirm('清空面板日志？\n\n面板会把日志目录里的 .log 文件删掉，此操作不可恢复。')) return;
  try {
    await api('/api/system/log', { method: 'DELETE' });
    toast('已清空');
  } catch (e) {
    toast(e.message);
  }
  S.syslog.text = '';
  await loadSysLog(true);
}

/* ================= 弹层 ================= */
function openSheet(title, html) {
  $('#shT').textContent = title;
  $('#shB').innerHTML = html;
  $('#shB').scrollTop = 0;
  var sh = $('#sheet');
  /* 兜一道：显式把弹层抬到登录页之上。CSS 里已经改成 40 了，这里再钉一次，
     避免以后有人调样式时又把它压回去 —— 这类层叠问题不会报错，只会「点了没反应」。 */
  sh.style.zIndex = '45';
  sh.classList.add('on');
  requestAnimationFrame(function () { sh.querySelector('.panel').style.transform = 'translateY(0)'; });
  syncBack();
}
function closeSheet() {
  stopDetailPolling();
  S.detailId = null;
  $('#sheet').classList.remove('on');
  /* 关弹层顺手收起「跳到最新」。必须显式收：关掉之后没人再调 syncLogTail，
     而 #shB 的内容不会清空 —— 不收的话那个按钮会一直浮在主页上。
     顺带把「当前挂着的日志框」也忘掉，下次开弹层是新元素、要重新挂监听。 */
  var lt = $('#btnLogTail');
  if (lt) lt.classList.add('hidden');
  tailBoundEl = null;
  syncBack();
}

/* ================= 返回上一级 =================
   页面是单视图 SPA，**完全没用 history API**（底部 tab 切视图 + 弹层），
   所以浏览器 / 系统的返回手势在这页上没有可用的历史栈。

   安卓有实体返回键、iOS 有左边缘右滑，两边都得靠页面自己说清楚「现在能不能返回」。
   这里维护一个统一的判断，原生壳通过 QLNative.setBack(bool) 拿到，
   据此决定要不要让手势生效；手势触发时调 window.__qlBack() 回来执行。

   层级（从外到内）：
     1. 弹层开着（任务详情 / 各种编辑表单）→ 关弹层
     2. 日志页下钻了目录 → 回上一级
     3. 是从任务详情跳出来的（脚本 / 最新日志 / 日志历史）→ 回那个任务详情
     4. 当前不是底栏页面（日志是从「我的」进去的）→ 回「我的」
     5. 其余情况（就在底栏某页的顶层）→ 没什么可返回的，手势不生效 */
function canGoBack() {
  var sh = $('#sheet');
  if (sh && sh.classList.contains('on')) return true;
  if (S.tab === 'logs' && S.logs.path.length) return true;
  /* 任务可能已经被删了 / 列表刷新后找不到了 —— 那就不算「能返回」，
     否则手势会生效但按下去什么都不发生，比手势不生效更让人困惑。 */
  if (S.backTo && cronById(S.backTo)) return true;
  if (!$('#tabbar button[data-tab="' + S.tab + '"]')) return true;
  return false;
}

/* 回到跳走前那个任务详情。任务没了就返回 false，让调用方接着走后面的兜底分支。 */
function backToCron() {
  var id = S.backTo;
  if (!id) return false;
  S.backTo = null;
  if (!cronById(id)) return false;
  openCron(id);
  return true;
}

function goBack() {
  var sh = $('#sheet');
  if (sh && sh.classList.contains('on')) { closeSheet(); return true; }
  if (S.tab === 'logs' && S.logs.path.length) { loadLogs(S.logs.path.slice(0, -1)); return true; }
  if (backToCron()) return true;
  if (!$('#tabbar button[data-tab="' + S.tab + '"]')) { setTab('me'); return true; }
  return false;
}

/* 把「能否返回」告诉原生。原生不在（浏览器 / 没注入桥）就算了，不影响页面本身。 */
function syncBack() {
  if (!window.QLNative || typeof window.QLNative.setBack !== 'function') return;
  try { window.QLNative.setBack(canGoBack()); } catch (e) { /* 桥挂了不该影响页面 */ }
}

/* 原生侧手势触发时调这个。返回 true 表示确实处理了。 */
window.__qlBack = function () { return goBack(); };

/* ================= 下拉刷新 ================= */
var ptrStart = 0, ptrPull = 0;
function bindPTR() {
  var main = $('#main'), ptr = $('#ptr');
  main.addEventListener('touchstart', function (e) {
    ptrStart = main.scrollTop <= 0 ? e.touches[0].clientY : 0;
    ptrPull = 0;
  }, { passive: true });
  main.addEventListener('touchmove', function (e) {
    if (!ptrStart) return;
    var dy = e.touches[0].clientY - ptrStart;
    if (dy > 0 && main.scrollTop <= 0) {
      ptrPull = Math.min(dy * 0.45, 64);
      ptr.style.height = ptrPull + 'px';
      ptr.style.opacity = String(Math.min(ptrPull / 55, 1));
      ptr.textContent = ptrPull > 48 ? '松手刷新' : '↓ 下拉刷新';
    }
  }, { passive: true });
  main.addEventListener('touchend', function () {
    if (ptrPull > 48) {
      ptr.textContent = '刷新中…';
      refresh().then(function () {
        ptr.style.height = '0px'; ptr.style.opacity = '0';
      });
    } else {
      ptr.style.height = '0px'; ptr.style.opacity = '0';
    }
    ptrStart = 0; ptrPull = 0;
  });
  main.addEventListener('scroll', function () {
    if (S.tab !== 'crons') return;
    var c = S.crons;
    if (main.scrollTop + main.clientHeight > main.scrollHeight - 260 && c.list.length < c.total && !c.loading) {
      loadCrons(false);
    }
  }, { passive: true });
}
