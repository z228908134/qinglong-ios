      /* 网络层失败时直接把诊断报告弹出来，省得用户对着一句 Failed to fetch 发懵 */
      if (e.network) {
        console.warn('[青龙管家] 请求失败', e.url, e);
        setTimeout(function () {
          openSheet('连接诊断', '<div class="f13 t2" style="padding:6px 4px 12px">正在测试…</div>');
          diagnose().then(function (html) { openSheet('连接诊断', html); });
        }, 800);
      }
    }
    return false;
  } finally {
    btn.disabled = false; btn.textContent = '登录';
  }
}

async function bootAfterLogin() {
  try { var sys = await api('/api/system'); S.sys = sys.data || null; } catch (e) {}
  setTab(S.tab || 'crons', true);
  /* 头像**不 await**：它要下一个 /api/user 再下一次图片，压在这里等于把登录
     拖慢一拍。先让界面出来（这时候是首字母），拉到了再就地换掉。 */
  loadAvatar().then(paintAvatars);
}

/* ================= 顶栏 / Tab ================= */

var TITLES = {

     功能模块一个都不搬 —— 全部留在「我的」。 */
  home: '面板概览',
  crons: '定时任务', envs: '环境变量', scripts: '脚本管理',
  subs: '订阅管理', deps: '依赖管理', configs: '配置文件',
  logs: '日志文件', me: '所有功能',
  /* 这三个对应面板网页版「系统设置」里的同名页签，入口在系统设置弹层里。
     名字照面板的叫法，不要改 —— 用户是照面板的名字找的。 */
  apps: '应用设置', sysconf: '其他设置', loginlog: '登录日志', syslog: '面板日志'

/* 顶栏「+」出现在哪些页面。
   脚本页比较特殊：它有「上传 / 新建脚本 / 新建文件夹」三个动作，所以走下拉菜单；

var ADD_TABS = { crons: 1, envs: 1, scripts: 1, subs: 1, deps: 1, configs: 1, apps: 1 };

/* 「+」在非脚本页点下去要做的事。返回 false 表示这页没有新建动作。 */
function openNewForTab(tab) {

  if (tab === 'envs') return openEnvEdit(null);
  if (tab === 'subs') return openSubEdit(null);
  if (tab === 'deps') return openDepEdit(null);

  if (tab === 'apps') return openAppEdit(null);

}

function setTab(tab, force) {
  if (!TITLES[tab]) tab = 'crons';

  if (tab !== 'crons' && S.crons.edit) {

async function refresh() {
  /* 进任务页先把视图列表拉一次：面板上可能刚加/删过视图，而且 loadCrons
     要用 c.view 拼查询条件，得先拉完再查。 */
  if (S.tab === 'home') return loadDash();
  if (S.tab === 'crons') { await loadViews(); return loadCrons(true); }
  if (S.tab === 'envs') return loadEnvs();
  if (S.tab === 'scripts') return loadScripts(S.scripts.path, true);
  if (S.tab === 'subs') return loadSubs();
  if (S.tab === 'deps') return loadDeps();
  if (S.tab === 'configs') return loadConfigs();
  if (S.tab === 'logs') return loadLogs(S.logs.path, true);
  if (S.tab === 'apps') return loadApps();
  if (S.tab === 'sysconf') return loadSysconf();
  if (S.tab === 'loginlog') return loadLoginLog();
  if (S.tab === 'syslog') return loadSysLog();
  if (S.tab === 'me') return loadDash();
}

/* ================= 任务列表 ================= */

/* 四个状态筛选。**和上面 ST 的四个值一一对应**，是青龙自己的分法：
     运行中 → status 0
     未使用 → status 1
     已禁用 → status 2（或 isDisabled 为 1）
   排队中（status 3）归进「运行中」—— 它也是「在用」，单列一档反而没人找得到。
   四档互斥、加起来正好是全部；漏掉任何一个值，那类任务就只能在「全部」里看到，
   用户会以为任务丢了。 */
var CRON_FILTERS = [
  ['all', '全部'], ['running', '运行中'], ['unused', '未使用'], ['disabled', '已禁用']
];

function cronBucket(t) {
  if (t.isDisabled === 1 || Number(t.status) === 2) return 'disabled';
  if (Number(t.status) === 1) return 'unused';
  return 'running';
}

function cronFiltered() {
  var f = S.crons.filter || 'all';
  if (f === 'all') return S.crons.list;
  return S.crons.list.filter(function (t) { return cronBucket(t) === f; });
}

function renderCronFilters() {
  var box = $('#cronFilters');
  if (!box) return;
  var f = S.crons.filter || 'all';
  box.innerHTML = CRON_FILTERS.map(function (x) {
    return '<button class="cfbtn' + (x[0] === f ? ' on' : '') + '" data-cf="' + x[0] + '">' +
      esc(x[1]) + '</button>';
  }).join('');
}

/* 切筛选。非「全部」时先把列表一次拉全：只筛当前这一页会漏掉后面几页，
   用户会以为「已禁用」就一个。任务量级是几百个，一次拉得动。 */
async function setCronFilter(f) {
  if (f === S.crons.filter) return;
  if (!CRON_FILTERS.some(function (x) { return x[0] === f; })) return;
  S.crons.filter = f;
  renderCronFilters();
  if (f !== 'all' && S.crons.list.length < S.crons.total) {
    S.crons.size = Math.max(S.crons.size, 500);
    await loadCrons(true);
    return;
  }
  renderCrons();
}

/* 1.0.25：从别处（现在只有主页「正在执行 N 个」）直接跳到任务页的某个状态档位。
   跟 setCronFilter 的区别是它**顺带切页** —— setCronFilter 是在任务页内部切的，
   从主页过来不 setTab 的话页面根本不会变。
   非「全部」档位要先把 size 顶到 500 再切（切页触发的 refresh 会按新 size 拉全），
   不然只筛到当前这一页，用户会以为「在跑的就一个」。 */
async function gotoCrons(bucket) {
  if (!CRON_FILTERS.some(function (x) { return x[0] === bucket; })) bucket = 'all';
  S.crons.filter = bucket;
  if (bucket !== 'all') S.crons.size = Math.max(S.crons.size, 500);
  renderCronFilters();
  setTab('crons');
}

/* ================= 定时视图（面板「定时任务」页顶部那排 tab） =================
   面板的「定时视图」是**保存好的筛选条件**，不是时间轴。每个视图长这样：
     { id, name, filters: [{ property, operator, value }], sorts, filterRelation,
       position, isDisabled }
   查任务时把 filters / sorts / filterRelation 原样透传成 queryString 参数，
   筛选在**后端**做 —— 所以切视图必须重新拉列表，不能在本地筛。
   property 只认 6 个：command / name / schedule / status / labels / sub_id；
   operator 只认 4 个：Reg（包含）/ NotReg（不包含）/ In / Nin。
   这些值这里既不解释也不校验 —— 手机端只负责把后端存的东西原样送回去，
   多一层本地校验反而会和面板以后新加的字段打架。 */

/* 拉视图列表。失败就降级（老面板没有这个接口），整条 tab 栏藏起来。 */
async function loadViews() {
  var c = S.crons;
  try {
    var r = await api('/api/crons/views');
    /* 面板前端只显示 isDisabled 不为真的那些，这里照做。 */
    c.views = (Array.isArray(r.data) ? r.data : []).filter(function (v) { return !v.isDisabled; });
    c.viewsFailed = false;
  } catch (e) {
    c.views = [];
    c.viewsFailed = true;
  }
  /* 当前选中的视图还在列表里就保留（切走再切回来还停在原来那个 tab 上），
     否则退回第一个 —— 通常就是内置的「全部任务」。 */
  var keep = c.view && c.views.filter(function (v) {
    return Number(v.id) === Number(c.view.id);
  })[0];
  c.view = keep || c.views[0] || null;
  renderViewTabs();
}

function renderViewTabs() {
  var box = $('#cronViewTabs');
  if (!box) return;
  var c = S.crons;
  /* 一个视图都没有（或接口拉失败）就整条藏起来 ——
     空着一行 tab 只会让人以为功能坏了。 */
  if (c.viewsFailed || !c.views.length) {
    box.classList.add('hidden');
    box.innerHTML = '';
    return;
  }
  var cur = c.view ? Number(c.view.id) : null;
  box.innerHTML = c.views.map(function (v) {
    return '<button class="vtab' + (Number(v.id) === cur ? ' on' : '') + '" data-view="' +
      esc(v.id) + '">' + esc(v.name) + '</button>';
  }).join('');
  box.classList.remove('hidden');
}

/* 切视图。筛选在后端做，所以要重新拉列表、回到第 1 页。
   顺带把本地那四档重置成「全部」：档位属于上一个视图的上下文，
   带着它切过去很容易出现「服务端筛出 3 条、本地那档又筛掉 3 条」的空列表，
   用户会以为视图坏了。 */
async function setView(id) {
  var c = S.crons;
  var v = c.views.filter(function (x) { return Number(x.id) === Number(id); })[0];
  if (!v) return;
  if (c.view && Number(c.view.id) === Number(v.id)) return;
  c.view = v;
  c.filter = 'all';
  renderViewTabs();
  await loadCrons(true);
}

function renderCrons() {
  var c = S.crons;
  var list = cronFiltered();
  var fname = (CRON_FILTERS.filter(function (x) { return x[0] === (c.filter || 'all'); })[0] || [])[1];
  var editing = !!c.edit;

  /* 筛选条和编辑栏放在早退分支**之前**无条件同步：它们显示什么（高亮哪一档、
     按钮叫「编辑」还是「完成」、已选几个）全看 c.filter / c.edit / c.sel，
     放在下面的话，列表一空（加载中 / 筛出来是 0 条）它们就停在旧状态上了。 */
  renderCronFilters();
  renderCronEditBar();

  $('#sub').textContent = c.total
    ? ('共 ' + c.total + ' 个' + (c.filter && c.filter !== 'all'
        ? ' · ' + fname + ' ' + list.length + ' 个'
        : ' · 已加载 ' + c.list.length + ' 个'))
    : '';

  var box = $('#cronList');
  if (c.loading && !c.list.length) {
    box.innerHTML = '<div class="center"><span class="spin"></span>加载中…</div>';
    $('#cronFoot').innerHTML = '';
    return;
  }
  if (!list.length) {
    box.innerHTML = '<div class="empty"><span class="ei">▤</span>' +
      (c.q ? '没有匹配「' + esc(c.q) + '」的任务'
           : (c.filter && c.filter !== 'all' ? '没有「' + esc(fname) + '」的任务' : '还没有定时任务')) +
      '</div>';
    $('#cronFoot').innerHTML = '';
    return;
  }

  box.innerHTML = list.map(function (t) {
    var s = statusOf(t);
    /* 搜索命中就上黄底。以前搜完只是「列表变短了」，命中的是哪几个字还得自己找 ——
       和日志搜索那套不一样（那边有黄底高亮），这里补上，用的还是同一个 logHi。 */
    var tags = '';
    if (t.schedule) tags += '<span class="tag">' + logHi(t.schedule, c.q) + '</span>';
    (t.labels || []).slice(0, 3).forEach(function (l) { tags += '<span class="tag">' + logHi(l, c.q) + '</span>'; });
    if (t.isSystem === 1) tags += '<span class="tag">系统</span>';

    var next = nextRunText(t.schedule);
    /* 「上次」后面挂一个耗时：脚本越跑越慢是京东类任务最常见的问题，
       光看「上次 3 小时前」看不出这个。last_running_time 是**秒数**（不是时间点），
       详见 fmtDur 的注释。0 表示没跑过 / 面板没回，那就不显示。 */
    var last = '上次 ' + fmtRel(cronMs(t.last_execution_time));
    if (t.last_running_time > 0) last += ' · 耗时 ' + fmtDur(t.last_running_time);

    /* 编辑模式下卡片左边多个勾选圈，「运行 / 更多」两个按钮收起来：
       一是避免批量操作时误触，二是腾出位置。点整张卡片 = 勾选 / 取消勾选。 */
    var on = editing && !!c.sel[t.id];
    return '<div class="item' + (on ? ' on' : '') + '" data-cron="' + t.id + '">' +
      '<div class="row">' +
        (editing ? '<span class="ckb">✓</span>' : '') +
        '<div class="nm sp">' + (t.isPinned === 1 ? '📌 ' : '') + logHi(t.name || '未命名任务', c.q) + '</div>' + pill(s) + '</div>' +
      '<div class="tags">' + tags + '</div>' +
      '<div class="row f11 t3" style="margin-top:8px">' +
        '<span>' + esc(last) + '</span>' +
        (next ? '<span class="sp ell" style="text-align:right">下次 ' + esc(next) + '</span>' : '') +
      '</div>' +
      (editing ? '' :
      '<div class="row" style="margin-top:10px;gap:8px">' +
        '<button class="btn" style="flex:1;padding:8px" data-act="' + (isBusy(t) ? 'stop' : 'run') + '" data-id="' + t.id + '">' +
          (isBusy(t) ? '停止' : '运行') + '</button>' +
        '<button class="btn" style="flex:1;padding:8px" data-act="more" data-id="' + t.id + '">更多</button>' +
      '</div>') +
    '</div>';
  }).join('');

  $('#cronFoot').innerHTML = c.list.length < c.total
    ? '<div class="center"><span class="spin"></span>加载更多…</div>'
    : '<div class="center">已经到底了</div>';
}

async function loadCrons(reset) {
  var c = S.crons;
  if (c.loading) return;
  if (reset) { c.page = 1; }
  else if (c.list.length >= c.total) return;
  c.loading = true;
  if (reset) renderCrons();
  try {
    /* 选中的视图跟着一起送。面板前端是**无条件**透传的（哪怕 filters 是空的
       「全部任务」也照送），这里保持一致 —— 自己加「空了就不送」的判断，
       反而会和后端行为对不上。 */
    var q = { searchValue: c.q, page: c.page, size: c.size };
    if (c.view) {
      q.queryString = JSON.stringify({
        filters: c.view.filters || [],
        sorts: c.view.sorts || null,
        filterRelation: c.view.filterRelation || 'and'
      });
    }
    var r = await api('/api/crons', { query: q });
    var d = r.data || {};
    var fresh = d.data || [];
    if (reset) c.list = fresh;
    else {
      var seen = new Set(c.list.map(function (x) { return x.id; }));
      fresh.forEach(function (x) { if (!seen.has(x.id)) c.list.push(x); });
    }
    c.total = d.total || 0;
    c.page += 1;
  } catch (e) {
    toast(e.message, true);
    if (reset) c.list = [];
  } finally {
    c.loading = false;
    renderCrons();
  }
}

async function cronAction(id, act) {
  id = Number(id);
  var t = S.crons.list.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  var label = '';
  try {
    if (act === 'run') { label = '已启动'; await api('/api/crons/run', { method: 'PUT', body: [id] }); }
    else if (act === 'stop') { label = '已停止'; await api('/api/crons/stop', { method: 'PUT', body: [id] }); }
    else if (act === 'enable') { label = '已启用'; await api('/api/crons/enable', { method: 'PUT', body: [id] }); }
    else if (act === 'disable') { label = '已禁用'; await api('/api/crons/disable', { method: 'PUT', body: [id] }); }
    else if (act === 'pin') { label = '已置顶'; await api('/api/crons/pin', { method: 'PUT', body: [id] }); }
    else if (act === 'unpin') { label = '已取消置顶'; await api('/api/crons/unpin', { method: 'PUT', body: [id] }); }
    else if (act === 'delete') { label = '已删除'; await api('/api/crons', { method: 'DELETE', body: [id] }); }
    toast(label);
    /* 点了「立即运行」的人，下一步一定是看日志 —— 直接把详情页的日志区滚进视野，
       省得他自己往下找（内容不用管，那块本来就在自动刷新）。 */
    if (act === 'run' && S.detailId === id) scrollToCronLog();
    /* 状态徽标和主按钮**当场就换**，不等下一次轮询（3 秒后）——
       否则这三秒里按钮还写着「立即运行」，用户会以为没点上、再点一次。
       status 3 = 排队中（面板也是先排队、再转运行中）。 */
    if ((act === 'run' || act === 'stop') && S.detailId === id) {
      t.status = act === 'run' ? 3 : 1;
      paintCronState(t);
    }
    setTimeout(function () { loadCrons(true); }, act === 'delete' ? 0 : 600);
  } catch (e) {
    toast(e.message, true);
  }
}

/* ---------- 批量编辑（任务页左上角「编辑」） ---------- */

/* 点「编辑」进批量模式，按钮变成「完成」；再点一次退出并清空勾选。 */
function toggleCronEdit(on) {
  S.crons.edit = (on == null ? !S.crons.edit : !!on);
  if (!S.crons.edit) S.crons.sel = {};
  var b = $('#btnCronEdit');
  if (b) b.textContent = S.crons.edit ? '完成' : '编辑';
  renderCrons();
}

function cronSelCount() {
  var n = 0;
  for (var k in S.crons.sel) { if (S.crons.sel[k]) n++; }
  return n;
}

function cronSelIds() {
  var out = [];
  for (var k in S.crons.sel) { if (S.crons.sel[k]) out.push(Number(k)); }
  return out;
}

function toggleCronSel(id) {
  if (S.crons.sel[id]) delete S.crons.sel[id];
  else S.crons.sel[id] = true;
  renderCrons();
}

/* 全选 / 取消全选。只作用于**当前筛选出来的那些** —— 筛了「已禁用」再点全选，
   用户想处理的就是这些，不该把运行中的也一起勾上。 */
function cronSelectAll(on) {
  if (on) cronFiltered().forEach(function (t) { S.crons.sel[t.id] = true; });
  else S.crons.sel = {};
  renderCrons();
}

/* 批量操作完的提示。任务页 / 变量页共用 —— 各写一份的话，改了一处忘了另一处，
   用户看到的就是「已删除 3 个」和「已删除」两种文案。 */
function batchDone(label, ids) { toast(label + ' ' + ids.length + ' 个'); }

/* 批量动作。接口跟单个的一样，只是 body 传一组 id（青龙支持）。
   「运行 / 停止」是 1.0.23 补的：编辑模式以前只能改状态和删，最常用的
   「把这几个都跑一遍」反而没有 —— 得一个个点进详情页。 */
async function cronBatch(act) {
  var ids = cronSelIds();
  if (!ids.length) { toast('先选几个任务', true); return; }
  if (act === 'delete' && !confirm('删除选中的 ' + ids.length + ' 个任务？删除后不可恢复。')) return;
  var label = '';
  try {
    if (act === 'run') { label = '已启动'; await api('/api/crons/run', { method: 'PUT', body: ids }); }
    else if (act === 'stop') { label = '已停止'; await api('/api/crons/stop', { method: 'PUT', body: ids }); }
    else if (act === 'enable') { label = '已启用'; await api('/api/crons/enable', { method: 'PUT', body: ids }); }
    else if (act === 'disable') { label = '已禁用'; await api('/api/crons/disable', { method: 'PUT', body: ids }); }
    else if (act === 'delete') { label = '已删除'; await api('/api/crons', { method: 'DELETE', body: ids }); }
    else return;
    batchDone(label, ids);
    toggleCronEdit(false);
    await loadCrons(true);
  } catch (e) {
    toast(e.message, true);
  }
}

/* 批量操作栏的「外壳」：底栏让位 + 给 #main 加留白类 + 操作栏显隐。
   任务页和变量页两条栏共用 —— 两个贴底元素（底栏和操作栏）同时显示会叠在一起，
   藏掉底栏也就不用去猜它有多高；两行比底栏高，列表底部留白要跟着加。
   各写一份的话，改了一处忘了另一处就会出现「变量页底栏没藏、最后一张卡片被盖住」。
   返回 true 表示确实在编辑模式（调用方接着填内容）。 */
function openEditShell(barSel, on, mainCls) {
  var tb = $('#tabbar');
  if (tb) tb.classList.toggle('hidden', on);
  var mn = $('#main');
  if (mn) mn.classList.toggle(mainCls, on);
  var bar = $(barSel);
  if (!bar) return false;
  bar.classList.toggle('hidden', !on);
  if (!on) { bar.innerHTML = ''; return false; }
  return true;
}

/* 底部批量操作栏（任务页）。 */
function renderCronEditBar() {
  var on = !!S.crons.edit;
  if (!openEditShell('#cronEditBar', on, 'cronedit')) return;
  var bar = $('#cronEditBar');
  var n = cronSelCount();
  var allOn = n > 0 && n === cronFiltered().length;
  /* 两行：上行是「跑不跑」（运行 / 停止），下行是「改不改状态」（启用 / 禁用 / 删除）。
     单行 6 个按钮在 390px 上每个只剩 ~57px，「取消全选」直接折行。 */
  bar.innerHTML =
    '<div class="row" style="gap:8px;margin-bottom:8px">' +
      '<button class="btn" id="btnCronAll" style="flex:1;padding:9px 4px">' +
        (allOn ? '取消全选' : '全选') + '</button>' +
      '<button class="btn pri" data-cbatch="run" style="flex:1;padding:9px 4px">运行</button>' +
      '<button class="btn" data-cbatch="stop" style="flex:1;padding:9px 4px">停止</button>' +
    '</div>' +
    '<div class="row" style="gap:8px">' +
      '<button class="btn" data-cbatch="enable" style="flex:1;padding:9px 4px">启用</button>' +
      '<button class="btn" data-cbatch="disable" style="flex:1;padding:9px 4px">禁用</button>' +
      '<button class="btn danger" data-cbatch="delete" style="flex:1;padding:9px 4px">删除</button>' +
      '<span class="f11 t3" style="white-space:nowrap">已选 ' + n + '</span>' +
    '</div>';
}

/* ---------- 任务详情 ---------- */
var detailTimer = null;

async function openCron(id) {
  id = Number(id);
  var t = S.crons.list.filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  S.detailId = id;
  /* 换任务就把上一份的筛选清掉 —— 上一个任务开着「只看错误」，
     新任务的日志一进来就只剩几行，看着像日志是空的。 */
  S.cronlog = { lines: [], errN: 0, onlyErr: false, q: '', painted: false };
  openSheet(t.name || '未命名任务', '<div class="center"><span class="spin"></span>加载中…</div>');
  renderCronDetail(t);
  loadCronLog(id, false);
  startDetailPolling(id);
}

/* ================= 任务详情 → 脚本 / 日志 的直达 =================
   面板网页版的任务详情里，「脚本」「最新日志」「日志历史」三行都能点进去。
   手机上尤其值：从任务详情去脚本要过「底栏 → 脚本 → 目录 → 文件」，
   去日志更绕（「底栏 → 我的 → 日志文件 → 目录 → 文件」）。 */

/* 从执行命令里抠出脚本路径。
   青龙的任务命令就那几种写法：`task <路径>` / `node <路径>` / `python3 <路径>` /
   `bash <路径>`，路径是**相对面板脚本目录**的（子目录就是 `a/b/c.py`）。
   抠不出来（比如直接跑一段 shell）就返回空串 —— 那一行干脆不显示，
   宁可不显示，也别给一个点了没反应的入口。 */
function scriptPathOf(cmd) {
  var s = String(cmd == null ? '' : cmd).trim();
  if (!s) return '';
  var m = s.match(/^(?:task|node|python3?|bash|sh|ts-node)\s+([^\s;&|]+)/i);
  if (!m) return '';
  var p = m[1].replace(/^["']|["']$/g, '');
  /* 有的命令写的是容器内绝对路径，剥掉脚本目录前缀就还是相对路径 */
  p = p.replace(/^\/ql\/(?:scripts|data\/scripts)\//, '');
  /* 以 - 开头的是参数不是路径；剩下的绝对路径 / URL 一律不认 */
  if (!p || p.charAt(0) === '-' || p.charAt(0) === '/' || /^https?:/i.test(p)) return '';
  return p;
}

/* 抠出来的是完整相对路径，可手机上 390px 根本显示不下
   （`lcmovie_YYB-GO-Script-i_main/wx-script/miqd.py` 一行塞不进），
   而用户最想看的恰恰是**文件名**。所以显示时只留最后两段：`…/wx-script/miqd.py`。
   **只影响显示** —— data-goscript 属性里永远是完整路径，跳转不受影响。 */
function shortPath(p, keep) {
  var parts = String(p == null ? '' : p).split('/').filter(function (x) { return x; });
  keep = keep || 2;
  if (parts.length <= keep) return parts.join('/');
  return '…/' + parts.slice(-keep).join('/');
}

/* 日志树单独拉一份，**不动 S.logs.path**。
   直接调 loadLogs() 会把日志页重置回根目录 —— 用户只是看了一眼任务详情，
   回头进日志页发现位置没了，很莫名。 */
async function ensureLogTree() {
  if (S.logs.tree.length) return;
  try { var r = await api('/api/logs'); S.logs.tree = r.data || []; } catch (e) { /* 拉不到就是没有 */ }
}
function cronById(id) {
  return S.crons.list.filter(function (x) { return x.id === Number(id); })[0] || null;
}
/* 这个任务的日志目录名。面板写日志的目录就是任务的 log_name；
   没设 log_name 时面板拿任务 id 当目录名，所以两个都试。 */
function logDirCandidates(t) {
  var out = [];
  if (t && t.log_name) out.push(String(t.log_name));
  if (t && t.id != null) out.push(String(t.id));
  return out;
}
/* 在日志树里找这个任务的日志目录节点。名字可能重名（两个任务用同一个 log_name），
   那就按「先 log_name 再 id」的顺序取第一个命中的 —— 和面板的行为一致。 */
function findLogDir(t) {
  var cands = logDirCandidates(t);
  var all = flattenLogs(S.logs.tree);
  for (var c = 0; c < cands.length; c++) {
    for (var i = 0; i < all.length; i++) {
      if (all[i].type === 'directory' && String(all[i].title) === cands[c]) return all[i];
    }
  }
  return null;
}
/* 目录里最新的那个日志文件。
   文件名形如 `2026-09-18-20-15-01-118.log` —— **字典序就是时间序**，
   直接比字符串取最大的那个，比解析日期可靠（不同版本格式还不一样）。 */
function newestLogFile(dirNode) {
  var files = (dirNode && dirNode.children) || [];
  var best = null;
  for (var i = 0; i < files.length; i++) {
    if (files[i].type === 'directory') continue;
    if (!best || String(files[i].title) > String(best.title)) best = files[i];
  }
  return best;
}
/* 详情里「最新日志」那行右侧显示什么。
   **要分清「还没拉」和「拉了但没有」**：
     · 日志树还没拉过 → 「查看最新一条」（拉完就地换成真名，见 renderCronDetail 末尾）；
     · 拉过了、这个任务确实没有日志目录 → 「暂无日志」。
   两种情况都给同一句话的话，一个从没跑过的任务会一直显示「查看最新一条」，
   点进去弹「还没有日志」—— 用户白点一次。 */
function logNewHint(t) {
  if (!S.logs.tree.length) return '查看最新一条';
  var f = newestLogFile(findLogDir(t));
  return f ? String(f.title) : '暂无日志';
}
/* 跳到脚本页并打开这个文件。full 是相对面板脚本目录的路径（可能带子目录）。 */
async function gotoScript(full) {
  var parts = String(full || '').split('/').filter(function (x) { return x; });
  if (!parts.length) return;
  var file = parts.pop();
  var dir = parts.join('/');
  /* 先记下从哪个任务跳出来的：closeSheet 会把 S.detailId 清掉，
     清掉之后就再也想不起「用户刚才在看哪个任务」了。 */
  var from = S.detailId;
  closeSheet();
  S.backTo = from;
  /* 先摆好目标目录再切页：setTab 会顺手 refresh，带着对的 path 去拉才不会
     先渲染一次根目录再跳。 */
  S.scripts.path = parts.slice();
  setTab('scripts');
  await loadScripts(parts, true);
  var node = findScriptNode(dir, file);
  if (node) { openScriptEditor(node, dir); return; }
  /* 文件不在（订阅还没更新 / 面板上被改名或删了）：**退一步停在它该在的目录**，
     把沿路的目录都展开。用户至少能看到那个目录里有什么，比弹一句
     「没找到」然后什么都不发生有用得多。 */
  if (parts.length) {
    var acc = [];
    parts.forEach(function (p) {
      acc.push(p);
      S.scripts.expanded[acc.join('/')] = 1;
    });
    renderScripts();
    toast('没找到 ' + shortPath(full, 1) + '，已打开所在目录', true);
  } else {
    toast('脚本树里没找到 ' + file, true);
  }
}
/* 打开这个任务最新的一条日志。 */
async function openCronLog(t) {
  if (!t) return;
  var from = S.detailId;
  closeSheet();
  S.backTo = from;
  await ensureLogTree();
  var f = newestLogFile(findLogDir(t));
  if (!f) { toast('这个任务还没有日志', true); return; }
  await openLogFile(f);
}
/* 跳到日志页，并停在这个任务的日志目录里。 */
async function gotoCronLogDir(t) {
  if (!t) return;
  var from = S.detailId;
  closeSheet();
  S.backTo = from;
  await ensureLogTree();
  var dir = findLogDir(t);
  setTab('logs');
  await loadLogs(dir ? logKeyPath(dir.key) : [], false);
}

function renderCronDetail(t) {
  var s = statusOf(t);
  var next = nextRunText(t.schedule);
  var h = '';

  h += '<div class="card" style="padding:14px">';
  h += '<div class="row"><div class="nm sp" style="font-size:calc(17px*var(--fs))">' + esc(t.name || '未命名任务') + '</div><span id="cdPill">' + pill(s) + '</span></div>';
  if ((t.labels || []).length) {
    h += '<div class="tags">' + t.labels.map(function (l) { return '<span class="tag">' + esc(l) + '</span>'; }).join('') + '</div>';
  }
  h += '</div>';

  h += '<div class="secttl">调度</div><div class="card">';
  h += kv('定时规则', t.schedule || '—');
  if (next) h += kv('下次执行', next);
  /* 这两个字段的单位都跟字段名给人的直觉相反，详见 cronMs / fmtDur 的注释。
     last_execution_time 是秒级时间戳（要 ×1000）；
     last_running_time 是「运行了多久」的秒数，不是时间点，只能当时长格式化。 */
  h += kv('上次执行', fmtRel(cronMs(t.last_execution_time)));
  if (t.last_running_time > 0) h += kv('上次运行', fmtDur(t.last_running_time));
  /* 「本次已运行」：任务在跑的时候最想知道的就是「跑了多久了」（好跟上面那行
     「上次运行 4 分 57 秒」比一比，看是不是卡住了）。常驻 DOM，由 paintCronState
     按状态显隐 + 更新数字 —— 开始/结束时不用重渲染整张详情
     （轮询里重渲染会闪，AA17 那条断言就是钉这个的）。
     首次渲染就按当前状态摆好，别等 3 秒后的第一次轮询才出现。 */
  var running = t.status === 0;
  h += '<div class="kv" id="cdSinceRow"' + (running ? '' : ' style="display:none"') + '>' +
    '<div class="k">本次已运行</div><div class="v" id="cdSince">' +
    (running ? esc(fmtDur(cronElapsed(t))) : '—') + '</div></div>';
  if (isBusy(t) && t.pid) h += kv('进程号', t.pid);
  h += '</div>';

  h += '<div class="secttl">执行命令</div>';
  h += '<div class="code">' + esc(t.command || '') + '</div>';

  /* 「脚本 / 最新日志 / 日志历史」三行可点直达（照面板网页版的任务详情）。
     手机上这三跳能省一大截：脚本要过「底栏 → 脚本 → 目录 → 文件」，
     日志更绕（「底栏 → 我的 → 日志文件 → 目录 → 文件」）。 */
  var sp = scriptPathOf(t.command);
  if (sp) {
    h += '<div class="secttl">脚本</div><div class="card">' +
      '<button class="kvrow" data-goscript="' + esc(sp) + '">' +
        '<span class="k" style="flex:0 0 56px">脚本</span>' +
        '<span class="v ell">' + esc(shortPath(sp)) + '</span><span class="t3">›</span>' +
      '</button></div>';
  }
  h += '<div class="secttl">日志</div><div class="card">' +
    '<button class="kvrow" id="cdLogNew" data-gocronlog="' + t.id + '">' +
      '<span class="k" style="flex:0 0 56px">最新日志</span>' +
      '<span class="v ell" id="cdLogNewV">' + esc(logNewHint(t)) + '</span><span class="t3">›</span>' +
    '</button>' +
    '<button class="kvrow" id="cdLogHis" data-gocronlogdir="' + t.id + '">' +
      '<span class="k" style="flex:0 0 56px">日志历史</span>' +
      '<span class="v ell">' + esc(t.log_name || ('任务 ' + t.id)) + '</span><span class="t3">›</span>' +
    '</button></div>';

  h += '<div class="secttl">操作</div>';
  h += '<div class="row" style="gap:8px;flex-wrap:wrap">';
  h += '<button class="btn ' + (isBusy(t) ? '' : 'pri') + '" id="cdAct" data-dact="' + (isBusy(t) ? 'stop' : 'run') + '" data-id="' + t.id + '">' + (isBusy(t) ? '停止' : '立即运行') + '</button>';
  h += '<button class="btn" data-dact="' + (t.isDisabled === 1 ? 'enable' : 'disable') + '" data-id="' + t.id + '">' + (t.isDisabled === 1 ? '启用' : '禁用') + '</button>';
  h += '<button class="btn" data-dact="' + (t.isPinned === 1 ? 'unpin' : 'pin') + '" data-id="' + t.id + '">' + (t.isPinned === 1 ? '取消置顶' : '置顶') + '</button>';
  h += '<button class="btn" data-edit="' + t.id + '">编辑</button>';
  h += '<button class="btn" data-copycmd="' + t.id + '">复制命令</button>';
  h += '<button class="btn danger" data-del="' + t.id + '">删除</button>';
  h += '</div>';

  h += '<div class="secttl">运行日志 <span class="t3" id="logStat" style="font-weight:400;text-transform:none"></span></div>';
  h += '<div class="row" style="margin-bottom:8px;gap:8px">';
  h += '<button class="btn" id="btnLogReload" style="padding:8px 12px">刷新日志</button>';
  h += '<label class="btn" style="padding:8px 12px"><input type="checkbox" id="autoLog" checked style="width:auto;margin-right:6px">自动刷新</label>';
  h += '<button class="btn" id="btnLogCopy" style="padding:8px 12px">复制</button>';
  h += '</div>';
  /* 跑失败之后这一屏就是几千行，靠肉眼扫不现实 —— 和日志文件弹层用同一套筛选。
     「只看错误」按钮先藏起来（这时日志还没到，不知道有没有错误行），
     由 paintCronLog 按 errN 决定露不露脸，跟弹层的行为保持一致。 */
  h += '<div class="searchbar" style="margin-bottom:8px;display:flex;gap:8px;align-items:center">' +
    '<input id="cronLogFind" type="search" placeholder="在这份运行日志里搜关键字" style="flex:1">' +
    '<button class="btn" id="btnCronLogErr" style="display:none;padding:6px 10px;font-size:calc(12px*var(--fs));flex:0 0 auto">只看错误</button>' +
    '</div>';
  h += '<div class="logbox" id="logBox">加载中…</div>';
  h += '<div class="f11 t3" id="cronLogMeta" style="margin:8px 4px;line-height:1.6"></div>';

  h += '<div class="secttl">其他</div><div class="card">';
  h += kv('任务 ID', t.id);
  h += kv('日志名', t.log_name || '默认');
  if (t.work_dir) h += kv('工作目录', t.work_dir);
  if (t.task_before) h += kv('前置脚本', t.task_before);
  if (t.task_after) h += kv('后置脚本', t.task_after);
  h += kv('多实例', t.allow_multiple_instances === 1 ? '允许' : '不允许');
  h += '</div>';

  $('#shB').innerHTML = h;

  /* 运行日志的搜索框是这次刚建出来的，input 事件委托不到，就地挂一次。
     详情页的 HTML 每次打开只渲染一遍（轮询只改徽标和按钮，见 paintCronState），
     所以挂一次就够。 */
  var cfin = $('#cronLogFind');
  if (cfin) cfin.addEventListener('input', function () {
    S.cronlog.q = cfin.value.trim();
    paintCronLog();
  });

  /* 「最新日志」那行先把文件名补上。日志树没拉过就拉一次（**不 await**，
     详情页要立刻能看），回来只改那一个 span，不重渲染整张详情。
     顺手挡一道 S.detailId：等回来时用户可能已经关掉或换到别的任务了。 */
  if (!S.logs.tree.length) {
    ensureLogTree().then(function () {
      var v = $('#cdLogNewV');
      if (v && S.detailId === t.id) v.textContent = logNewHint(t);
    });
  }
}

function kv(k, v) {
  return '<div class="kv"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>';
}

/* 「自动贴到底」但**只在用户本来就贴着底部时** —— 任务在跑、自动刷新开着的时候，
   你往上翻两屏看前面的报错，每 3 秒被拽回底部一次，根本没法读。
   （阈值 48px 是给「就差一点点」留的余量：手指滚不到绝对底部。）
   注意 scrollHeight 和 scrollTop 都是取整过的，别指望它们能精确相等。 */
function atBottom(el) {
  return el.scrollHeight - el.scrollTop - (el.clientHeight || 0) < 48;
}
function stickBottom(el) {
  if (atBottom(el)) el.scrollTop = el.scrollHeight;
}

/* 「贴新端」的方向取决于哪个日志框：#logBox（详情页运行日志）**倒序**（最新在上）→ 贴顶；
   #logPre（日志文件弹层）**正序**（最新在下）→ 贴底。两边共用同一个 #btnLogTail /
   syncLogTail / jumpLogTail，所以「在不在最新端」和「跳到最新」都要分两边判断。
   1.0.26 把详情页改成倒序后这里必须分清楚 —— 否则详情页也会被「跳到最新」拽到
   底部（旧日志末尾），跟「最新在上面」自相矛盾。 */
function isAtNewest(box) {
  if (!box) return false;
  return box.id === 'logBox' ? box.scrollTop < 48 : atBottom(box);
}
function jumpNewest(box) {
  if (!box) return;
  box.scrollTop = box.id === 'logBox' ? 0 : box.scrollHeight;
}

/* ---------- 「跳到最新」 ----------
   1.0.21 把「自动贴底」改成「只在本来就贴着底时才贴」之后，往上翻看报错就
   **停在那儿了** —— 想回到最新那几行只能自己一路滑到底，几千行时很难滑准。
   这个按钮补上那一步：只要已经不在底部就浮出来，点一下回到最新。
   （放在日志框上方的工具条里不行：日志框有 70vh 高，翻到中间时工具条早滚出屏幕了，
   按钮等于不存在 —— 所以做成页面级 fixed 的悬浮按钮。）

   该作用于哪个框：详情页的运行日志是 #logBox，日志文件弹层是 #logPre。
   两者都是弹层里的，而 #shB 的内容在关掉弹层后**不会清空** —— 所以判断「弹层开着」
   必须看 #sheet 的 on 类，不能只看元素在不在。 */
function activeLogBox() {
  var sh = $('#sheet');
  if (!sh || !sh.classList.contains('on')) return null;
  return $('#logPre') || $('#logBox');
}

/* 把按钮的显隐同步到当前日志框的滚动位置。内容比框还短时 scrollHeight 和
   clientHeight 相等，atBottom 会算成「在底部」→ 按钮不出现（本来也不需要）。 */
function syncLogTail() {
  var btn = $('#btnLogTail');
  if (!btn) return;
  var box = activeLogBox();
  btn.classList.toggle('hidden', !box || isAtNewest(box));
}

/* 滚监听只挂一次（同一个元素）。用模块级变量记而不是 dataset：
   日志框是弹层里 innerHTML 换出来的，dataset 在 DOM 桩里不一定有。 */
var tailBoundEl = null;
function bindLogTailScroll(box) {
  if (!box || box === tailBoundEl) return;
  tailBoundEl = box;
  if (box.addEventListener) box.addEventListener('scroll', syncLogTail);
}

function jumpLogTail() {
  var box = activeLogBox();
  jumpNewest(box);
  syncLogTail();
}

/* 重画详情页的运行日志框。切「只看错误」、改搜索词、刷新回来都走这里 ——
   一处渲染，三处调用，不会出现「框里 3 行、复制出来 5 行」这种对不上的事。
   这里的日志**不带行号**，除非开了筛选（那才需要行号定位）。 */
function paintCronLog() {
  var box = $('#logBox');
  if (!box) return;
  var cl = S.cronlog;
  /* **贴新端判断必须在换 innerHTML 之前做**：换完之后浏览器会把 scrollTop
     重置成 0，那时候再算「本来就贴着新端吗」永远算不成立，新日志就不跟了。
     而且第一次画要**直接跳到新端** —— 任务在跑，用户要看的是最新那几行；
     只有「已经画过内容、且用户往**新端的反方向**翻了」才该原地不动。
     1.0.26 改成倒序后新端在顶（scrollTop = 0），所以这里判断的是「在不在顶」。 */
  var stick = !cl.painted || box.scrollTop < 48;
  box.innerHTML = cl.lines.length ? logBoxHtml(cl.lines, cl.onlyErr, cl.q) : '（日志为空）';
  cl.painted = true;
  /* 搜索时滚到**第一条匹配**（倒序后就是最新那条匹配） */
  if (cl.q) box.scrollTop = 0;
  else if (stick) box.scrollTop = 0;
  var eb = $('#btnCronLogErr');
  if (eb) {
    /* 一行错都没有就不给按钮（点了只会看到空框），跟日志文件弹层一致 */
    eb.style.display = cl.errN ? '' : 'none';
    eb.textContent = cl.onlyErr ? '看全部' : '只看错误';
  }
  var cp = $('#btnLogCopy');
  if (cp) cp.textContent = cl.q ? '复制匹配行' : (cl.onlyErr ? '复制错误行' : '复制');
  var mt = $('#cronLogMeta');
  if (mt) {
    var n = logPick(cl.lines, cl.onlyErr, cl.q).length;
    if (cl.onlyErr || cl.q) mt.textContent = '筛出 ' + n + ' 行（共 ' + cl.lines.length + ' 行）';
    else if (cl.lines.length) mt.textContent = '共 ' + cl.lines.length + ' 行' + (cl.errN ? ' · 错误 ' + cl.errN : '');
    else mt.textContent = '';
  }
  /* 重画之后滚动位置刚被上面改过，按钮的显隐要跟着重算（自动刷新是 3 秒一次，
     不重算的话「跳到最新」会一直停在上一轮的状态）。 */
  bindLogTailScroll(box);
  syncLogTail();
}

/* 详情页的运行日志也按级别上色：跑起来的时候红行（error）能一眼看到，
   不用在一整屏灰字里扒。要行号 / 只看错误 / 搜关键字，这页现在都有了；
   想看历史那几次的运行日志，走「日志历史」进日志文件弹层。 */
async function loadCronLog(id, silent) {
  var box = $('#logBox');
  if (!box) return;
  if (!silent) box.textContent = '加载中…';
  try {
    var r = await api('/api/crons/' + id + '/log');
    var txt = stripAnsi(r.data || '');
    var lines = txt ? txt.split('\n') : [];
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    /* 1.0.26：详情页日志**倒序**渲染（最新在上面）。报错总在末尾，倒过来一眼就能看到；
       「只看错误」打开时错误全在顶，「跳到最新」也跟着改成贴顶。
       反转之后再算 errN（数量跟顺序无关，但放在反转前/后逻辑都一样，写在前面更顺）。 */
    lines.reverse();
    /* onlyErr / q **保留**：开着「只看错误」按刷新，结果又被塞回全部，
       那个开关就白点了。lines 和 errN 换新。 */
    S.cronlog = {
      lines: lines, errN: logErrLines(lines).length,
      onlyErr: S.cronlog.onlyErr, q: S.cronlog.q,
      /* painted 也要留着：新日志回来时得知道「之前已经画过内容了」，
         否则每一轮轮询都会被当成「第一次」，用户翻下去读历史又被拽回顶部。 */
      painted: S.cronlog.painted
    };
    paintCronLog();
    var st = $('#logStat');
    if (st) {
      var map = { running: '运行中', completed: '已完成', ignored: '已忽略日志', empty: '暂无日志', notFound: '日志不存在' };
      st.textContent = map[r.logStatus] ? '· ' + map[r.logStatus] : '';
    }
  } catch (e) {
    if (!silent) box.textContent = '读取失败：' + e.message;
  }
}

/* 详情页头部那两处「会变」的东西：状态徽标 + 主操作按钮。
   **只改这两处，不重渲染整张详情** —— 整张重渲染会把运行日志区清空，
   还会把「自动刷新」的勾选状态和滚动位置一起丢掉，每 3 秒闪一次没法用。
   所以徽标和主按钮在 renderCronDetail 里都留了 id（cdPill / cdAct）。 */
function paintCronState(t) {
  if (!t) return;
  var p = $('#cdPill');
  if (p) p.innerHTML = pill(statusOf(t));
  /* 「本次已运行」：**只有 status === 0（运行中）才算** —— 排队中（3）的时候
     last_execution_time 还是上一次跑的时间，算出来会是「十几小时」。
     行是常驻的（renderCronDetail 里默认 display:none），这里只切显隐 + 填数字，
     不重建 DOM：轮询每 3 秒跑一次，重建会把用户的滚动位置和文字选中弄没。 */
  var sr = $('#cdSinceRow');
  if (sr) {
    var running = t.status === 0;
    sr.style.display = running ? '' : 'none';
    var sv = $('#cdSince');
    if (sv) sv.textContent = running ? fmtDur(cronElapsed(t)) : '—';
  }
  var b = $('#cdAct');
  if (!b) return;
  var busy = isBusy(t);
  /* 文案和 data-dact **一起换**：事件委托是点的时候读 dataset 的，
     只换文案不换 dataset 的话，按钮写着「停止」点下去却在「立即运行」。 */
  b.textContent = busy ? '停止' : '立即运行';
  b.dataset.dact = busy ? 'stop' : 'run';
  b.className = 'btn' + (busy ? '' : ' pri');
}

function startDetailPolling(id) {
  stopDetailPolling();
  detailTimer = setInterval(async function () {
    try {
      var r = await api('/api/crons/' + id);
      var fresh = r.data;
      /* 等回来时用户可能已经关掉详情、或者换到别的任务了 —— 别去改别人的界面 */
      if (!fresh || S.detailId !== id) return;
      var old = S.crons.list.filter(function (x) { return x.id === id; })[0];
      if (old) Object.assign(old, fresh);
      /* 状态**不看「自动刷新」的勾选**：那个勾选只管日志正文要不要跟着滚。
         以前它把状态轮询一起关掉了 —— 取消勾选后任务跑完了，
         按钮还写着「立即运行」，看着像压根没跑起来。 */
      paintCronState(fresh);
      var auto = $('#autoLog');
      if (auto && auto.checked && isBusy(fresh)) await loadCronLog(id, true);

  }, 3000);
}

async function saveCron(id) {

/* ================= 环境变量 ================= */
/* ---------- 环境变量标签 ---------- */
/* 青龙从 v2.21 起 env 有 labels: string[] 字段（back/data/env.ts），
   还有 POST/DELETE /api/envs/labels 可以批量加删。这里只做「显示 + 筛选 + 编辑」，
   批量加删标签先不做 —— 手机上多选操作体验不好。 */

/* 标签色号：按名字算 hash 取模。同名一定同色，不需要维护映射表。 */
function tagCls(name) {
  var s = String(name == null ? '' : name), h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100003;
  return 'tg' + (h % 8);
}
function tagHtml(name) {
  var t = String(name == null ? '' : name).trim();
  if (!t) return '';
  return '<span class="tag ' + tagCls(t) + '">' + esc(t) + '</span>';
}
/* 一条变量上的标签。后端可能给 null / 非数组 / 带空串，都要能扛住。 */
function envLabels(v) {
  var ls = v && v.labels;
  if (!Array.isArray(ls)) return [];
  return ls.map(function (l) { return String(l == null ? '' : l).trim(); })
    .filter(function (l) { return l; });
}
/* 当前列表里出现过的所有标签，去重 + 按出现次数从多到少 */
function envAllTags() {
  var cnt = {};
  S.envs.list.forEach(function (v) {
    envLabels(v).forEach(function (l) { cnt[l] = (cnt[l] || 0) + 1; });
  });
  return Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; });
}

function envRow(v) {
  var on = v.status !== 1;
  var ls = envLabels(v);
  var editing = !!S.envs.edit;
  var picked = editing && !!S.envs.sel[v.id];
  return '<div class="item' + (picked ? ' on' : '') + '" data-env="' + v.id + '">' +
    '<div class="row">' +
      (editing ? '<span class="ckb">✓</span>' : '') +
      '<div class="nm sp mono" style="font-size:calc(14px*var(--fs))">' + logHi(v.name, S.envs.q) + '</div>' +
      (v.isPinned ? '<span class="pill blue">置顶</span>' : '') +
      '<span class="pill ' + (on ? 'green' : 'gray') + '">' + (on ? '已启用' : '已禁用') + '</span></div>' +
    /* 标签行：flex-wrap 是必须的 —— 标签数量和长度都不可控，不换行会撑出屏幕。
       这里**绝不能**再出现第二个 style 属性（第二个会被解析器丢掉，正好丢掉 flex-wrap）。 */
    (ls.length ? '<div class="row" style="flex-wrap:wrap;gap:5px;margin-top:7px">' +
      ls.map(tagHtml).join('') + '</div>' : '') +
    /* 值那行右边挂一个「复制」：手机上要把 cookie 抠出来只能长按选中再拖手柄，
       两三百个字符根本抠不动 —— 一键复制才是正道。
       值本身打码时是短的，所以仍然用 .ell 单行；点「显示值」后由 onclick 加上
       .full 换成换行完整显示（见 .envval.full）。 */
    '<div class="row" style="margin-top:6px;gap:8px">' +
      '<div class="f11 t2 mono ell envval sp" data-val="' + v.id + '">' + esc(maskValue(v.value)) + '</div>' +
      '<button class="cpb" data-eact="copy" data-id="' + v.id + '">复制</button>' +
    '</div>' +
    (v.remarks ? '<div class="f11 t3" style="margin-top:5px">' + esc(v.remarks) + '</div>' : '') +
    /* 编辑模式下整行是勾选用的，行内按钮全部收起来 —— 留着的话点哪都像要执行那个动作 */
    (editing ? '' :
    '<div class="row" style="margin-top:10px;gap:8px">' +
      '<button class="btn" style="flex:1;padding:8px" data-eact="reveal" data-id="' + v.id + '">显示值</button>' +
      '<button class="btn" style="flex:1;padding:8px" data-eact="edit" data-id="' + v.id + '">编辑</button>' +
      '<button class="btn" style="flex:1;padding:8px" data-eact="' + (on ? 'disable' : 'enable') + '" data-id="' + v.id + '">' + (on ? '禁用' : '启用') + '</button>' +
    '</div>') +
  '</div>';
}

/* 变量页当前筛出来的那些（标签筛选之后的）。批量「全选」只作用于它们 ——
   筛了「京东」再点全选，用户想处理的就是这些。 */
function envFiltered() {
  var e = S.envs;
  if (!e.tag) return e.list;
  return e.list.filter(function (v) { return envLabels(v).indexOf(e.tag) >= 0; });
}

function renderEnvs() {
  var e = S.envs;
  $('#sub').textContent = e.list.length ? ('共 ' + e.list.length + ' 个变量') : '';

  /* 标签筛选条：只列当前列表里真的出现过的标签。
     一个标签都没有时整条藏起来，不占位置。 */
  var tags = envAllTags();
  var bar = $('#envTagBar');
  if (tags.length) {
    var bh = '<button data-envtag="__all" class="' + (e.tag ? '' : 'on') + '">全部</button>';
    tags.forEach(function (l) {
      bh += '<button data-envtag="' + esc(l) + '" class="' + (e.tag === l ? 'on' : '') + '">' + esc(l) + '</button>';
    });
    bar.innerHTML = bh;
    bar.classList.remove('hidden');
  } else {
    /* 标签全没了（比如刚删完）要把筛选也一起清掉，否则会卡在一个不存在的筛选上 */
    e.tag = '';
    bar.innerHTML = '';
    bar.classList.add('hidden');
  }

  var list = envFiltered();

  var box = $('#envList');
  if (e.loading && !e.list.length) {
    box.innerHTML = '<div class="center"><span class="spin"></span>加载中…</div>';
    renderEnvEditBar();
    return;
  }
  if (!list.length) {
    box.innerHTML = '<div class="empty"><span class="ei">⚿</span>' +
      (e.tag ? '「' + esc(e.tag) + '」标签下没有变量' : (e.q ? '没有匹配的变量' : '还没有环境变量')) + '</div>';
    renderEnvEditBar();
    return;
  }
  box.innerHTML = list.map(envRow).join('');
  /* 列表重画完再摆操作栏：勾选数、全选/取消全选 的文案都依赖这一份列表 */
  renderEnvEditBar();
}

async function loadEnvs() {
  var e = S.envs;
  if (e.loading) return;
  e.loading = true;
  renderEnvs();
  try {
    var r = await api('/api/envs', { query: { searchValue: e.q } });
    e.list = r.data || [];
  } catch (err) {
    toast(err.message, true);
    e.list = [];
  } finally {
    e.loading = false;
    renderEnvs();
  }
}

/* ---------- 变量页批量编辑（左上角「编辑」） ----------
   和任务页那套是一模一样的交互（全选 / 批量动作 / 两行操作栏 / 离开页面自动退出），
   只是动作换成了变量的三个：启用 / 禁用 / 删除。
   京东 cookie 一堆账号的时候，逐个点行内按钮太慢，而且换 cookie 时
   「把过期的那几个删掉」是常规操作。 */

function toggleEnvEdit(on) {
  S.envs.edit = (on == null ? !S.envs.edit : !!on);
  if (!S.envs.edit) S.envs.sel = {};
  var b = $('#btnEnvEdit');
  if (b) b.textContent = S.envs.edit ? '完成' : '编辑';
  renderEnvs();
}

function envSelCount() {
  var n = 0;
  for (var k in S.envs.sel) { if (S.envs.sel[k]) n++; }
  return n;
}

function envSelIds() {
  var out = [];
  for (var k in S.envs.sel) { if (S.envs.sel[k]) out.push(Number(k)); }
  return out;
}

function toggleEnvSel(id) {
  if (S.envs.sel[id]) delete S.envs.sel[id];
  else S.envs.sel[id] = true;
  renderEnvs();
}

/* 全选 / 取消全选。只作用于**当前筛出来的那些**（标签筛选之后的）。 */
function envSelectAll(on) {
  if (on) envFiltered().forEach(function (v) { S.envs.sel[v.id] = true; });
  else S.envs.sel = {};
  renderEnvs();
}

/* 批量动作。接口跟单个的一样，body 传一组 id（青龙的 /api/envs/* 就是这个形状，
   单个操作时也是传 [id]）。 */
async function envBatch(act) {
  var ids = envSelIds();
  if (!ids.length) { toast('先选几个变量', true); return; }
  if (act === 'delete' && !confirm('删除选中的 ' + ids.length + ' 个变量？删除后不可恢复。')) return;
  var label = '';
  try {
    if (act === 'enable') { label = '已启用'; await api('/api/envs/enable', { method: 'PUT', body: ids }); }
    else if (act === 'disable') { label = '已禁用'; await api('/api/envs/disable', { method: 'PUT', body: ids }); }
    else if (act === 'delete') { label = '已删除'; await api('/api/envs', { method: 'DELETE', body: ids }); }
    else return;
    batchDone(label, ids);
    toggleEnvEdit(false);
    await loadEnvs();
  } catch (e) { toast(e.message, true); }
}

function renderEnvEditBar() {
  var on = !!S.envs.edit;
  if (!openEditShell('#envEditBar', on, 'envsedit')) return;
  var bar = $('#envEditBar');
  var n = envSelCount();
  var allOn = n > 0 && n === envFiltered().length;
  /* 两行，和任务页的批量栏同一个排布逻辑：上行「全选 + 状态」，下行「删除 + 计数」。
     一行塞 4 个按钮 + 计数在 390px 上会把「取消全选」挤到折行。 */
  bar.innerHTML =
    '<div class="row" style="gap:8px;margin-bottom:8px">' +
      '<button class="btn" id="btnEnvAll" style="flex:1;padding:9px 4px">' +
        (allOn ? '取消全选' : '全选') + '</button>' +
      '<button class="btn" data-ebatch="enable" style="flex:1;padding:9px 4px">启用</button>' +
      '<button class="btn" data-ebatch="disable" style="flex:1;padding:9px 4px">禁用</button>' +
    '</div>' +
    '<div class="row" style="gap:8px">' +
      '<button class="btn danger" data-ebatch="delete" style="flex:1;padding:9px 4px">删除</button>' +
      '<span class="f11 t3" style="white-space:nowrap">已选 ' + n + '</span>' +
    '</div>';
}

function openEnvEdit(id) {
  if (id) id = Number(id);
  var v = id ? S.envs.list.filter(function (x) { return x.id === id; })[0] : null;
  var h = '';
  h += '<div class="card" style="padding:4px 14px">';
  h += '<div style="padding:9px 0"><input id="vName" class="mono" placeholder="变量名，如 JD_COOKIE" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(v ? v.name : '') + '"' + (v ? ' readonly style="opacity:.6"' : '') + '></div><div class="sep"></div>';
  h += '<div style="padding:9px 0"><textarea id="vValue" rows="5" class="mono" style="font-size:calc(13px*var(--fs));padding:9px 0;resize:vertical" placeholder="变量值" autocapitalize="off" autocorrect="off" spellcheck="false">' + esc(v ? v.value || '' : '') + '</textarea></div><div class="sep"></div>';
  h += '<div style="padding:9px 0"><input id="vRemarks" placeholder="备注（可选）" value="' + esc(v ? v.remarks || '' : '') + '"></div><div class="sep"></div>';
  /* 标签：用逗号分隔的纯文本输入。手机上没有好用的多选控件，
     而且标签是自由文本（后端只校验非空），输入框反而最省事。 */
  h += '<div style="padding:9px 0"><input id="vLabels" placeholder="标签，多个用逗号分隔（可选）" autocapitalize="off" autocorrect="off" value="' + esc(v ? envLabels(v).join(', ') : '') + '"></div>';
  h += '</div>';
  h += '<div class="f12 t3" style="margin:10px 4px">变量名规则：字母或下划线开头，只能包含字母、数字、下划线。' + (v ? '（编辑时变量名不可改）' : '') + '</div>';
  if (v && envLabels(v).length) {
    h += '<div class="row" style="flex-wrap:wrap;gap:5px;margin:0 4px 4px">' + envLabels(v).map(tagHtml).join('') + '</div>';
  }
  h += '<div style="margin-top:14px"><button class="btn pri" id="btnSaveEnv" style="width:100%" data-id="' + (v ? v.id : '') + '">保存</button></div>';
  if (v) h += '<div style="margin-top:10px"><button class="btn danger" id="btnDelEnv" style="width:100%" data-id="' + v.id + '">删除该变量</button></div>';
  openSheet(v ? '编辑变量' : '新建变量', h);
}

/* 逗号分隔的标签串 → 数组。中英文逗号都认（手机上中文输入法很容易打出「，」）。
   去重是必须的：后端的 Joi 只校验「非空」，重复标签会照存，
   界面上就会出现两个一模一样的 pill，看着像渲染出错。 */
function parseTags(s) {
  var out = [];
  String(s == null ? '' : s).split(/[,，]/).forEach(function (x) {
    x = x.trim();
    if (x && out.indexOf(x) < 0) out.push(x);
  });
  return out;
}

async function saveEnv(id) {
  var name = $('#vName').value.trim();
  var val = $('#vValue').value;
  var remarks = $('#vRemarks').value.trim();
  var labels = parseTags($('#vLabels') ? $('#vLabels').value : '');
  if (!name) return toast('变量名不能为空', true);
  if (!/^[a-zA-Z_][0-9a-zA-Z_]*$/.test(name)) return toast('变量名不符合规则', true);
  if (!val) return toast('变量值不能为空', true);

  var btn = $('#btnSaveEnv');
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    if (id) {
      await api('/api/envs', { method: 'PUT', body: { id: Number(id), name: name, value: val, remarks: remarks, labels: labels } });
    } else {
      await api('/api/envs', { method: 'POST', body: [{ name: name, value: val, remarks: remarks, labels: labels }] });
    }
    toast(id ? '变量已保存' : '变量已创建');
    closeSheet();
    loadEnvs();
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = '保存';
  }
}

/* ================= 日志文件 ================= */
function renderLogs() {
  var q = String(S.logs.q || '').trim();
  var ql = q.toLowerCase();
  /* 搜索态下没有「返回上一级」可言（结果是跨目录捞的），面包屑换成搜索词 + 命中数。 */
  if (ql) {
    $('#logCrumbs').innerHTML = '<span>搜索「' + esc(q) + '」</span>';
  } else {
    var crumbs = S.logs.path.length ? ('根目录 / ' + S.logs.path.join(' / ')) : '根目录';
    $('#logCrumbs').innerHTML = '<button id="logUp" style="color:var(--accent);font-weight:600">' +
      (S.logs.path.length ? '← 返回上一级' : '') + '</button>' +
      '<span style="margin-left:8px">' + esc(crumbs) + '</span>';
  }
  /* 放在这里而不是函数末尾：下面两个分支都是提前 return 的 */
  syncBack();

  var nodes = ql ? flattenLogs(S.logs.tree).filter(function (n) {
    return String(n.title == null ? '' : n.title).toLowerCase().indexOf(ql) >= 0;
  }) : sortLogNodes(currentLogNodes());

  var box = $('#logList');
  if (S.logs.loading && !S.logs.tree.length) {
    box.innerHTML = '<div class="center"><span class="spin"></span>加载中…</div>';
    return;
  }
  if (!nodes.length) {
    box.innerHTML = '<div class="empty"><span class="ei">▤</span>' +
      (ql ? '没有匹配「' + esc(q) + '」的日志' : '这里没有日志文件') + '</div>';
    return;
  }
  box.innerHTML = nodes.map(function (n) {
    var isDir = n.type === 'directory';
    var meta = [];
    if (!isDir && n.size != null) meta.push(fmtSize(n.size));
    var ft = fmtFileTime(n.createTime);
    if (ft) meta.push(ft);
    if (isDir) meta.push((n.children || []).length + ' 项');
    /* 搜索结果来自不同目录，光看文件名分不清是哪个脚本的 —— 补一行所在目录 */
    if (ql) {
      var dir = logKeyPath(n.key);
      dir.pop();
      if (dir.length) meta.push(dir[dir.length - 1] + '/');
    }
    return '<div class="item row" data-log="' + esc(n.key) + '" data-dir="' + (isDir ? '1' : '0') + '">' +
      '<div style="font-size:calc(16px*var(--fs));width:22px;text-align:center">' + (isDir ? '📁' : '📄') + '</div>' +
      '<div class="sp"><div style="font-size:calc(14px*var(--fs));font-weight:' + (isDir ? 600 : 400) + '" class="ell">' + esc(n.title) + '</div>' +
      '<div class="f11 t3">' + esc(meta.join(' · ')) + '</div></div>' +
      '<div class="t3">›</div></div>';
  }).join('');
}

function currentLogNodes() {
  var nodes = S.logs.tree;
  for (var i = 0; i < S.logs.path.length; i++) {
    var found = null;
    for (var j = 0; j < nodes.length; j++) if (nodes[j].key === S.logs.path[i]) { found = nodes[j]; break; }
    if (!found) return [];
    nodes = found.children || [];
  }
  return nodes;
}

/* 浏览日志目录时的排序：**文件按时间倒序（最新的在最上面）**。
   日志目录里几十个文件是常态，面板返回的是时间正序，最新的那个在最底下 ——
   手机上要滑很久才够得着，而「看最新那条」恰恰是最常见的动作。
   目录仍排在文件前面（按名字），否则要在一堆文件里翻子目录。
   文件名 `2026-09-18-20-15-01-118.log` 的**字典序就是时间序**，倒着排就是最新在前。
   搜索态不排序：搜索结果跨目录，保持面板给的相关性顺序更自然。 */
function sortLogNodes(nodes) {
  var dirs = [], files = [];
  (nodes || []).forEach(function (n) {
    (n && n.type === 'directory' ? dirs : files).push(n);
  });
  dirs.sort(function (a, b) { return String(a.title) < String(b.title) ? -1 : 1; });
  files.sort(function (a, b) { return String(a.title) > String(b.title) ? -1 : 1; });
  return dirs.concat(files);
}

/* 把详情页的「运行日志」区滚进视野。
   点了「立即运行」的人，下一步一定是看日志 —— 别让他自己往下找。
   老 WebView 上 scrollIntoView 可能不存在，挡一道（不该为这个报错）。 */
function scrollToCronLog() {
  var box = $('#logBox');
  if (box && box.scrollIntoView) box.scrollIntoView({ block: 'center' });
}

/* 退出搜索态。状态字和输入框**必须一起清** —— 只清状态的话框里还留着刚才的关键词，
   看着像还在搜，点进去却是目录浏览。 */
function clearLogSearch() {
  S.logs.q = '';
  var el = $('#logSearch');
  if (el) el.value = '';
}

/* 日志树里每个节点的 key 是「从根目录算起的完整相对路径」（a/b/c.log），
   所以点目录时要把它拆成逐级前缀 [a, a/b, a/b/c] 再交给 currentLogNodes 下钻。
   搜索结果可能来自任意层级，不能拿「当前路径」去拼 key —— 那会把
   搜索时的当前路径当成父目录拼上去，直接跳错层。 */
function logKeyPath(key) {
  var seg = String(key == null ? '' : key).split('/');
  var out = [];
  var cur = '';
  for (var i = 0; i < seg.length; i++) {
    if (!seg[i]) continue;
    cur = cur ? cur + '/' + seg[i] : seg[i];
    out.push(cur);
  }
  return out;
}
/* 整棵树摊平。搜索要跨目录，currentLogNodes() 只看当前一层，不够。 */
function flattenLogs(nodes, out) {
  out = out || [];
  (nodes || []).forEach(function (n) {
    out.push(n);
    if (n.children) flattenLogs(n.children, out);
  });
  return out;
}
/* 按 key 在整棵树里找节点（搜索结果点开时用）。 */
function findLogNode(key) {
  var hit = flattenLogs(S.logs.tree).filter(function (n) { return n.key === key; })[0];
  return hit || null;
}

async function loadLogs(path, force) {
  S.logs.path = path || [];
  if (force || !S.logs.tree.length) {
    S.logs.loading = true;
    renderLogs();
    try {
      var r = await api('/api/logs');
      S.logs.tree = r.data || [];
    } catch (e) {
      toast(e.message, true);
      S.logs.tree = [];
    } finally {
      S.logs.loading = false;
    }
  }
  renderLogs();
}

async function openLogFile(node) {
  openSheet(node.title, '<div class="center"><span class="spin"></span>加载中…</div>');
  var dir = node.key.split('/');
  dir.pop();
  try {
    var r = await api('/api/logs/detail', { query: { path: dir.join('/'), file: node.title } });
    var txt = stripAnsi(r.data || '');
    var lines = txt ? txt.split('\n') : [];
    /* 末尾换行会切出一个空串，去掉 —— 否则日志框底下永远多一行空白，
       「N 行」也会多算一行 */
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    var errN = logErrLines(lines).length;
    /* 存进 S：复制 / 只看错误这两个按钮走**全局事件委托**，拿不到闭包变量 */
    S.logfile = { lines: lines, txt: txt, onlyErr: false, q: '' };
    $('#shB').innerHTML =
      '<div class="row" style="margin:0 4px 8px;gap:8px;align-items:center">' +
        '<div class="f11 t3 sp">' + esc(fmtSize(node.size)) + ' · ' + lines.length + ' 行' +
          (errN ? ' · <span style="color:#ff8f8f">错误 ' + errN + '</span>' : '') + '</div>' +
        /* 一行错都没有就不给这个按钮 —— 点了只会看到空框，白让人点一次 */
        (errN ? '<button class="btn" id="btnLogErr" style="padding:6px 12px;font-size:calc(12px*var(--fs))">只看错误</button>' : '') +
      '</div>' +
      /* 几千行的日志靠肉眼扫找关键字是不现实的。只过滤**已经拉到本地**的这一份，
         不再打接口 —— 和「只看错误」同一个思路。 */
      '<div class="searchbar" style="margin:0 4px 8px;display:flex;gap:8px;align-items:center">' +
        '<input id="logFind" type="search" placeholder="在这份日志里搜关键字" style="flex:1">' +
        '<div class="f11 t3" id="logFindN" style="flex:0 0 auto"></div>' +
      '</div>' +
      '<pre class="logbox lg" id="logPre"></pre>' +
      '<div class="row" style="margin-top:12px;gap:8px">' +
        '<button class="btn" id="btnCopyLog" style="flex:1">复制内容</button>' +
        '<button class="btn danger" id="btnDelLog" style="flex:1" data-path="' + esc(dir.join('/')) + '" data-file="' + esc(node.title) + '">删除文件</button>' +
      '</div>';
    /* 搜索框是这次 innerHTML **新建**的，监听得就地挂：全局委托只管 click，
       input 事件委托不到；而 paintLogFile 只改 #logPre，不会把这个 input 换掉，
       所以挂一次就够（不用每次重画都重绑）。 */
    var fin = $('#logFind');
    if (fin) fin.addEventListener('input', function () {
      S.logfile.q = fin.value.trim();
      paintLogFile();
    });
    /* 内容交给 paintLogFile 填（顺带贴到底），和切「只看错误」走同一条路 ——
       两处各写一遍的话，改了一处忘了另一处就不一致了。 */
    paintLogFile();
    if (!lines.length) $('#logPre').innerHTML = '（空文件）';
  } catch (e) {
    $('#shB').innerHTML = '<div class="empty">读取失败：' + esc(e.message) + '</div>';
  }
}

/* ================= 分段控件（单选组） =================
   弹层内容每次都是重新渲染的，所以监听得在渲染之后重新挂。 */
function bindSeg(sel) {
  var box = $(sel);
  if (!box) return;
  box.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-segval]') : null;
    if (!b) return;
    $$(sel + ' button').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
  });
}
function segVal(sel) {
  var b = $(sel + ' button.on');
  return b ? b.dataset.segval : '';
}
function segHtml(id, opts, sel) {
  var h = '<div class="seg" id="' + id + '">';
  opts.forEach(function (o) {
    h += '<button type="button" data-segval="' + esc(o.v) + '"' +
         (o.v === sel ? ' class="on"' : '') + '>' + esc(o.t) + '</button>';
  });
  return h + '</div>';
}

/* ================= 脚本管理 =================
   GET /api/scripts 不带 path 时返回的是「递归整棵树」（后端 readDirs），带 path 才只回一层
   （readDir）。这里一次拿整棵树，靠 S.scripts.path 在本地下钻 —— 跟日志那套一样，
   翻目录不用再打一次网络。

   接口的 path 参数语义是「从脚本根目录算起的相对路径」，根目录是空字符串
   （后端会 join(scriptPath, path)）。所以这里直接用「逐层 title 拼出来的相对路径」，
   不依赖返回的 key 到底长什么样 —— key 的格式换版本是会变的，title 不会。 */
/* ---------- 脚本树 ---------- */
/* 相对路径拼接。dir 是「从脚本根目录算起」的路径，根是空串 —— 跟接口的 path 语义一致。 */
function scrKey(dir, title) { return dir ? dir + '/' + title : title; }
function scrExpanded(key) { return !!S.scripts.expanded[key]; }

/* 点文件夹右边的箭头：只在本机展开/收起，不打网络（整棵树早就在内存里了）。 */
function toggleScrDir(key) {
  if (S.scripts.expanded[key]) delete S.scripts.expanded[key];
  else S.scripts.expanded[key] = 1;
  renderScripts();
}

/* 摊平成一行行。all=true 时不管展开状态全摊平（搜索要用，否则搜不到收起目录里的文件）。 */
function flattenScripts(nodes, dir, depth, all, out) {
  (nodes || []).forEach(function (n) {
    var isDir = n.type === 'directory';
    var key = scrKey(dir, n.title);
    out.push({ n: n, dir: dir, key: key, depth: depth, isDir: isDir });
    if (isDir && (all || scrExpanded(key))) flattenScripts(n.children, key, depth + 1, all, out);
  });
  return out;
}

/* 按「相对路径 + 名字」定位节点。不同目录下可以有同名文件，所以必须用完整相对路径，
   不能只按 title 找 —— 只按 title 会拿到别的目录里的同名文件，改错对象。 */
function findScriptNode(dir, title) {
  var nodes = S.scripts.nodes;
  var segs = String(dir == null ? '' : dir).split('/').filter(function (s) { return s; });
  for (var i = 0; i < segs.length; i++) {
    var hit = null;
    for (var j = 0; j < nodes.length; j++) if (nodes[j].title === segs[i]) { hit = nodes[j]; break; }
    if (!hit) return null;
    nodes = hit.children || [];
  }
  for (var k = 0; k < nodes.length; k++) if (nodes[k].title === title) return nodes[k];
  return null;
}

function countScripts(nodes) {
  var n = 0;
  (nodes || []).forEach(function (x) {
    n++;
    if (x.type === 'directory') n += countScripts(x.children);
  });
  return n;
}

function scrRow(r) {
  var n = r.n, isDir = r.isDir;
  var meta = [];
  if (!isDir && n.size != null) meta.push(fmtSize(n.size));
  if (isDir) meta.push((n.children || []).length + ' 项');
  var ft = fmtFileTime(n.createTime);
  if (ft) meta.push(ft);
  var open = isDir && scrExpanded(r.key);
  /* 1.0.25：搜索命中上黄底 —— 任务列表（1.0.23）和变量页早就有了，
     脚本树一直只是「列表变短了」，命中的是哪几个字还得自己找。同一个 logHi。
     搜索是按**完整路径**匹配的（见 renderScripts），命中可能只落在某一级目录名上；
     这时文件名里一个命中都没有，用户会不知道它为什么出现在结果里 ——
     所以那种情况下把父目录也画出来（同样上黄底）。 */
  var q = String(S.scripts.q || '');
  var ql = q.toLowerCase();
  var hitTitle = q && String(n.title || '').toLowerCase().indexOf(ql) >= 0;
  var hitDir = q && !hitTitle && r.dir && String(r.dir).toLowerCase().indexOf(ql) >= 0;
  /* 缩进用行内 --d 传给 CSS 的 padding-left（卡片背景跟着一起缩，不会被推窄）。 */
  return '<div class="item row ind" style="--d:' + r.depth + ';gap:8px">' +
    '<div class="fi2">' + (isDir ? '📁' : '📄') + '</div>' +
    '<button class="sp" style="text-align:left;min-width:0" data-scr="' + esc(n.title) +
      '" data-path="' + esc(r.dir) + '" data-scrtype="' + n.type + '">' +
      '<div class="ell" style="font-size:calc(14px*var(--fs));font-weight:' + (isDir ? 600 : 400) + '">' + logHi(n.title, q) + '</div>' +
      (hitDir ? '<div class="f11 t3 ell">在 ' + logHi(r.dir, q) + '/</div>' : '') +
      (meta.length ? '<div class="f11 t3 ell">' + esc(meta.join(' · ')) + '</div>' : '') +
    '</button>' +
    (isDir ? '<button class="tw' + (open ? ' on' : '') + '" data-scrtog="' + esc(r.key) + '">⌄</button>' : '') +
    '<button class="t3" style="padding:8px 2px 8px 8px;font-size:calc(17px*var(--fs))" data-sact="more" data-scr="' + esc(n.title) +
      '" data-path="' + esc(r.dir) + '" data-scrtype="' + n.type + '">⋯</button>' +
  '</div>';
}

function renderScripts() {
  var sc = S.scripts;
  var q = String(sc.q || '').trim().toLowerCase();
  var box = $('#scrList');
  var rows;

  if (q) {
    rows = flattenScripts(sc.nodes, '', 0, true, []).filter(function (r) {
      return (r.key + ' ' + r.n.title).toLowerCase().indexOf(q) >= 0;
    });
    $('#sub').textContent = rows.length ? (rows.length + ' 项匹配') : '';
  } else {
    rows = flattenScripts(sc.nodes, '', 0, false, []);
    $('#sub').textContent = sc.nodes.length ? (countScripts(sc.nodes) + ' 个文件 / 目录') : '';
  }

  if (sc.loading && !sc.nodes.length) {
    box.innerHTML = '<div class="center"><span class="spin"></span>加载中…</div>';
    return;
  }
  if (!rows.length) {
    box.innerHTML = '<div class="empty"><span class="ei">⌘</span>' +
      (q ? '没有匹配的脚本' : '脚本目录是空的') + '</div>';
    return;
  }
  box.innerHTML = rows.map(scrRow).join('');
}

/* 当前目录下的节点。按 title 逐层下钻（同一层里不会重名）。 */
function currentScriptNodes() {
  var nodes = S.scripts.nodes;
  for (var i = 0; i < S.scripts.path.length; i++) {
    var found = null;
    for (var j = 0; j < nodes.length; j++) if (nodes[j].title === S.scripts.path[i]) { found = nodes[j]; break; }
    if (!found) return [];
    nodes = found.children || [];
  }
  return nodes;
}

/* 目录被改名或删掉后，之前记下的路径就悬空了。这时得退回根目录，
   否则用户会卡在一个永远空白的列表上。 */
function scriptDirExists() {
  var nodes = S.scripts.nodes;
  for (var i = 0; i < S.scripts.path.length; i++) {
    var found = null;
    for (var j = 0; j < nodes.length; j++) if (nodes[j].title === S.scripts.path[i]) { found = nodes[j]; break; }
    if (!found) return false;
    nodes = found.children || [];
  }
  return true;
}

/* 当前所在目录的相对路径 —— 接口的 path 参数就用它。 */
function scriptDir() { return S.scripts.path.join('/'); }

async function loadScripts(path, force) {
  var sc = S.scripts;
  sc.path = path || [];
  if (force || !sc.nodes.length) {
    sc.loading = true;
    renderScripts();
    try {
      var r = await api('/api/scripts');
      sc.nodes = r.data || [];
    } catch (e) {
      toast(e.message, true);
      sc.nodes = [];
    } finally {
      sc.loading = false;
    }
  }
  if (sc.path.length && sc.nodes.length && !scriptDirExists()) sc.path = [];
  renderScripts();
}

async function openScriptEditor(node, dir) {
  if (!node) return;
  /* 目录要由调用方传进来：改成树形展开后没有「当前目录」这个概念了，
     再靠 scriptDir() 会永远拿到空串，等于把子目录里的文件当根目录的开。 */
  dir = dir || '';
  openSheet(node.title, '<div class="center"><span class="spin"></span>读取中…</div>');
  var content = '';
  try {
    var r = await api('/api/scripts/detail', { query: { path: dir, file: node.title } });
    content = r.data == null ? '' : String(r.data);
  } catch (e) {
    $('#shB').innerHTML = '<div class="empty">读取失败<br><span class="f12 t3">' + esc(e.message) + '</span></div>';
    return;
  }
  $('#shB').innerHTML =
    '<div class="f11 t3 mono ell" style="margin:0 4px 8px">' + esc((dir ? dir + '/' : '') + node.title) + '</div>' +
    '<textarea class="editor" id="scrBody" spellcheck="false" autocapitalize="off" autocorrect="off">' + esc(content) + '</textarea>' +
    '<div class="row" style="gap:8px;margin-top:14px">' +
      '<button class="btn pri" id="btnSaveScript" style="flex:1" data-file="' + esc(node.title) + '" data-path="' + esc(dir) + '">保存</button>' +
      '<button class="btn" id="btnRunScript" style="flex:1" data-file="' + esc(node.title) + '" data-path="' + esc(dir) + '">运行</button>' +
    '</div>' +
    '<div class="row" style="gap:8px;margin-top:10px">' +
      '<button class="btn" id="btnRenameScript" style="flex:1" data-file="' + esc(node.title) + '" data-path="' + esc(dir) + '">重命名</button>' +
      '<button class="btn danger" id="btnDelScript" style="flex:1" data-file="' + esc(node.title) + '" data-path="' + esc(dir) + '">删除</button>' +
    '</div>' +
    '<div class="f11 t3" style="margin:12px 4px;line-height:1.6">' +
      '「运行」执行的是编辑器里当前的内容（面板会写成 .swap 副本再跑），所以没保存也能先试一次。' +
      '运行输出在「⋯ → 查看运行日志」里看。</div>';
}

async function saveScript(dir, file) {
  var el = $('#scrBody');
  if (!el) return;
  var btn = $('#btnSaveScript');
  if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
  try {
    await api('/api/scripts', { method: 'PUT', body: { filename: file, path: dir || '', content: el.value } });
    toast('已保存');
    await loadScripts(S.scripts.path, true);
  } catch (e) {
    toast(e.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '保存'; }
  }
}

/* fromEditor=true 时用编辑器里的内容（未保存的改动也能试跑）；
   否则先把文件内容拉下来 —— 不然会把空内容写进 .swap 跑一个空脚本。 */
async function runScript(dir, file, fromEditor) {
  dir = dir || '';
  try {
    var content = '';
    if (fromEditor && $('#scrBody')) {
      content = $('#scrBody').value;
    } else {
      var d = await api('/api/scripts/detail', { query: { path: dir, file: file } });
      content = d.data == null ? '' : String(d.data);
    }

/* ---------- 上传 / 下载脚本 ---------- */
/* 上传走 POST /api/scripts 的 multipart 分支：后端用 multer 收，字段名固定是 file，
   另两个字段是 filename（落地的文件名）和 path（相对面板脚本目录的目录，空串=根）。
   走的是 api() 的 form 选项，绝不能自己设 Content-Type（浏览器要填 multipart 边界）。
   重名会覆盖（面板会先备份一份），所以先问一句。 */
/* dir 由入口传进来：顶栏「+」菜单 = 根目录，文件夹的 ⋯ 菜单 = 那个文件夹。
   文件选择器是异步回的，change 里没法再问「传到哪儿」，所以点菜单时先把目标
   记在 S.scripts.upDir 上，change 触发时再取。 */
async function uploadScript(input, dir) {
  var f = input && input.files && input.files[0];
  if (!f) return;
  if (dir == null) dir = S.scripts.upDir || '';
  var name = f.name || 'script.js';
  var exists = !!findScriptNode(dir, name);
  if (exists && !confirm((dir ? dir + '/' : '') + name + ' 已存在，上传会覆盖它（面板会先备份一份）。继续？')) {
    input.value = '';
    return;
  }
  try {
    var fd = new FormData();
    fd.append('filename', name);
    fd.append('path', dir);
    fd.append('file', f, name);
    await api('/api/scripts', { method: 'POST', form: fd });
    toast('已上传到 ' + (dir || '根目录') + '：' + name);
    /* 传到子目录里就把那层展开，否则看不到刚传上去的文件 */
    if (dir) S.scripts.expanded[dir] = 1;
    await loadScripts(S.scripts.path, true);
  } catch (e) {
    toast(e.message, true);
  } finally {
    /* 清掉选择器的值：不清的话同一个文件连选两次不会触发 change */
    input.value = '';
    S.scripts.upDir = '';
  }
}

/* 下载走 POST /api/scripts/download，回的是**文件字节流**（不是 {code,data}），
   所以用 apiBlob() 而不是 api()。存到手机那一步见 saveBlobToDevice()。 */
async function downloadScript(dir, file) {
  toast('读取中…');

}

/* 待回调的保存请求。壳保存完会调 window.__qlSaved(id, ok, msg)。 */
var saveCb = {};
/* 把一段文件内容存到手机。两条路：
   · 原生壳：读成 base64 交给壳 —— 用 base64 而不是文本，是因为脚本目录里可能有
     二进制文件，当文本传会把字节改坏。壳在 Android 10+ 直接写进「下载」目录（免权限），
     更老的系统退到系统「另存为」让用户选位置。
   · 浏览器（PWA）：a[download] + createObjectURL。 */
function saveBlobToDevice(name, blob) {
  if (!window.__QL_NATIVE__) return saveViaBrowser(name, blob);
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onerror = function () { reject(new Error('读取文件内容失败')); };
    fr.onload = function () {
      var s = String(fr.result || '');
      var i = s.indexOf(',');
      if (i < 0) return reject(new Error('文件内容异常'));
      var id = 'sv' + Date.now() + Math.floor(Math.random() * 1000);
      saveCb[id] = { resolve: resolve, reject: reject };
      try {
        window.QLNative.saveFile(name, s.slice(i + 1), id);
      } catch (e) {
        delete saveCb[id];
        reject(new Error('这台设备不支持直接保存'));
      }
    };
    fr.readAsDataURL(blob);
  });
}
function saveViaBrowser(name, blob) {
  try {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('已开始下载 ' + name);
    return Promise.resolve();
  } catch (e) {
    toast('这个环境不支持直接保存，请用 App 版', true);
    return Promise.reject(e);
  }
}
/* 壳保存完回调这里：成功时 msg 是保存位置，失败时是原因。 */
window.__qlSaved = function (cbId, ok, msg) {
  var c = saveCb[cbId];
  if (!c) return;
  delete saveCb[cbId];
  if (ok) { toast('已保存到 ' + msg); c.resolve(); }
  else { toast(msg || '保存失败', true); c.reject(new Error(msg || '保存失败')); }
};

/* ================= 依赖管理 =================
   类型在「列表查询」里是字符串（nodejs/python3/linux），在「新建/编辑的请求体」里
   却是数字（Joi.number().required()）。两边不一样，别搞混 —— 后端 DependenceTypes
   枚举 nodejs=0 python3=1 linux=2。

   状态也是数字（DependenceStatus）：
     0 安装中  1 已安装  2 安装失败  3 删除中  4 已删除  5 删除失败  6 队列中  7 已取消
   注意「已安装」是 1 不是 2，跟直觉反着来。 */
var DEP_TYPES = [
  { key: 'nodejs', num: 0, label: 'NodeJs' },
  { key: 'python3', num: 1, label: 'Python3' },
  { key: 'linux', num: 2, label: 'Linux' }
];
var DEP_STATUS = {
  0: { t: '安装中', c: 'orange' }, 1: { t: '已安装', c: 'green' },
  2: { t: '安装失败', c: 'red' }, 3: { t: '删除中', c: 'orange' },
  4: { t: '已删除', c: 'gray' }, 5: { t: '删除失败', c: 'red' },
  6: { t: '队列中', c: 'blue' }, 7: { t: '已取消', c: 'gray' }
};
function depTypeNum(key) {
  for (var i = 0; i < DEP_TYPES.length; i++) if (DEP_TYPES[i].key === key) return DEP_TYPES[i].num;
  return 0;
}
function depStatus(s) { return DEP_STATUS[s] || { t: '未知(' + s + ')', c: 'gray' }; }
/* 正在装 / 正在删 —— 这几种状态只能取消，重装会被面板拒掉 */
function depWorking(s) { return s === 0 || s === 3 || s === 6; }

function renderDeps() {
  var d = S.deps;
  $('#sub').textContent = d.list.length ? (d.list.length + ' 个依赖') : '';
  var box = $('#depList');
  if (d.loading && !d.list.length) {
    box.innerHTML = '<div class="center"><span class="spin"></span>加载中…</div>';
    return;
  }
  if (!d.list.length) {
    box.innerHTML = '<div class="empty"><span class="ei">◫</span>' + (d.q ? '没有匹配的依赖' : '这一类还没有依赖') + '</div>';
    return;
  }
  box.innerHTML = d.list.map(function (x) {
    var s = depStatus(x.status);
    var busy = depWorking(x.status);
    return '<div class="item">' +
      '<div class="row"><div class="nm sp mono" style="font-size:calc(14px*var(--fs))">' + esc(x.name) + '</div>' + pill(s) + '</div>' +
      (x.remark ? '<div class="f11 t3" style="margin-top:5px">' + esc(x.remark) + '</div>' : '') +
      '<div class="f11 t3" style="margin-top:5px">更新于 ' + esc(fmtWhen(x.updatedAt)) + '</div>' +
      '<div class="row" style="gap:8px;margin-top:10px">' +
        '<button class="btn" style="flex:1;padding:8px" data-depact="log" data-id="' + x.id + '">日志</button>' +
        '<button class="btn" style="flex:1;padding:8px" data-depact="' + (busy ? 'cancel' : 'reinstall') + '" data-id="' + x.id + '">' + (busy ? '取消' : '重装') + '</button>' +
        '<button class="btn" style="flex:1;padding:8px" data-depact="more" data-id="' + x.id + '">更多</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function loadDeps() {
  var d = S.deps;

  d.loading = true;

    renderDeps();

/* ================= 订阅管理 =================
   alias（唯一值）是必填的，但它不是用户填的 —— 面板从 url + 分支 + 类型算出来。
   算法照搬面板前端 formatAlias：按类型挑正则 → 取捕获组 → 把 / 和 . 换成 _ →
   有分支再拼 _分支。算不出来（链接格式不认）时得提前拦住，否则后端只会回一个
   语焉不详的校验错误。 */
var SUB_STATUS = {
  0: { t: '运行中', c: 'green' }, 1: { t: '空闲', c: 'blue' },
  2: { t: '已禁用', c: 'gray' }, 3: { t: '排队中', c: 'orange' }
};
var SUB_TYPES = [
  { v: 'public-repo', t: '公开仓库' },
  { v: 'private-repo', t: '私有仓库' },
  { v: 'file', t: '单文件' }
];
var SUB_SCHED = [{ v: 'crontab', t: 'crontab' }, { v: 'interval', t: '间隔' }];
var SUB_PULL = [{ v: 'ssh-key', t: '私钥' }, { v: 'user-pwd', t: '用户名密码' }];
var SUB_IVAL = [{ v: 'minutes', t: '分' }, { v: 'hours', t: '时' }, { v: 'days', t: '天' }];

function subStatus(s) { return SUB_STATUS[s] || { t: '未知', c: 'gray' }; }
function subTypeName(v) {
  for (var i = 0; i < SUB_TYPES.length; i++) if (SUB_TYPES[i].v === v) return SUB_TYPES[i].t;
  return v || '—';
}
var RE_REPO = /([^\/\:]+\/[^\/]+)(?=\.git)/;
var RE_FILE = /([^\/\:]+\/[^\/\.]+)\.[a-z]+(\?[^\s]*)?(#.*)?$/;
function formatAlias(url, branch, type) {
  var a = '';
  var re = type === 'file' ? RE_FILE : RE_REPO;
  if (url && re.test(url)) a = url.match(re)[1].replace(/\//g, '_').replace(/\./g, '_');
  if (branch) a += '_' + branch;
  return a;
}
function subScheduleText(x) {
  if (x.schedule_type === 'interval' && x.interval_schedule) {
    var m = { minutes: '分', hours: '时', days: '天', seconds: '秒' };
    return '每 ' + x.interval_schedule.value + (m[x.interval_schedule.type] || x.interval_schedule.type);
  }
  return x.schedule || '—';
}

function renderSubs() {
  var s = S.subs;
  $('#sub').textContent = s.list.length ? (s.list.length + ' 个订阅') : '';
  var box = $('#subList');
  if (s.loading && !s.list.length) {
    box.innerHTML = '<div class="center"><span class="spin"></span>加载中…</div>';
    return;
  }
  if (!s.list.length) {
    box.innerHTML = '<div class="empty"><span class="ei">⇅</span>' + (s.q ? '没有匹配的订阅' : '还没有订阅') + '</div>';
    return;
  }
  box.innerHTML = s.list.map(function (x) {
    var st = subStatus(x.status);
    var running = x.status === 0 || x.status === 3;
    var tags = '<span class="tag">' + esc(subTypeName(x.type)) + '</span>' +
               '<span class="tag">' + esc(subScheduleText(x)) + '</span>';
    if (x.branch) tags += '<span class="tag">' + esc(x.branch) + '</span>';
    if (x.autoAddCron === false) tags += '<span class="tag">不自动加任务</span>';
    return '<div class="item">' +
      '<div class="row"><div class="nm sp">' + esc(x.name || x.alias || '未命名订阅') + '</div>' + pill(st) + '</div>' +
      '<div class="tags">' + tags + '</div>' +
      '<div class="f11 t2 mono ell" style="margin-top:6px">' + esc(x.url || '') + '</div>' +
      (x.updatedAt ? '<div class="f11 t3" style="margin-top:4px">更新于 ' + esc(fmtWhen(x.updatedAt)) + '</div>' : '') +
      '<div class="row" style="gap:8px;margin-top:10px">' +
        '<button class="btn" style="flex:1;padding:8px" data-subact="' + (running ? 'stop' : 'run') + '" data-id="' + x.id + '">' + (running ? '停止' : '运行') + '</button>' +
        '<button class="btn" style="flex:1;padding:8px" data-subact="log" data-id="' + x.id + '">日志</button>' +
        '<button class="btn" style="flex:1;padding:8px" data-subact="more" data-id="' + x.id + '">更多</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function loadSubs() {
  var s = S.subs;
  if (s.loading) return;
  s.loading = true;
  renderSubs();
  try {
    var r = await api('/api/subscriptions', { query: { searchValue: s.q } });
    s.list = r.data || [];
  } catch (e) {
    toast(e.message, true);
    s.list = [];
  } finally {
    s.loading = false;
    renderSubs();
  }
}

async function subAction(id, act) {
  id = Number(id);
  var label = '';
  try {
    if (act === 'run') { label = '已开始拉取'; await api('/api/subscriptions/run', { method: 'PUT', body: [id] }); }
    else if (act === 'stop') { label = '已停止'; await api('/api/subscriptions/stop', { method: 'PUT', body: [id] }); }
    else if (act === 'enable') { label = '已启用'; await api('/api/subscriptions/enable', { method: 'PUT', body: [id] }); }
    else if (act === 'disable') { label = '已禁用'; await api('/api/subscriptions/disable', { method: 'PUT', body: [id] }); }
    else if (act === 'delete') { label = '已删除（保留文件）'; await api('/api/subscriptions', { method: 'DELETE', body: [id] }); }
    else if (act === 'forcedel') { label = '已删除（含文件）'; await api('/api/subscriptions', { method: 'DELETE', body: [id], query: { force: true } }); }
    else return;
    toast(label);
    closeSheet();
    setTimeout(loadSubs, act === 'run' ? 900 : 500);
  } catch (e) {
    toast(e.message, true);
  }
}

async function saveSub(id) {
  var url = $('#suUrl') ? $('#suUrl').value.trim() : '';
  if (!url) return toast('订阅链接不能为空', true);
  var type = segVal('#suTypeSeg') || 'public-repo';
  var schedType = segVal('#suSchedSeg') || 'crontab';
  var alias = $('#suAlias') ? $('#suAlias').value.trim() : '';
  if (!alias) return toast('这个链接识别不出唯一值。请填完整的仓库地址（…/user/repo.git）或文件地址。', true);

  var body = {
    type: type,
    url: url,
    alias: alias,
    schedule_type: schedType,
    autoAddCron: $('#suAutoAdd') ? $('#suAutoAdd').checked : true,
    autoDelCron: $('#suAutoDel') ? $('#suAutoDel').checked : true
  };
  var name = $('#suName') ? $('#suName').value.trim() : '';
  if (name) body.name = name;

  if (schedType === 'interval') {
    var val = Number($('#suIval') ? $('#suIval').value.trim() : '');
    if (!(val > 0)) return toast('间隔要是大于 0 的数字', true);
    body.interval_schedule = { type: segVal('#suIvalSeg') || 'hours', value: val };
  } else {
    var cron = $('#suCron') ? $('#suCron').value.trim() : '';
    if (!cron) return toast('定时规则不能为空', true);
    body.schedule = cron;
  }

  if (type !== 'file') {
    body.branch = $('#suBranch') ? $('#suBranch').value.trim() : '';
    body.whitelist = $('#suWhite') ? $('#suWhite').value : '';
    body.blacklist = $('#suBlack') ? $('#suBlack').value : '';
    body.dependences = $('#suDeps') ? $('#suDeps').value.trim() : '';
    body.extensions = $('#suExt') ? $('#suExt').value.trim() : '';
    body.sub_before = $('#suBefore') ? $('#suBefore').value.trim() : '';
    body.sub_after = $('#suAfter') ? $('#suAfter').value.trim() : '';
  }
  if (type === 'private-repo') {
    body.pull_type = segVal('#suPullSeg') || 'ssh-key';
    if (body.pull_type === 'ssh-key') {
      var k = $('#suKey') ? $('#suKey').value.trim() : '';
      if (!k) return toast('请填私钥', true);
      body.pull_option = { private_key: k };
    } else {
      var u = $('#suUser') ? $('#suUser').value.trim() : '';
      var p = $('#suPwd') ? $('#suPwd').value : '';
      if (!u || !p) return toast('请填用户名和密码 / Token', true);
      body.pull_option = { username: u, password: p };
    }
  }
  var proxy = $('#suProxy') ? $('#suProxy').value.trim() : '';
  if (proxy) body.proxy = proxy;
  if (id) body.id = Number(id);

  var btn = $('#btnSaveSub');
  if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }
  try {
    if (id) await api('/api/subscriptions', { method: 'PUT', body: body });
    else await api('/api/subscriptions', { method: 'POST', body: body });
    toast(id ? '已保存' : '已创建');
    closeSheet();
    setTimeout(loadSubs, 400);
  } catch (e) {
    toast(e.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = id ? '保存' : '创建'; }
  }
}

   只有三个接口：files 列目录、detail 读正文、save 写回去。
